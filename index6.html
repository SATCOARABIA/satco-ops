            </div>
            <div className="field">
              <label>PO Value</label>
              <input type="number" step="0.01" name="po_value" defaultValue={extracted.po_value ?? 0} required />
              {(extracted.po_value === null || extracted.po_value === undefined) && <div className="hint-text">Not detected by AI — defaulted to 0.</div>}
            </div>
            <div className="field"><label>Payment Terms (days)</label><input type="number" name="payment_terms_days" defaultValue={extracted.payment_terms_days ?? 30} required /></div>
            <div className="field" style={{gridColumn:"1/-1"}}><label>Remarks</label><input name="remarks" placeholder="Optional notes about this PO" /></div>
            <button className="btn-primary" type="submit">Confirm &amp; Save</button>
          </form>
        )}
      </div>

      <div className="content-card">
        <h3>Purchase Orders</h3>
        <div className="table-scroll">
        <table className="data-table">
          <thead><tr><th>PO No.</th><th>PO Date</th><th>Expiry Date</th><th>Customer</th><th>Currency</th><th>Value</th><th>Status</th><th>Remarks</th><th>Actions</th></tr></thead>
          <tbody>
            {pos.map((po) => (
              editingId === po.id ? (
                <EditPoRow key={po.id} po={po} colSpan={9} onCancel={() => setEditingId(null)} onSaved={() => { setEditingId(null); load(); }} />
              ) : (
                <tr key={po.id}>
                  <td>{po.po_no}</td><td>{po.po_date}</td><td>{po.expiry_date || "—"}</td><td>{po.customers?.name || "—"}</td>
                  <td>{po.currency || "AED"}</td><td>{fmt(po.po_value)}</td><td>{po.status}</td><td>{po.remarks || "—"}</td>
                  <td>
                    {po.source_file_url && <button className="btn-mini" onClick={() => viewFile("po-documents", po.source_file_url)}>View</button>}
                    <button className="btn-mini" onClick={() => setEditingId(po.id)}>Edit</button>
                    <button className="btn-mini danger" disabled={deletingId === po.id} onClick={() => handleDelete(po)}>
                      {deletingId === po.id ? "Deleting…" : "Delete"}
                    </button>
                  </td>
                </tr>
              )
            ))}
            {pos.length === 0 && <tr className="empty-row"><td colSpan="9">No purchase orders yet.</td></tr>}
          </tbody>
        </table>
        </div>
      </div>
    </div>
  );
}

function EditInvoiceRow({ inv, colSpan, onCancel, onSaved }) {
  const [form, setForm] = useState({
    invoice_no: inv.invoice_no || "",
    invoice_date: inv.invoice_date || "",
    currency: inv.currency || "AED",
    invoice_value: inv.invoice_value ?? 0,
    period_from: inv.period_from || "",
    period_to: inv.period_to || "",
    payment_terms_days: inv.payment_terms_days ?? 30,
    status: inv.computed_status && inv.computed_status !== "Paid" && inv.computed_status !== "Overdue" ? inv.computed_status.toLowerCase() : "draft",
  });
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState(null);

  async function save() {
    setSaving(true);
    setErr(null);
    const invoiceNo = (form.invoice_no || "").trim();
    if (!invoiceNo) { setErr("Invoice No. is required."); setSaving(false); return; }
    const payload = {
      invoice_no: invoiceNo,
      invoice_date: form.invoice_date,
      currency: form.currency,
      invoice_value: Number(form.invoice_value) || 0,
      period_from: form.period_from || null,
      period_to: form.period_to || null,
      payment_terms_days: Number(form.payment_terms_days) || 30,
      status: form.status,
    };
    const { error } = await ops().from("invoices").update(payload).eq("id", inv.id);
    setSaving(false);
    if (error) {
      setErr(error.message?.includes("duplicate") ? `Invoice number "${invoiceNo}" is already in use.` : error.message);
      return;
    }
    onSaved();
  }

  return (
    <tr className="edit-row">
      <td colSpan={colSpan}>
        {err && <div className="alert-card">{err}</div>}
        <div className="form-grid">
          <div className="field"><label>Invoice No.</label><input value={form.invoice_no} onChange={(e)=>setForm({...form, invoice_no:e.target.value})} /></div>
          <div className="field"><label>Invoice Date</label><input type="date" value={form.invoice_date} onChange={(e)=>setForm({...form, invoice_date:e.target.value})} /></div>
          <div className="field"><label>Invoice Period - From</label><input type="date" value={form.period_from} onChange={(e)=>setForm({...form, period_from:e.target.value})} /></div>
          <div className="field"><label>Invoice Period - To</label><input type="date" value={form.period_to} onChange={(e)=>setForm({...form, period_to:e.target.value})} /></div>
          <div className="field">
            <label>Currency</label>
            <select value={form.currency} onChange={(e)=>setForm({...form, currency:e.target.value})}>
              <option value="AED">AED</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="INR">INR</option>
            </select>
          </div>
          <div className="field"><label>Invoice Value</label><input type="number" step="0.01" value={form.invoice_value} onChange={(e)=>setForm({...form, invoice_value:e.target.value})} /></div>
          <div className="field"><label>Payment Terms (days)</label><input type="number" value={form.payment_terms_days} onChange={(e)=>setForm({...form, payment_terms_days:e.target.value})} /></div>
          <div className="field">
            <label>Status</label>
            <select value={form.status} onChange={(e)=>setForm({...form, status:e.target.value})}>
              <option value="draft">draft</option>
              <option value="sent">sent</option>
              <option value="paid">paid</option>
              <option value="partially_paid">partially_paid</option>
              <option value="overdue">overdue</option>
            </select>
          </div>
          <div>
            <button type="button" className="btn-mini primary" disabled={saving} onClick={save}>{saving ? "Saving…" : "Save"}</button>
            <button type="button" className="btn-mini" onClick={onCancel}>Cancel</button>
          </div>
        </div>
      </td>
    </tr>
  );
}

function ManagePaymentsRow({ inv, colSpan, onClose, onChanged }) {
  const [payments, setPayments] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [adding, setAdding] = useState(false);
  const [addForm, setAddForm] = useState({ amount: Math.max(Number(inv.balance_due) || 0, 0), paid_date: new Date().toISOString().slice(0, 10), mode: "bank_transfer", remarks: "" });
  const [busy, setBusy] = useState(false);

  async function load() {
    setLoading(true);
    const { data, error } = await ops().from("payments").select("*").eq("invoice_id", inv.id).order("paid_date", { ascending: false });
    if (error) setErr(error.message);
    setPayments(data || []);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  function startEdit(p) {
    setErr(null);
    setEditingId(p.id);
    setEditForm({ amount: p.amount, paid_date: p.paid_date, mode: p.mode || "bank_transfer", remarks: p.remarks || "" });
  }

  async function saveEdit(id) {
    setBusy(true);
    setErr(null);
    const amount = Number(editForm.amount);
    if (!amount || amount <= 0) { setErr("Enter a payment amount greater than 0."); setBusy(false); return; }
    if (!editForm.paid_date) { setErr("Payment date is required."); setBusy(false); return; }
    const { error } = await ops().from("payments").update({ amount, paid_date: editForm.paid_date, mode: editForm.mode, remarks: editForm.remarks || null }).eq("id", id);
    setBusy(false);
    if (error) { setErr(error.message); return; }
    setEditingId(null);
    await load();
    onChanged();
  }

  async function deletePayment(p) {
    if (!window.confirm(`Delete this payment of ${fmt(p.amount)} dated ${p.paid_date}? This cannot be undone.`)) return;
    setBusy(true);
    setErr(null);
    const { error } = await ops().from("payments").delete().eq("id", p.id);
    setBusy(false);
    if (error) { setErr(error.message); return; }
    await load();
    onChanged();
  }

  async function addPayment() {
    setBusy(true);
    setErr(null);
    const amount = Number(addForm.amount);
    if (!amount || amount <= 0) { setErr("Enter a payment amount greater than 0."); setBusy(false); return; }
    if (!addForm.paid_date) { setErr("Payment date is required."); setBusy(false); return; }
    const { error } = await ops().from("payments").insert({ invoice_id: inv.id, amount, paid_date: addForm.paid_date, mode: addForm.mode, remarks: addForm.remarks || null });
    setBusy(false);
    if (error) { setErr(error.message); return; }
    setAdding(false);
    setAddForm({ amount: 0, paid_date: new Date().toISOString().slice(0, 10), mode: "bank_transfer", remarks: "" });
    await load();
    onChanged();
  }

  const totalPaid = payments.reduce((s, p) => s + Number(p.amount), 0);

  return (
    <tr className="edit-row">
      <td colSpan={colSpan}>
        {err && <div className="alert-card">{err}</div>}
        <div style={{ marginBottom: 10, fontSize: 13 }}>
          <strong>Payments recorded against {inv.invoice_no}</strong>
          <span style={{ marginLeft: 10, color: "var(--muted)" }}>
            Invoice value: {inv.currency || "AED"} {fmt(inv.invoice_value)} — Total paid: {fmt(totalPaid)}
          </span>
        </div>
        {loading ? (
          <p>Loading…</p>
        ) : payments.length === 0 ? (
          <p style={{ color: "var(--muted)", fontSize: 13 }}>No payments recorded yet.</p>
        ) : (
          <table className="data-table" style={{ marginBottom: 12 }}>
            <thead><tr><th>Payment Date</th><th>Amount</th><th>Mode</th><th>Remarks</th><th>Actions</th></tr></thead>
            <tbody>
              {payments.map((p) => (
                editingId === p.id ? (
                  <tr key={p.id}>
                    <td><input type="date" value={editForm.paid_date} onChange={(e)=>setEditForm({...editForm, paid_date:e.target.value})} /></td>
                    <td><input type="number" step="0.01" value={editForm.amount} onChange={(e)=>setEditForm({...editForm, amount:e.target.value})} style={{ width: 110 }} /></td>
                    <td>
                      <select value={editForm.mode} onChange={(e)=>setEditForm({...editForm, mode:e.target.value})}>
                        <option value="bank_transfer">Bank Transfer</option>
                        <option value="cash">Cash</option>
                        <option value="cheque">Cheque</option>
                        <option value="card">Card</option>
                        <option value="other">Other</option>
                      </select>
                    </td>
                    <td><input type="text" value={editForm.remarks} onChange={(e)=>setEditForm({...editForm, remarks:e.target.value})} placeholder="Optional" style={{ width: 160 }} /></td>
                    <td>
                      <button className="btn-mini primary" disabled={busy} onClick={() => saveEdit(p.id)}>Save</button>
                      <button className="btn-mini" onClick={() => setEditingId(null)}>Cancel</button>
                    </td>
                  </tr>
                ) : (
                  <tr key={p.id}>
                    <td>{p.paid_date}</td><td>{fmt(p.amount)}</td><td>{(p.mode || "").replace("_", " ")}</td>
                    <td>{p.remarks || "—"}</td>
                    <td>
                      <button className="btn-mini" onClick={() => startEdit(p)}>Edit</button>
                      <button className="btn-mini danger" disabled={busy} onClick={() => deletePayment(p)}>Delete</button>
                    </td>
                  </tr>
                )
              ))}
            </tbody>
          </table>
        )}
        {adding ? (
          <div className="form-grid" style={{ marginBottom: 10 }}>
            <div className="field"><label>Payment Amount ({inv.currency || "AED"})</label><input type="number" step="0.01" value={addForm.amount} onChange={(e)=>setAddForm({...addForm, amount:e.target.value})} /></div>
            <div className="field"><label>Payment Date</label><input type="date" value={addForm.paid_date} onChange={(e)=>setAddForm({...addForm, paid_date:e.target.value})} /></div>
            <div className="field">
              <label>Mode</label>
              <select value={addForm.mode} onChange={(e)=>setAddForm({...addForm, mode:e.target.value})}>
                <option value="bank_transfer">Bank Transfer</option>
                <option value="cash">Cash</option>
                <option value="cheque">Cheque</option>
                <option value="card">Card</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div className="field"><label>Remarks</label><input type="text" value={addForm.remarks} onChange={(e)=>setAddForm({...addForm, remarks:e.target.value})} placeholder="Optional" /></div>
            <div>
              <button type="button" className="btn-mini primary" disabled={busy} onClick={addPayment}>{busy ? "Saving…" : "Add Payment"}</button>
              <button type="button" className="btn-mini" onClick={() => setAdding(false)}>Cancel</button>
            </div>
          </div>
        ) : (
          <button type="button" className="btn-mini primary" onClick={() => setAdding(true)} style={{ marginBottom: 10 }}>+ Add Payment</button>
        )}
        <div>
          <button type="button" className="btn-mini" onClick={onClose}>Close</button>
        </div>
      </td>
    </tr>
  );
}

function Invoices() {
  const [invoices, setInvoices] = useState([]);
  const [openPos, setOpenPos] = useState([]);
  const [error, setError] = useState(null);
  const [saving, setSaving] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [payingId, setPayingId] = useState(null);
  const [deletingId, setDeletingId] = useState(null);

  async function load() {
    const [{ data: inv }, { data: p }] = await Promise.all([
      ops().from("invoice_summary").select("*").order("invoice_date", { ascending: false }),
      ops().from("purchase_orders").select("id, po_no, po_value, payment_terms_days, customer_id, customers(name)").neq("status", "closed"),
    ]);
    setInvoices(inv || []);
    setOpenPos(p || []);
  }
  useEffect(() => { load(); }, []);

  async function handleDelete(inv) {
    if (!window.confirm(`Delete invoice ${inv.invoice_no}? This cannot be undone.`)) return;
    setDeletingId(inv.id);
    setError(null);
    const { error: delErr } = await ops().from("invoices").delete().eq("id", inv.id);
    setDeletingId(null);
    if (delErr) {
      setError(
        delErr.message?.includes("foreign key")
          ? `Can't delete ${inv.invoice_no} — it has payments recorded against it. Remove those payments first.`
          : delErr.message
      );
      return;
    }
    load();
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const f = new FormData(e.target);
    setSaving(true);
    setError(null);
    try {
      const poId = f.get("po_id");
      const invoiceDate = f.get("invoice_date");
      const invoiceValue = Number(f.get("invoice_value"));
      const currency = f.get("currency") || "AED";
      const periodFrom = f.get("period_from") || null;
      const periodTo = f.get("period_to") || null;
      const invoiceNoOverride = (f.get("invoice_no") || "").trim();
      const po = openPos.find((p) => p.id === poId);
      if (!po) throw new Error("Select a valid PO");

      let invoiceNo = invoiceNoOverride;
      if (!invoiceNo) {
        const { data: generatedNo, error: numErr } = await ops().rpc("next_invoice_number", { p_invoice_date: invoiceDate, p_series_code: "01" });
        if (numErr) throw numErr;
        invoiceNo = generatedNo;
      }

      let sourceFileUrl = null;
      const file = f.get("invoice_file");
      if (file && file.size > 0) {
        const path = `${Date.now()}-${file.name}`;
        const { error: upErr } = await sb.storage.from("invoice-documents").upload(path, file);
        if (upErr) throw upErr;
        sourceFileUrl = path;
      }

      const { error: insErr } = await ops().from("invoices").insert({
        invoice_no: invoiceNo,
        invoice_date: invoiceDate,
        po_id: po.id,
        customer_id: po.customer_id,
        invoice_value: invoiceValue,
        currency,
        period_from: periodFrom,
        period_to: periodTo,
        payment_terms_days: po.payment_terms_days || 30,
        status: "draft",
        source_file_url: sourceFileUrl,
      });
      if (insErr) throw insErr;
      e.target.reset();
      load();
    } catch (err) {
      setError(err.message || "Failed to create invoice");
    } finally {
      setSaving(false);
    }
  }

  return (
    <div>
      <div className="content-card">
        <h3>Raise a new invoice against a PO</h3>
        <form onSubmit={handleSubmit} className="form-grid">
          <div className="field">
            <label>Purchase Order</label>
            <select name="po_id" required>
              <option value="">Select PO…</option>
              {openPos.map((po) => (
                <option key={po.id} value={po.id}>{po.po_no} — {po.customers?.name || "Unknown"} ({fmt(po.po_value)})</option>
              ))}
            </select>
          </div>
          <div className="field"><label>Invoice Date</label><input type="date" name="invoice_date" required /></div>
          <div className="field"><label>Invoice Period - From</label><input type="date" name="period_from" /></div>
          <div className="field"><label>Invoice Period - To</label><input type="date" name="period_to" /></div>
          <div className="field">
            <label>Currency</label>
            <select name="currency" defaultValue="AED">
              <option value="AED">AED</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="INR">INR</option>
            </select>
          </div>
          <div className="field"><label>Invoice Value</label><input type="number" step="0.01" name="invoice_value" required /></div>
          <div className="field"><label>Invoice No. (optional)</label><input name="invoice_no" placeholder="Leave blank to auto-generate" /></div>
          <div className="field"><label>Attach Invoice Document (optional)</label><input type="file" name="invoice_file" accept="application/pdf,image/*" /></div>
          <button className="btn-primary" type="submit" disabled={saving}>{saving ? "Saving…" : "Generate Number & Save"}</button>
        </form>
        {error && <div className="alert-card">{error}</div>}
      </div>

      <div className="content-card">
        <h3>Invoices</h3>
        <div className="table-scroll">
        <table className="data-table">
          <thead><tr><th>Invoice No.</th><th>Date</th><th>PO</th><th>Customer</th><th>Period From</th><th>Period To</th><th>Currency</th><th>Value</th><th>Paid</th><th>Balance</th><th>Due Date</th><th>Paid Date</th><th>Days Delayed</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            {invoices.map((inv) => (
              editingId === inv.id ? (
                <EditInvoiceRow key={inv.id} inv={inv} colSpan={15} onCancel={() => setEditingId(null)} onSaved={() => { setEditingId(null); load(); }} />
              ) : payingId === inv.id ? (
                <ManagePaymentsRow key={inv.id} inv={inv} colSpan={15} onClose={() => setPayingId(null)} onChanged={() => load()} />
              ) : (
                <tr key={inv.id} className={inv.computed_status === "Paid" ? "row-paid" : ""}>
                  <td>{inv.invoice_no}</td><td>{inv.invoice_date}</td><td>{inv.po_no}</td><td>{inv.customer_name}</td>
                  <td>{inv.period_from || "—"}</td><td>{inv.period_to || "—"}</td>
                  <td>{inv.currency || "AED"}</td><td>{fmt(inv.invoice_value)}</td><td>{fmt(inv.amount_paid)}</td><td>{fmt(inv.balance_due)}</td>
                  <td>{inv.due_date}</td>
                  <td>{inv.paid_date || "—"}</td>
                  <td className={inv.days_delayed > 0 ? "badge-overdue" : ""}>{inv.days_delayed}</td>
                  <td className={inv.computed_status === "Paid" ? "badge-paid" : ""}>{inv.computed_status}</td>
                  <td>
                    {inv.source_file_url && <button className="btn-mini" onClick={() => viewFile("invoice-documents", inv.source_file_url)}>View</button>}
                    <button className="btn-mini primary" onClick={() => setPayingId(inv.id)}>Payments</button>
                    <button className="btn-mini" onClick={() => setEditingId(inv.id)}>Edit</button>
                    <button className="btn-mini danger" disabled={deletingId === inv.id} onClick={() => handleDelete(inv)}>
                      {deletingId === inv.id ? "Deleting…" : "Delete"}
                    </button>
                  </td>
                </tr>
              )
            ))}
            {invoices.length === 0 && <tr className="empty-row"><td colSpan="13">No invoices yet.</td></tr>}
          </tbody>
        </table>
        </div>
      </div>
    </div>
  );
}

function EditPettyCashRow({ entry, colSpan, onCancel, onSaved }) {
  const [form, setForm] = useState({
    entry_date: entry.entry_date || "",
    account: entry.account || "",
    purpose: entry.purpose || "",
    supplier: entry.supplier || "",
    category: entry.category || "",
    ledger_folio: entry.ledger_folio || "",
    payment_mode: entry.payment_mode || "",
    amount: entry.amount ?? 0,
    approved_by: entry.approved_by || "",
  });
  const [file, setFile] = useState(null);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState(null);

  async function save() {
    setSaving(true);
    setErr(null);
    try {
      let receiptUrl = entry.receipt_url || null;
      if (file) {
        const path = Date.now() + "-" + file.name;
        const { error: upErr } = await sb.storage.from("petty-cash-receipts").upload(path, file);
        if (upErr) throw upErr;
        receiptUrl = path;
      }
      const payload = {
        entry_date: form.entry_date,
        account: form.account || null,
        purpose: form.purpose,
        supplier: form.supplier || null,
        category: form.category || null,
        ledger_folio: form.ledger_folio || null,
        payment_mode: form.payment_mode || null,
        amount: Number(form.amount) || 0,
        approved_by: form.approved_by || null,
        receipt_url: receiptUrl,
      };
      const { error } = await ops().from("petty_cash").update(payload).eq("id", entry.id);
      if (error) throw error;
      onSaved();
    } catch (e) {
      setErr(e.message || "Save failed");
    } finally {
      setSaving(false);
    }
  }

  return (
    <tr className="edit-row">
      <td colSpan={colSpan}>
        {err && <div className="alert-card">{err}</div>}
        <div className="form-grid">
          <div className="field"><label>Date</label><input type="date" value={form.entry_date} onChange={(e)=>setForm({...form, entry_date:e.target.value})} /></div>
          <div className="field"><label>Account</label><input value={form.account} onChange={(e)=>setForm({...form, account:e.target.value})} placeholder="e.g. Aswani" /></div>
          <div className="field"><label>Particulars</label><input value={form.purpose} onChange={(e)=>setForm({...form, purpose:e.target.value})} /></div>
          <div className="field"><label>Supplier</label><input value={form.supplier} onChange={(e)=>setForm({...form, supplier:e.target.value})} /></div>
          <div className="field"><label>Bill Ref / Folio</label><input value={form.ledger_folio} onChange={(e)=>setForm({...form, ledger_folio:e.target.value})} /></div>
          <div className="field"><label>Payment Mode</label><input value={form.payment_mode} onChange={(e)=>setForm({...form, payment_mode:e.target.value})} /></div>
          <div className="field"><label>Category</label><input value={form.category} onChange={(e)=>setForm({...form, category:e.target.value})} /></div>
          <div className="field"><label>Amount</label><input type="number" step="0.01" value={form.amount} onChange={(e)=>setForm({...form, amount:e.target.value})} /></div>
          <div className="field"><label>Approved By</label><input value={form.approved_by} onChange={(e)=>setForm({...form, approved_by:e.target.value})} /></div>
          <div className="field"><label>Replace Bill/Receipt</label><input type="file" accept="image/*,.pdf" onChange={(e)=>setFile(e.target.files[0]||null)} /></div>
          <div>
            <button type="button" className="btn-mini primary" disabled={saving} onClick={save}>{saving ? "Saving…" : "Save"}</button>
            <button type="button" className="btn-mini" onClick={onCancel}>Cancel</button>
          </div>
        </div>
      </td>
    </tr>
  );
}

function excelValueToISODate(v) {
  if (v instanceof Date && !isNaN(v)) {
    // SheetJS's cellDates conversion can leave the timestamp a few seconds off true midnight
    // (floating-point drift in its serial->ms conversion), which can push getUTCDate() to the
    // wrong calendar day. Round to the nearest whole day first to recover the intended date.
    const rounded = new Date(Math.round(v.getTime() / 86400000) * 86400000);
    const y = rounded.getUTCFullYear(), m = String(rounded.getUTCMonth() + 1).padStart(2, "0"), d = String(rounded.getUTCDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }
  if (typeof v === "number" && window.XLSX && XLSX.SSF && XLSX.SSF.parse_date_code) {
    const parsed = XLSX.SSF.parse_date_code(v);
    if (parsed) return parsed.y + "-" + String(parsed.m).padStart(2, "0") + "-" + String(parsed.d).padStart(2, "0");
  }
  if (typeof v === "string") {
    // Some source files store dates as plain text in DD.MM.YYYY or DD/MM/YYYY (day-first) format
    // rather than real Excel date cells. JS's native Date parser treats these ambiguously (and
    // silently fails whenever the day is >12), so parse this unambiguous day-first pattern explicitly
    // before falling back to the generic parser below.
    const m = v.trim().match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
    if (m) {
      const d = Number(m[1]), mo = Number(m[2]), y = Number(m[3]);
      if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) {
        return y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0");
      }
    }
  }
  if (v) {
    const parsed = new Date(v);
    if (!isNaN(parsed)) {
      const rounded = new Date(Math.round(parsed.getTime() / 86400000) * 86400000);
      return rounded.getUTCFullYear() + "-" + String(rounded.getUTCMonth() + 1).padStart(2, "0") + "-" + String(rounded.getUTCDate()).padStart(2, "0");
    }
  }
  return null;
}

// Parses a Tally-style "Petty Cash Book" export: Date | Dr/Cr flag | Particulars | .. | Vch Type | Vch No. | Debit | Credit,
// with wrapped description text on the row(s) following each dated transaction.
function parseTallyPettyCash(rows) {
  let headerRow = -1, dateIdx = -1, debitIdx = -1, creditIdx = -1, vchNoIdx = -1, vchTypeIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 25); i++) {
    const row = rows[i] || [];
    const lower = row.map((c) => String(c == null ? "" : c).trim().toLowerCase());
    const dIdx = lower.indexOf("date");
    const debIdx = lower.indexOf("debit");
    const crIdx = lower.indexOf("credit");
    if (dIdx >= 0 && debIdx >= 0 && crIdx >= 0) {
      headerRow = i; dateIdx = dIdx; debitIdx = debIdx; creditIdx = crIdx;
      vchTypeIdx = lower.indexOf("vch type");
      vchNoIdx = lower.findIndex((c) => c.indexOf("vch no") === 0);
      break;
    }
  }
  if (headerRow === -1) return null; // not a Tally-style sheet

  const flagIdx = dateIdx + 1;
  const textIdx = dateIdx + 2;
  const isNumericOnly = (s) => /^[\d,.\s]+$/.test(s);
  const entries = [];
  let i = headerRow + 1;
  while (i < rows.length) {
    const row = rows[i] || [];
    const iso = excelValueToISODate(row[dateIdx]);
    if (iso) {
      let particulars = String(row[textIdx] == null ? "" : row[textIdx]).trim();
      const debit = Number(row[debitIdx]) || 0;
      const credit = Number(row[creditIdx]) || 0;
      const vchNo = vchNoIdx >= 0 ? String(row[vchNoIdx] == null ? "" : row[vchNoIdx]).trim() : "";
      const vchType = vchTypeIdx >= 0 ? String(row[vchTypeIdx] == null ? "" : row[vchTypeIdx]).trim() : "";
      let j = i + 1;
      const extraLines = [];
      while (j < rows.length) {
        const nrow = rows[j] || [];
        if (excelValueToISODate(nrow[dateIdx])) break;
        const ntext = String(nrow[textIdx] == null ? "" : nrow[textIdx]).trim();
        const nflag = String(nrow[flagIdx] == null ? "" : nrow[flagIdx]).trim().toLowerCase();
        if (nflag === "dr" || nflag === "cr") break;
        if (ntext && !isNumericOnly(ntext)) extraLines.push(ntext);
        j++;
      }
      if (extraLines.length) particulars = (particulars ? particulars + " - " : "") + extraLines.join("; ");
      if (debit > 0 || credit > 0) {
        entries.push({
          entry_date: iso,
          purpose: particulars || "(no description)",
          category: vchType || null,
          ledger_folio: vchNo || null,
          amount: debit > 0 ? debit : credit,
          entry_type: debit > 0 ? "receipt" : "payment",
        });
      }
      i = j;
    } else {
      i++;
    }
  }
  return entries;
}

// Parses the SATCO "Petty Cash Form ST" template (sheet "Petty Cash Form ST..."): a header block
// with the account holder's name on the "Currency:" labeled row, then a table with columns
// No. | Date | Bill Ref | Supplier | Details | Cheque No./Payment Mode | Incomes | Expenses | VAT | ...
function parseSatcoPettyCashForm(rows) {
  let accountRow = -1, accountCol = -1;
  for (let i = 0; i < Math.min(rows.length, 10); i++) {
    const row = rows[i] || [];
    for (let c = 0; c < row.length; c++) {
      if (String(row[c] == null ? "" : row[c]).trim().toLowerCase() === "currency:") {
        accountRow = i;
        for (let c2 = c + 1; c2 < row.length; c2++) {
          if (String(row[c2] == null ? "" : row[c2]).trim()) { accountCol = c2; break; }
        }
        break;
      }
    }
    if (accountRow >= 0) break;
  }
  let account = null;
  if (accountRow >= 0 && accountCol >= 0) {
    account = String(rows[accountRow][accountCol]).trim().replace(/^SATCO\s+ARABIA\s*/i, "").trim() || null;
  }

  let headerRow = -1, dateIdx = -1, billRefIdx = -1, supplierIdx = -1, detailsIdx = -1, payModeIdx = -1, incomeIdx = -1, expenseIdx = -1, costCodeDescIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const row = rows[i] || [];
    const lower = row.map((c) => String(c == null ? "" : c).trim().toLowerCase());
    const dIdx = lower.indexOf("date");
    const incIdx = lower.findIndex((c) => c.indexOf("incomes") === 0);
    const expIdx = lower.findIndex((c) => c.indexOf("expenses") === 0);
    if (dIdx >= 0 && incIdx >= 0 && expIdx >= 0) {
      headerRow = i; dateIdx = dIdx; incomeIdx = incIdx; expenseIdx = expIdx;
      billRefIdx = lower.findIndex((c) => c.indexOf("bill ref") === 0);
      supplierIdx = lower.indexOf("supplier");
      detailsIdx = lower.indexOf("details");
      payModeIdx = lower.findIndex((c) => c.indexOf("cheque no") === 0 || c.indexOf("payment mode") >= 0);
      costCodeDescIdx = lower.findIndex((c) => c.indexOf("cost code") === 0 && c.indexOf("description") >= 0);
      break;
    }
  }
  if (headerRow === -1) return null; // not this template

  const entries = [];
  for (let i = headerRow + 1; i < rows.length; i++) {
    const row = rows[i] || [];
    const firstCell = String(row[0] == null ? "" : row[0]).trim().toLowerCase();
    if (firstCell === "summary" || firstCell === "previous balance:" || firstCell.indexOf("prepared by") === 0) break;
    const iso = excelValueToISODate(row[dateIdx]);
    const income = Number(row[incomeIdx]) || 0;
    const expense = Number(row[expenseIdx]) || 0;
    if (!iso || (income <= 0 && expense <= 0)) continue;
    const details = detailsIdx >= 0 ? String(row[detailsIdx] == null ? "" : row[detailsIdx]).trim() : "";
    const supplier = supplierIdx >= 0 ? String(row[supplierIdx] == null ? "" : row[supplierIdx]).trim() : "";
    const billRef = billRefIdx >= 0 ? String(row[billRefIdx] == null ? "" : row[billRefIdx]).trim() : "";
    const payMode = payModeIdx >= 0 ? String(row[payModeIdx] == null ? "" : row[payModeIdx]).trim() : "";
    const costCodeDesc = costCodeDescIdx >= 0 ? String(row[costCodeDescIdx] == null ? "" : row[costCodeDescIdx]).trim() : "";
    entries.push({
      entry_date: iso,
      account: account,
      purpose: details || supplier || "(no description)",
      supplier: supplier || null,
      ledger_folio: billRef || null,
      payment_mode: payMode || null,
      category: costCodeDesc || null,
      amount: income > 0 ? income : expense,
      entry_type: income > 0 ? "receipt" : "payment",
    });
  }
  return entries;
}

function PettyCash() {
  const [entries, setEntries] = useState([]);
  const [error, setError] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [entryType, setEntryType] = useState("payment");
  const [uploading, setUploading] = useState(false);
  const [importing, setImporting] = useState(false);
  const [importMsg, setImportMsg] = useState(null);
  const [accountFilter, setAccountFilter] = useState("all");

  async function handleImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    setImporting(true);
    setImportMsg(null);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

      let toImport = parseSatcoPettyCashForm(rows) || [];

      if (toImport.length === 0) {
        toImport = parseTallyPettyCash(rows) || [];
      }

      if (toImport.length === 0) {
        // Fallback: simple two-block layout (Date, Particulars, Ledger Folio, Amount on both Dr and Cr sides)
        for (let r = 0; r < rows.length; r++) {
          const row = rows[r] || [];
          const rDate = row[0], rPart = row[1], rFolio = row[2], rAmt = row[3];
          const cDate = row[5], cPart = row[6], cFolio = row[7], cAmt = row[8];
          const rIso = excelValueToISODate(rDate);
          const cIso = excelValueToISODate(cDate);
          if (rIso && rPart && Number(rAmt) > 0) {
            toImport.push({ entry_date: rIso, purpose: String(rPart).trim(), ledger_folio: rFolio ? String(rFolio).trim() : null, amount: Number(rAmt) || 0, entry_type: "receipt" });
          }
          if (cIso && cPart && Number(cAmt) > 0) {
            toImport.push({ entry_date: cIso, purpose: String(cPart).trim(), ledger_folio: cFolio ? String(cFolio).trim() : null, amount: Number(cAmt) || 0, entry_type: "payment" });
          }
        }
      }

      if (toImport.length === 0) {
        setImportMsg("No rows recognized. This importer supports the SATCO \"Petty Cash Form ST\" template (No. / Date / Bill Ref / Supplier / Details / Incomes / Expenses), a Tally-style Petty Cash Book export (Date / Particulars / Vch Type / Vch No. / Debit / Credit), or the Dr/Cr two-block layout (Date, Particulars, Ledger Folio, Amount) with a header row.");
        return;
      }
      const { error: insErr } = await ops().from("petty_cash").insert(toImport);
      if (insErr) throw insErr;
      setImportMsg("Imported " + toImport.length + " entries (" + toImport.filter((x) => x.entry_type === "receipt").length + " receipts, " + toImport.filter((x) => x.entry_type === "payment").length + " payments).");
      e.target.value = "";
      await load();
    } catch (err) {
      setImportMsg("Import failed: " + (err.message || "unknown error"));
    } finally {
      setImporting(false);
    }
  }

  async function load() {
    const { data, error } = await ops().from("petty_cash").select("*").order("entry_date", { ascending: true }).order("created_at", { ascending: true });
    if (error) { setError(error.message); return; }
    setEntries(data || []);
  }
  useEffect(() => { load(); }, []);

  async function handleSubmit(e) {
    e.preventDefault();
    setError(null);
    const f = new FormData(e.target);
    setUploading(true);
    try {
      let receiptUrl = null;
      const file = f.get("bill_file");
      if (file && file.size > 0) {
        const path = Date.now() + "-" + file.name;
        const { error: upErr } = await sb.storage.from("petty-cash-receipts").upload(path, file);
        if (upErr) throw upErr;
        receiptUrl = path;
      }
      const payload = {
        entry_date: f.get("entry_date"),
        account: f.get("account") || null,
        purpose: f.get("purpose"),
        supplier: f.get("supplier") || null,
        category: f.get("category") || null,
        ledger_folio: f.get("ledger_folio") || null,
        payment_mode: f.get("payment_mode") || null,
        amount: Number(f.get("amount")),
        approved_by: f.get("approved_by") || null,
        entry_type: entryType,
        receipt_url: receiptUrl,
      };
      const { error: insErr } = await ops().from("petty_cash").insert(payload);
      if (insErr) throw insErr;
      e.target.reset();
      setEntryType("payment");
      await load();
    } catch (err) {
      setError(err.message || "Save failed");
    } finally {
      setUploading(false);
    }
  }

  async function handleDelete(entry) {
    if (!window.confirm("Delete this " + entry.entry_type + " of " + fmt(entry.amount) + " dated " + entry.entry_date + "? This cannot be undone.")) return;
    const { error } = await ops().from("petty_cash").delete().eq("id", entry.id);
    if (error) { setError(error.message); return; }
    load();
  }

  const accountOptions = Array.from(new Set(entries.map((e) => e.account).filter(Boolean))).sort();
  const visibleEntries = accountFilter === "all" ? entries : entries.filter((e) => (e.account || "") === accountFilter);

  const receipts = visibleEntries.filter((e) => e.entry_type === "receipt");
  const cashPayments = visibleEntries.filter((e) => e.entry_type !== "receipt");
  const totalReceipts = receipts.reduce((s, e) => s + Number(e.amount), 0);
  const totalPayments = cashPayments.reduce((s, e) => s + Number(e.amount), 0);
  const balance = totalReceipts - totalPayments;

  function renderSide(list, colCount) {
    return (
      <table className="data-table">
        <thead><tr><th>Date</th><th>Account</th><th>Particulars</th><th>Supplier</th><th>Bill Ref</th><th>Amount</th><th>Bill</th><th>Actions</th></tr></thead>
        <tbody>
          {list.map((e) => (
            editingId === e.id ? (
              <EditPettyCashRow key={e.id} entry={e} colSpan={colCount} onCancel={() => setEditingId(null)} onSaved={() => { setEditingId(null); load(); }} />
            ) : (
              <tr key={e.id}>
                <td>{e.entry_date}</td>
                <td>{e.account || "—"}</td>
                <td>{e.purpose}</td>
                <td>{e.supplier || "—"}</td>
                <td>{e.ledger_folio || "—"}</td>
                <td>{fmt(e.amount)}</td>
                <td>{e.receipt_url ? <button className="btn-mini" onClick={() => viewFile("petty-cash-receipts", e.receipt_url)}>View</button> : "—"}</td>
                <td>
                  <button className="btn-mini" onClick={() => setEditingId(e.id)}>Edit</button>
                  <button className="btn-mini danger" onClick={() => handleDelete(e)}>Delete</button>
                </td>
              </tr>
            )
          ))}
          {list.length === 0 && <tr className="empty-row"><td colSpan={colCount}>No entries yet.</td></tr>}
        </tbody>
        <tfoot>
          <tr>
            <td colSpan={5} style={{ textAlign: "right", fontWeight: 700 }}>Total</td>
            <td style={{ fontWeight: 700 }}>{fmt(list.reduce((s, e) => s + Number(e.amount), 0))}</td>
            <td colSpan={2}></td>
          </tr>
        </tfoot>
      </table>
    );
  }

  return (
    <div>
      <style>{".cashbook-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;} .cashbook-side-title{margin:0 0 10px;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;} @media (max-width: 900px){.cashbook-grid{grid-template-columns:1fr;}}"}</style>

      <div className="content-card" style={{ marginBottom: 18 }}>
        <div className="form-grid" style={{ marginBottom: 0 }}>
          <div className="field">
            <label>Account</label>
            <select value={accountFilter} onChange={(e) => setAccountFilter(e.target.value)}>
              <option value="all">All accounts</option>
              {accountOptions.map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
          </div>
        </div>
      </div>

      <div className="kpi-grid" style={{ marginBottom: 18 }}>
        <div className="kpi-card">
          <div className="kpi-label">Petty Cash Balance{accountFilter !== "all" ? " — " + accountFilter : ""}</div>
          <div className="kpi-value" style={{ color: balance >= 0 ? "var(--success)" : "var(--danger)" }}>
            {balance >= 0 ? "+" : "−"}{fmt(Math.abs(balance))}
          </div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">Total Receipts</div>
          <div className="kpi-value">{fmt(totalReceipts)}</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">Total Payments</div>
          <div className="kpi-value">{fmt(totalPayments)}</div>
        </div>
      </div>

      <div className="content-card">
        <h3>Add petty cash entry</h3>
        <form onSubmit={handleSubmit} className="form-grid">
          <div className="field">
            <label>Entry Type</label>
            <select value={entryType} onChange={(e) => setEntryType(e.target.value)}>
              <option value="payment">Payment (Cr — money out)</option>
              <option value="receipt">Receipt (Dr — money in)</option>
            </select>
          </div>
          <div className="field"><label>Account</label><input type="text" name="account" list="petty-cash-accounts" placeholder="e.g. Aswani" /></div>
          <datalist id="petty-cash-accounts">{accountOptions.map((a) => <option key={a} value={a} />)}</datalist>
          <div className="field"><label>Date</label><input type="date" name="entry_date" required /></div>
          <div className="field"><label>Particulars / Details</label><input type="text" name="purpose" required /></div>
          <div className="field"><label>Supplier</label><input type="text" name="supplier" placeholder="Optional" /></div>
          <div className="field"><label>Bill Ref / Folio</label><input type="text" name="ledger_folio" placeholder="Optional" /></div>
          <div className="field"><label>Payment Mode</label><input type="text" name="payment_mode" placeholder="Optional" /></div>
          <div className="field"><label>Category</label><input type="text" name="category" placeholder="Optional" /></div>
          <div className="field"><label>Amount</label><input type="number" step="0.01" name="amount" required /></div>
          <div className="field"><label>Approved By</label><input type="text" name="approved_by" /></div>
          <div className="field"><label>Bill / Receipt Screenshot</label><input type="file" name="bill_file" accept="image/*,.pdf" /></div>
          <button className="btn-primary" type="submit" disabled={uploading}>{uploading ? "Saving…" : "Save"}</button>
        </form>
        {error && <div className="alert-card">{error}</div>}
      </div>

      <div className="content-card">
        <h3>Import petty cash records</h3>
        <p className="page-desc" style={{ margin: "0 0 10px" }}>Upload a petty cash file to import — supports the SATCO "Petty Cash Form ST" template (Date / Bill Ref / Supplier / Details / Incomes / Expenses, one sheet per account holder), a Tally-style Petty Cash Book export (Debit/Credit columns), or a simple Dr/Cr two-block cashbook layout (Date, Particulars, Ledger Folio, Amount).</p>
        <input type="file" accept=".xlsx,.xls,.xlsm,.csv" onChange={handleImport} disabled={importing} />
        {importing && <p style={{ fontSize: 13, color: "var(--muted)" }}>Importing…</p>}
        {importMsg && <div className={importMsg.indexOf("failed") === -1 && importMsg.indexOf("No rows") === -1 ? "alert-card" : "alert-card"} style={importMsg.indexOf("Imported") === 0 ? { background: "var(--success-soft)", color: "#166534", borderColor: "#bbf7d0" } : {}}>{importMsg}</div>}
      </div>

      <div className="content-card">
        <h3>Petty Cash Book</h3>
        <div className="cashbook-grid">
          <div>
            <h4 className="cashbook-side-title">Dr. — Receipts</h4>
            <div className="table-scroll">{renderSide(receipts, 8)}</div>
          </div>
          <div>
            <h4 className="cashbook-side-title">Cr. — Payments</h4>
            <div className="table-scroll">{renderSide(cashPayments, 8)}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Statements() {
  const [customers, setCustomers] = useState([]);
  const [pos, setPos] = useState([]);
  const [customerId, setCustomerId] = useState("");
  const [poId, setPoId] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [invoices, setInvoices] = useState([]);

  useEffect(() => {
    ops().from("customers").select("id, name, contact_email").order("name").then(({ data }) => setCustomers(data || []));
    ops().from("purchase_orders").select("id, po_no, customer_id").order("po_no").then(({ data }) => setPos(data || []));
  }, []);

  useEffect(() => {
    let query = ops().from("invoice_summary").select("*").order("invoice_date");
    if (customerId) query = query.eq("customer_id", customerId);
    if (poId) query = query.eq("po_id", poId);
    query.then(({ data }) => setInvoices(data || []));
  }, [customerId, poId]);

  // Narrow the PO dropdown to the selected customer's POs, if a customer is chosen
  const poOptions = customerId ? pos.filter((p) => p.customer_id === customerId) : pos;

  // Apply the payment-status filter on top of the customer/PO filtered set
  const visibleInvoices = statusFilter === "unpaid"
    ? invoices.filter((i) => Number(i.balance_due) > 0)
    : statusFilter === "paid"
    ? invoices.filter((i) => i.computed_status === "Paid")
    : invoices;

  // Totals grouped by currency, since a filtered set could span more than one currency
  const currencyTotals = visibleInvoices.reduce((acc, i) => {
    const cur = i.currency || "AED";
    acc[cur] = (acc[cur] || 0) + Number(i.balance_due);
    return acc;
  }, {});

  const buckets = [
    { label: "Current / Not Due", test: (d) => d === 0 },
    { label: "1 - 30 days", test: (d) => d >= 1 && d <= 30 },
    { label: "31 - 60 days", test: (d) => d >= 31 && d <= 60 },
    { label: "61 - 90 days", test: (d) => d >= 61 && d <= 90 },
    { label: "90+ days", test: (d) => d > 90 },
  ].map((b) => ({ ...b, total: visibleInvoices.filter((i) => b.test(i.days_delayed)).reduce((s, i) => s + Number(i.balance_due), 0) }));

  function exportExcel() {
    const rows = visibleInvoices.map((i) => ({
      "Invoice No.": i.invoice_no, "Invoice Date": i.invoice_date, "PO No.": i.po_no, "Customer": i.customer_name,
      "Currency": i.currency || "AED", "Invoice Value": i.invoice_value, "Amount Paid": i.amount_paid, "Balance Due": i.balance_due,
      "Due Date": i.due_date, "Paid Date": i.paid_date || "", "Days Delayed": i.days_delayed,
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Statement");
    XLSX.writeFile(wb, "statement_of_account.xlsx");
  }

  function exportPDF() {
    const doc = new jspdf.jsPDF();
    doc.text("Statement of Account", 14, 16);
    doc.autoTable({
      startY: 22,
      head: [["Invoice No.", "Date", "PO", "Customer", "Cur.", "Value", "Paid", "Balance", "Due", "Paid Date", "Days Late"]],
      body: visibleInvoices.map((i) => [i.invoice_no, i.invoice_date, i.po_no, i.customer_name, i.currency || "AED", fmt(i.invoice_value), fmt(i.amount_paid), fmt(i.balance_due), i.due_date, i.paid_date || "—", i.days_delayed]),
      foot: Object.entries(currencyTotals).map(([cur, total]) => ["", "", "", "", "", "", "", "Total (" + cur + "): " + fmt(total), "", "", ""]),
    });
    doc.save("statement_of_account.pdf");
  }

  function emailStatement() {
    const poCustomerId = poId ? (pos.find((p) => p.id === poId) || {}).customer_id : null;
    const targetCustomer = customers.find((c) => c.id === (customerId || poCustomerId));
    if (!targetCustomer || !targetCustomer.contact_email) {
      alert("No contact email on file for this customer. Add one to the customer record, or export and send manually.");
      return;
    }
    const lines = visibleInvoices.map((i) => `${i.invoice_no}  |  Due ${i.due_date}  |  ${i.currency || "AED"} ${fmt(i.balance_due)} outstanding`);
    const totalsLine = Object.entries(currencyTotals).map(([cur, total]) => `${cur} ${fmt(total)}`).join(", ") || "0.00";
    const body = `Dear ${targetCustomer.name},\n\nPlease find below your current statement of account.\n\n${lines.join("\n")}\n\nTotal outstanding: ${totalsLine}\n\nKindly arrange payment at your earliest convenience. (Please attach the exported Excel/PDF statement to this email before sending — mail links can't carry attachments automatically.)\n\nRegards,\nSATCO`;
    const mailto = `mailto:${encodeURIComponent(targetCustomer.contact_email)}?subject=${encodeURIComponent("Statement of Account - " + targetCustomer.name)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;
  }

  const hasFilter = customerId || poId;

  return (
    <div>
      <div className="content-card">
        <div className="form-grid">
          <div className="field">
            <label>Customer</label>
            <select value={customerId} onChange={(e) => { setCustomerId(e.target.value); setPoId(""); }}>
              <option value="">All customers…</option>
              {customers.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Purchase Order</label>
            <select value={poId} onChange={(e) => setPoId(e.target.value)}>
              <option value="">All POs…</option>
              {poOptions.map((p) => <option key={p.id} value={p.id}>{p.po_no}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Payment Status</label>
            <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
              <option value="all">All</option>
              <option value="unpaid">Unpaid only</option>
              <option value="paid">Paid only</option>
            </select>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn-secondary" onClick={exportExcel}>Export Excel</button>
            <button className="btn-secondary" onClick={exportPDF}>Export PDF</button>
            {hasFilter && <button className="btn-secondary" onClick={emailStatement}>Email to Customer</button>}
          </div>
        </div>
        {hasFilter && <div className="hint-text" style={{color:"var(--muted)"}}>Emailing opens a draft in your mail client — attach the exported Excel/PDF before sending, since mail links can't carry attachments.</div>}
      </div>

      <div className="content-card">
        <div className="table-scroll">
        <table className="data-table">
          <thead><tr><th>Invoice No.</th><th>Date</th><th>PO No.</th><th>Customer</th><th>Currency</th><th>Value</th><th>Paid</th><th>Balance</th><th>Due Date</th><th>Paid Date</th><th>Days Delayed</th></tr></thead>
          <tbody>
            {visibleInvoices.map((i) => (
              <tr key={i.id} className={i.computed_status === "Paid" ? "row-paid" : ""}>
                <td>{i.invoice_no}</td><td>{i.invoice_date}</td><td>{i.po_no}</td><td>{i.customer_name}</td>
                <td>{i.currency || "AED"}</td>
                <td>{fmt(i.invoice_value)}</td><td>{fmt(i.amount_paid)}</td><td>{fmt(i.balance_due)}</td>
                <td>{i.due_date}</td><td>{i.paid_date || "—"}</td><td className={i.days_delayed > 0 ? "badge-overdue" : ""}>{i.days_delayed}</td>
              </tr>
            ))}
            {visibleInvoices.length === 0 && <tr className="empty-row"><td colSpan="11">No invoices found.</td></tr>}
          </tbody>
          <tfoot>
            {Object.entries(currencyTotals).map(([cur, total]) => (
              <tr key={cur} style={{ fontWeight: 800, background: "var(--accent-soft)" }}>
                <td colSpan="8">Grand Total Outstanding Balance ({cur})</td><td>{fmt(total)}</td><td colSpan="2"></td>
              </tr>
            ))}
          </tfoot>
        </table>
        </div>
      </div>

      <div className="content-card">
        <h3>Aging Summary</h3>
        <div className="table-scroll">
        <table className="data-table" style={{ minWidth: 320, maxWidth: 420 }}>
          <tbody>
            {buckets.map((b) => (<tr key={b.label}><td>{b.label}</td><td>{fmt(b.total)}</td></tr>))}
          </tbody>
        </table>
        </div>
      </div>
    </div>
  );
}

function App() {
  const session = useAuth();
  const [view, setView] = useState("dashboard");
  const [mobileNavOpen, setMobileNavOpen] = useState(false);

  if (session === undefined) return <div style={{ padding: 40 }}>Loading…</div>;
  if (!session) return <LoginScreen />;

  const titles = {
    dashboard: ["Dashboard", "Overview of open POs, unpaid invoices, and outstanding balance"],
    pos: ["Purchase Orders", "Upload POs and let AI pull the fields for review"],
    invoices: ["Invoices", "Raise invoices against POs with auto-generated numbers"],
    pettycash: ["Petty Cash", "Track small day-to-day office expenses"],
    statements: ["Statements of Account", "Per-client balance, aging, and export"],
  };
  const [title, desc] = titles[view];

  return (
    <div className="satco-shell">
      <Sidebar view={view} setView={setView} mobileOpen={mobileNavOpen} onCloseMobile={() => setMobileNavOpen(false)} />
      <main className="satco-main">
        <div className="topbar">
          <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
            <button className="hamburger-btn" onClick={() => setMobileNavOpen(true)} aria-label="Open menu">☰</button>
            <div>
              <h1 className="page-title">{title}</h1>
              <p className="page-desc">{desc}</p>
            </div>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <span className="pill">{session.user.email}</span>
            <button className="signout-btn" onClick={() => sb.auth.signOut()}>Sign out</button>
          </div>
        </div>
        {view === "dashboard" && <Dashboard />}
        {view === "pos" && <PurchaseOrders />}
        {view === "invoices" && <Invoices />}
        {view === "pettycash" && <PettyCash />}
        {view === "statements" && <Statements />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
