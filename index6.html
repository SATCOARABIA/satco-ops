<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SATCO — OPS PORTAL</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  /* Palette matches satco-finance (same navy/accent scheme) so the two portals feel like one family */
  :root {
    --bg: #f6f8fb;
    --panel: #ffffff;
    --panel-soft: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --line-strong: #cbd5e1;
    --brand: #0f172a;
    --brand-2: #1e293b;
    --accent: #0ea5e9;
    --accent-soft: #e0f2fe;
    --success: #166534;
    --success-soft: #dcfce7;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --warning: #d97706;
    --warning-soft: #fef3c7;
    --radius: 18px;
    --shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
    color: var(--text);
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; }

  .login-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card { width: min(920px, 100%); display: grid; grid-template-columns: 1.1fr .9fr; background: #fff; border: 1px solid var(--line); border-radius: 28px; overflow: hidden; box-shadow: var(--shadow); }
  .login-hero { padding: 38px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; display: flex; flex-direction: column; justify-content: space-between; min-height: 420px; }
  .login-hero h1 { margin: 16px 0 10px; font-size: 32px; line-height: 1.05; letter-spacing: -.04em; }
  .login-hero p { margin: 0; color: #cbd5e1; line-height: 1.55; font-size: 14px; max-width: 400px; }
  .login-form { padding: 38px; display: flex; flex-direction: column; justify-content: center; }
  .login-form h2 { margin: 0 0 5px; font-size: 22px; letter-spacing: -.03em; }
  .login-form .hint { color: var(--muted); margin-bottom: 22px; font-size: 13px; }
  .login-error { background: var(--danger-soft); color: #991b1b; border: 1px solid #fecaca; padding: 10px 12px; border-radius: 12px; font-size: 12px; margin-bottom: 12px; }
  @media (max-width: 820px) { .login-card { grid-template-columns: 1fr; } .login-hero { min-height: auto; } }

  .satco-shell { min-height: 100vh; display: grid; grid-template-columns: 220px 1fr; }
  @media (max-width: 900px) { .satco-shell { grid-template-columns: 1fr; } .satco-sidebar { display: none; } }
  .satco-sidebar { padding: 18px; background: rgba(255,255,255,.9); border-right: 1px solid var(--line); }
  .brand-card { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 20px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; box-shadow: var(--shadow); }
  .brand-title { font-weight: 900; font-size: 15px; }
  .brand-subtitle { color: #cbd5e1; font-size: 11.5px; }
  .nav-title { color: var(--muted); font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; margin: 18px 0 8px 8px; }
  .nav-btn { width: 100%; display: flex; gap: 10px; align-items: center; border: 1px solid transparent; background: transparent; color: #334155; border-radius: 14px; padding: 10px 12px; cursor: pointer; font-weight: 700; font-size: 13px; text-align: left; }
  .nav-btn:hover { background: #f1f5f9; }
  .nav-btn.active { background: var(--brand); color: #fff; }

  .satco-main { padding: 20px 26px; min-width: 0; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    position: sticky; top: 0; z-index: 45;
    background: #f6f8fb; background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
    margin: -20px -26px 18px; padding: 16px 26px; border-bottom: 1px solid var(--line);
  }
  .page-title { margin: 0; font-size: 21px; letter-spacing: -.03em; }
  .page-desc { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 11px; font-weight: 800; color: #334155; }
  .signout-btn { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: #475569; font-weight: 800; font-size: 12px; cursor: pointer; }
  .signout-btn:hover { border-color: #94a3b8; color: var(--text); }

  .kpi-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin-bottom: 18px; }
  @media (max-width: 700px) { .kpi-grid { grid-template-columns: 1fr; } }
  .kpi-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .kpi-label { font-size: 12px; color: var(--muted); font-weight: 700; }
  .kpi-value { font-size: 26px; font-weight: 900; margin-top: 6px; }

  .content-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 18px; }
  .content-card h3 { margin: 0 0 14px; font-size: 15px; }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 4px; }
  .field input, .field select { width: 100%; padding: 9px 10px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; }
  .btn-primary { padding: 10px 16px; border-radius: 12px; border: none; background: var(--brand); color: #fff; font-weight: 800; cursor: pointer; }
  .btn-primary:hover { background: var(--brand-2); }
  .btn-secondary { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: #fff; color: var(--text); font-weight: 700; cursor: pointer; font-size: 12px; }
  .btn-mini { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: #fff; color: var(--text); font-weight: 700; cursor: pointer; font-size: 11.5px; }
  .btn-mini + .btn-mini { margin-left: 6px; }
  .btn-mini.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn-mini.danger { background: #fff; color: var(--danger); border-color: #fecaca; }
  .btn-mini.danger:hover { background: var(--danger-soft); }
  .edit-row td { background: var(--accent-soft) !important; padding: 12px 10px; }
  .edit-row .form-grid { margin: 0; }
  .hint-text { font-size: 11.5px; color: var(--warning); font-weight: 700; margin-top: 4px; }

  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
  table.data-table th { text-align: left; background: var(--brand); color: #fff; padding: 9px 10px; font-weight: 700; white-space: nowrap; }
  table.data-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.data-table tr:nth-child(even) td { background: var(--panel-soft); }
  table.data-table tr.row-paid td { background: var(--success-soft) !important; }
  .badge-overdue { color: var(--danger); font-weight: 800; }
  .badge-paid { color: var(--success); font-weight: 800; }
  .alert-card { border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; border: 1px solid #fecaca; background: var(--danger-soft); color: #991b1b; font-size: 13px; }
  .empty-row td { text-align: center; padding: 18px; color: var(--muted); }

  .hamburger-btn { display: none; padding: 7px 11px; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 16px; line-height: 1; }
  .sidebar-backdrop { display: none; }
  @media (max-width: 900px) {
    .hamburger-btn { display: inline-flex; align-items: center; justify-content: center; }
    .satco-sidebar.open {
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0; width: 260px; z-index: 60;
      box-shadow: 0 10px 40px rgba(0,0,0,.25); overflow-y: auto;
    }
    .sidebar-backdrop.open { display: block; position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 55; }
    .satco-main { padding: 14px; }
    .topbar { align-items: flex-start; margin: -14px -14px 14px; padding: 12px 14px; }
  }
  @media (max-width: 480px) {
    .kpi-value { font-size: 22px; }
    .content-card { padding: 14px; }
    .page-title { font-size: 18px; }
    .topbar .page-title { font-size: 16px; }
    .topbar .page-desc { display: none; }
    .topbar .pill { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// Same Supabase project as satco-finance (this app's tables live in the "ops" schema there)
const SUPABASE_URL = "https://mbwsfwebbrzurpozyxks.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1id3Nmd2ViYnJ6dXJwb3p5eGtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyODA0MzMsImV4cCI6MjA5Njg1NjQzM30.K2GhBkRnCCjwSv0n42fL-92k1HwXvmDnMszpFo4C8aY";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ops = () => sb.schema("ops");
const fmt = (n) => Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// Finds an existing customer by name (case-insensitive) or creates one. Returns the customer id, or null if no name given.
async function getOrCreateCustomerId(name) {
  const trimmed = (name || "").trim();
  if (!trimmed) return null;
  const { data: existing, error: findErr } = await ops().from("customers").select("id").ilike("name", trimmed).limit(1).maybeSingle();
  if (findErr) throw findErr;
  if (existing) return existing.id;
  const { data: created, error: createErr } = await ops().from("customers").insert({ name: trimmed }).select("id").single();
  if (createErr) throw createErr;
  return created.id;
}

// Opens an uploaded document (PO or invoice) in a new tab via a short-lived signed URL.
async function viewFile(bucket, path) {
  if (!path) return;
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 3600);
  if (error) { alert("Couldn't open file: " + error.message); return; }
  window.open(data.signedUrl, "_blank");
}

function useAuth() {
  const [session, setSession] = useState(undefined); // undefined = loading, null = signed out
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_evt, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);
  return session;
}

function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setLoading(true);
    setError(null);
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) setError(error.message);
    setLoading(false);
  }

  return (
    <div className="login-shell">
      <div className="login-card">
        <div className="login-hero">
          <div>
            <div className="brand-title" style={{fontSize:20}}>SATCO</div>
            <h1>Ops Portal</h1>
            <p>Petty cash, purchase orders, AI-assisted PO extraction, invoicing, and client statements of account.</p>
          </div>
          <p style={{fontSize:12,color:"#93c5fd"}}>Uses the same sign-in as the Finance Portal.</p>
        </div>
        <div className="login-form">
          <h2>Sign in</h2>
          <div className="hint">Enter your SATCO credentials to continue.</div>
          {error && <div className="login-error">{error}</div>}
          <form onSubmit={handleSubmit}>
            <div className="field" style={{marginBottom:12}}>
              <label>Email</label>
              <input type="email" value={email} onChange={(e)=>setEmail(e.target.value)} required />
            </div>
            <div className="field" style={{marginBottom:16}}>
              <label>Password</label>
              <input type="password" value={password} onChange={(e)=>setPassword(e.target.value)} required />
            </div>
            <button className="btn-primary" type="submit" disabled={loading} style={{width:"100%"}}>
              {loading ? "Signing in…" : "Sign in"}
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

function Sidebar({ view, setView, mobileOpen, onCloseMobile }) {
  const items = [
    { id: "dashboard", label: "Dashboard" },
    { id: "pos", label: "Purchase Orders" },
    { id: "invoices", label: "Invoices" },
    { id: "pettycash", label: "Petty Cash" },
    { id: "statements", label: "Statements of Account" },
  ];
  return (
    <React.Fragment>
      <div className={"sidebar-backdrop" + (mobileOpen ? " open" : "")} onClick={onCloseMobile}></div>
      <aside className={"satco-sidebar" + (mobileOpen ? " open" : "")}>
        <div className="brand-card">
          <div className="brand-title">SATCO</div>
          <div className="brand-subtitle">Ops Portal</div>
        </div>
        <div className="nav-title">Menu</div>
        {items.map((it) => (
          <button
            key={it.id}
            className={"nav-btn" + (view === it.id ? " active" : "")}
            onClick={() => { setView(it.id); onCloseMobile(); }}
            style={{ marginBottom: 4 }}
          >
            {it.label}
          </button>
        ))}
      </aside>
    </React.Fragment>
  );
}

function Dashboard() {
  const [stats, setStats] = useState(null);

  useEffect(() => {
    (async () => {
      const [{ count: openPos }, { count: openInvoices }, { data: summary }] = await Promise.all([
        ops().from("purchase_orders").select("*", { count: "exact", head: true }).eq("status", "open"),
        ops().from("invoices").select("*", { count: "exact", head: true }).neq("status", "paid"),
        ops().from("invoice_summary").select("balance_due"),
      ]);
      const totalOutstanding = (summary || []).reduce((s, r) => s + Number(r.balance_due || 0), 0);
      setStats({ openPos: openPos || 0, openInvoices: openInvoices || 0, totalOutstanding });
    })();
  }, []);

  if (!stats) return <div className="content-card">Loading…</div>;

  return (
    <div className="kpi-grid">
      <div className="kpi-card"><div className="kpi-label">Open Purchase Orders</div><div className="kpi-value">{stats.openPos}</div></div>
      <div className="kpi-card"><div className="kpi-label">Unpaid Invoices</div><div className="kpi-value">{stats.openInvoices}</div></div>
      <div className="kpi-card"><div className="kpi-label">Total Outstanding</div><div className="kpi-value">{fmt(stats.totalOutstanding)}</div></div>
    </div>
  );
}

function EditPoRow({ po, colSpan, onCancel, onSaved }) {
  const [form, setForm] = useState({
    po_no: po.po_no || "",
    po_date: po.po_date || "",
    expiry_date: po.expiry_date || "",
    currency: po.currency || "AED",
    po_value: po.po_value ?? 0,
    payment_terms_days: po.payment_terms_days ?? 30,
    status: po.status || "open",
    remarks: po.remarks || "",
    customer_name: po.customers?.name || "",
  });
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState(null);

  async function save() {
    setSaving(true);
    setErr(null);
    try {
      const customerId = await getOrCreateCustomerId(form.customer_name);
      const payload = {
        po_no: (form.po_no || "").trim(),
        po_date: form.po_date,
        expiry_date: form.expiry_date || null,
        currency: form.currency,
        po_value: Number(form.po_value) || 0,
        payment_terms_days: Number(form.payment_terms_days) || 30,
        status: form.status,
        remarks: form.remarks || null,
        customer_id: customerId,
      };
      const { error } = await ops().from("purchase_orders").update(payload).eq("id", po.id);
      if (error) throw error;
      onSaved();
    } catch (error) {
      setErr(error.message);
    } finally {
      setSaving(false);
    }
  }

  return (
    <tr className="edit-row">
      <td colSpan={colSpan}>
        {err && <div className="alert-card">{err}</div>}
        <div className="form-grid">
          <div className="field"><label>PO No.</label><input value={form.po_no} onChange={(e)=>setForm({...form, po_no:e.target.value})} /></div>
          <div className="field"><label>PO Date</label><input type="date" value={form.po_date} onChange={(e)=>setForm({...form, po_date:e.target.value})} /></div>
          <div className="field"><label>Expiry Date</label><input type="date" value={form.expiry_date} onChange={(e)=>setForm({...form, expiry_date:e.target.value})} /></div>
          <div className="field"><label>Customer</label><input value={form.customer_name} onChange={(e)=>setForm({...form, customer_name:e.target.value})} /></div>
          <div className="field">
            <label>Currency</label>
            <select value={form.currency} onChange={(e)=>setForm({...form, currency:e.target.value})}>
              <option value="AED">AED</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="INR">INR</option>
            </select>
          </div>
          <div className="field"><label>PO Value</label><input type="number" step="0.01" value={form.po_value} onChange={(e)=>setForm({...form, po_value:e.target.value})} /></div>
          <div className="field"><label>Payment Terms (days)</label><input type="number" value={form.payment_terms_days} onChange={(e)=>setForm({...form, payment_terms_days:e.target.value})} /></div>
          <div className="field">
            <label>Status</label>
            <select value={form.status} onChange={(e)=>setForm({...form, status:e.target.value})}>
              <option value="open">open</option>
              <option value="partially_invoiced">partially_invoiced</option>
              <option value="closed">closed</option>
            </select>
          </div>
          <div className="field" style={{gridColumn:"1/-1"}}><label>Remarks</label><input value={form.remarks} onChange={(e)=>setForm({...form, remarks:e.target.value})} /></div>
          <div>
            <button type="button" className="btn-mini primary" disabled={saving} onClick={save}>{saving ? "Saving…" : "Save"}</button>
            <button type="button" className="btn-mini" onClick={onCancel}>Cancel</button>
          </div>
        </div>
      </td>
    </tr>
  );
}

function PurchaseOrders() {
  const [pos, setPos] = useState([]);
  const [uploading, setUploading] = useState(false);
  const [extracted, setExtracted] = useState(null);
  const [filePath, setFilePath] = useState(null);
  const [error, setError] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [deletingId, setDeletingId] = useState(null);

  async function load() {
    const { data } = await ops().from("purchase_orders").select("id, po_no, po_date, expiry_date, currency, po_value, status, remarks, source_file_url, customer_id, customers(name)").order("created_at", { ascending: false });
    setPos(data || []);
  }
  useEffect(() => { load(); }, []);

  async function handleDelete(po) {
    if (!window.confirm(`Delete PO ${po.po_no}? This cannot be undone.`)) return;
    setDeletingId(po.id);
    setError(null);
    const { error: delErr } = await ops().from("purchase_orders").delete().eq("id", po.id);
    setDeletingId(null);
    if (delErr) {
      setError(
        delErr.message?.includes("foreign key")
          ? `Can't delete ${po.po_no} — it has invoices raised against it. Remove those invoices first.`
          : delErr.message
      );
      return;
    }
    load();
  }

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    setError(null);
    try {
      const path = `${Date.now()}-${file.name}`;
      const { error: upErr } = await sb.storage.from("po-documents").upload(path, file);
      if (upErr) throw upErr;
      setFilePath(path);
      const { data, error: fnErr } = await sb.functions.invoke("extract-po", { body: { file_path: path } });
      if (fnErr) throw fnErr;
      setExtracted(data || {});
    } catch (err) {
      setError(err.message || "Upload/extraction failed");
    } finally {
      setUploading(false);
    }
  }

  async function handleConfirm(e) {
    e.preventDefault();
    const f = new FormData(e.target);
    const poNo = (f.get("po_no") || "").trim();
    if (!poNo) { setError("PO No. is required — the AI could not read it from the document, please type it in."); return; }
    try {
      const customerId = await getOrCreateCustomerId(f.get("customer_name"));
      const payload = {
        po_no: poNo,
        po_date: f.get("po_date"),
        expiry_date: f.get("expiry_date") || null,
        currency: f.get("currency") || "AED",
        po_value: Number(f.get("po_value")) || 0,
        payment_terms_days: Number(f.get("payment_terms_days")) || 30,
        remarks: (f.get("remarks") || "").trim() || null,
        customer_id: customerId,
        status: "open",
        source_file_url: filePath,
        extracted_raw: extracted,
      };
      const { error: insErr } = await ops().from("purchase_orders").insert(payload);
      if (insErr) throw insErr;
      setExtracted(null);
      setFilePath(null);
      setError(null);
      e.target.reset();
      load();
    } catch (err) {
      setError(err.message);
    }
  }

  return (
    <div>
      <div className="content-card">
        <h3>Upload a PO</h3>
        <input type="file" accept="application/pdf,image/*" onChange={handleFile} disabled={uploading} />

          <form onSubmit={handleConfirm} className="form-grid" style={{ marginTop: 14 }}>
            <p style={{ gridColumn: "1/-1", color: "var(--muted)", fontSize: 13 }}>
              Review the AI-extracted fields before saving. Anything the AI missed is left blank for you to fill in.
            </p>
            <div className="field">
              <label>PO No.</label>
              <input name="po_no" defaultValue={extracted.po_no || ""} placeholder="Not detected — enter manually" required />
              {!extracted.po_no && <div className="hint-text">Not detected by AI — please enter manually.</div>}
            </div>
            <div className="field"><label>PO Date</label><input type="date" name="po_date" defaultValue={extracted.po_date || ""} required /></div>
            <div className="field"><label>Expiry Date</label><input type="date" name="expiry_date" defaultValue={extracted.expiry_date || ""} /></div>
            <div className="field">
              <label>Customer</label>
              <input name="customer_name" defaultValue={extracted.customer_name || ""} placeholder="Not detected — enter manually" />
              {!extracted.customer_name && <div className="hint-text">Not detected by AI — please enter manually.</div>}
            </div>
            <div className="field">
              <label>Currency</label>
              <select name="currency" defaultValue={extracted.currency || "AED"}>
                <option value="AED">AED</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="INR">INR</option>
