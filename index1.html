<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SATCO — OPS PORTAL</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  /* Palette matches satco-finance (same navy/accent scheme) so the two portals feel like one family */
  :root {
    --bg: #f6f8fb;
    --panel: #ffffff;
    --panel-soft: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --line-strong: #cbd5e1;
    --brand: #0f172a;
    --brand-2: #1e293b;
    --accent: #0ea5e9;
    --accent-soft: #e0f2fe;
    --success: #166534;
    --success-soft: #dcfce7;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --warning: #d97706;
    --warning-soft: #fef3c7;
    --radius: 18px;
    --shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
    color: var(--text);
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; }

  .login-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card { width: min(920px, 100%); display: grid; grid-template-columns: 1.1fr .9fr; background: #fff; border: 1px solid var(--line); border-radius: 28px; overflow: hidden; box-shadow: var(--shadow); }
  .login-hero { padding: 38px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; display: flex; flex-direction: column; justify-content: space-between; min-height: 420px; }
  .login-hero h1 { margin: 16px 0 10px; font-size: 32px; line-height: 1.05; letter-spacing: -.04em; }
  .login-hero p { margin: 0; color: #cbd5e1; line-height: 1.55; font-size: 14px; max-width: 400px; }
  .login-form { padding: 38px; display: flex; flex-direction: column; justify-content: center; }
  .login-form h2 { margin: 0 0 5px; font-size: 22px; letter-spacing: -.03em; }
  .login-form .hint { color: var(--muted); margin-bottom: 22px; font-size: 13px; }
  .login-error { background: var(--danger-soft); color: #991b1b; border: 1px solid #fecaca; padding: 10px 12px; border-radius: 12px; font-size: 12px; margin-bottom: 12px; }
  @media (max-width: 820px) { .login-card { grid-template-columns: 1fr; } .login-hero { min-height: auto; } }

  .satco-shell { min-height: 100vh; display: grid; grid-template-columns: 220px 1fr; }
  @media (max-width: 900px) { .satco-shell { grid-template-columns: 1fr; } .satco-sidebar { display: none; } }
  .satco-sidebar { padding: 18px; background: rgba(255,255,255,.9); border-right: 1px solid var(--line); }
  .brand-card { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 20px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; box-shadow: var(--shadow); }
  .brand-title { font-weight: 900; font-size: 15px; }
  .brand-subtitle { color: #cbd5e1; font-size: 11.5px; }
  .nav-title { color: var(--muted); font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; margin: 18px 0 8px 8px; }
  .nav-btn { width: 100%; display: flex; gap: 10px; align-items: center; border: 1px solid transparent; background: transparent; color: #334155; border-radius: 14px; padding: 10px 12px; cursor: pointer; font-weight: 700; font-size: 13px; text-align: left; }
  .nav-btn:hover { background: #f1f5f9; }
  .nav-btn.active { background: var(--brand); color: #fff; }

  .satco-main { padding: 20px 26px; min-width: 0; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .page-title { margin: 0; font-size: 21px; letter-spacing: -.03em; }
  .page-desc { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 11px; font-weight: 800; color: #334155; }
  .signout-btn { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: #475569; font-weight: 800; font-size: 12px; cursor: pointer; }
  .signout-btn:hover { border-color: #94a3b8; color: var(--text); }

  .kpi-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin-bottom: 18px; }
  @media (max-width: 700px) { .kpi-grid { grid-template-columns: 1fr; } }
  .kpi-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .kpi-label { font-size: 12px; color: var(--muted); font-weight: 700; }
  .kpi-value { font-size: 26px; font-weight: 900; margin-top: 6px; }

  .content-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 18px; }
  .content-card h3 { margin: 0 0 14px; font-size: 15px; }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 4px; }
  .field input, .field select { width: 100%; padding: 9px 10px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; }
  .btn-primary { padding: 10px 16px; border-radius: 12px; border: none; background: var(--brand); color: #fff; font-weight: 800; cursor: pointer; }
  .btn-primary:hover { background: var(--brand-2); }
  .btn-secondary { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: #fff; color: var(--text); font-weight: 700; cursor: pointer; font-size: 12px; }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table th { text-align: left; background: var(--brand); color: #fff; padding: 9px 10px; font-weight: 700; }
  table.data-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); }
  table.data-table tr:nth-child(even) td { background: var(--panel-soft); }
  .badge-overdue { color: var(--danger); font-weight: 800; }
  .badge-paid { color: var(--success); font-weight: 800; }
  .alert-card { border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; border: 1px solid #fecaca; background: var(--danger-soft); color: #991b1b; font-size: 13px; }
  .empty-row td { text-align: center; padding: 18px; color: var(--muted); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// Same Supabase project as satco-finance (this app's tables live in the "ops" schema there)
const SUPABASE_URL = "https://mbwsfwebbrzurpozyxks.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1id3Nmd2ViYnJ6dXJwb3p5eGtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyODA0MzMsImV4cCI6MjA5Njg1NjQzM30.K2GhBkRnCCjwSv0n42fL-92k1HwXvmDnMszpFo4C8aY";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ops = () => sb.schema("ops");
const fmt = (n) => Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function useAuth() {
  const [session, setSession] = useState(undefined); // undefined = loading, null = signed out
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_evt, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);
  return session;
}

function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setLoading(true);
    setError(null);
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) setError(error.message);
    setLoading(false);
  }

  return (
    <div className="login-shell">
      <div className="login-card">
        <div className="login-hero">
          <div>
            <div className="brand-title" style={{fontSize:20}}>SATCO</div>
            <h1>Ops Portal</h1>
            <p>Petty cash, purchase orders, AI-assisted PO extraction, invoicing, and client statements of account.</p>
          </div>
          <p style={{fontSize:12,color:"#93c5fd"}}>Uses the same sign-in as the Finance Portal.</p>
        </div>
        <div className="login-form">
          <h2>Sign in</h2>
          <div className="hint">Enter your SATCO credentials to continue.</div>
          {error && <div className="login-error">{error}</div>}
          <form onSubmit={handleSubmit}>
            <div className="field" style={{marginBottom:12}}>
              <label>Email</label>
              <input type="email" value={email} onChange={(e)=>setEmail(e.target.value)} required />
            </div>
            <div className="field" style={{marginBottom:16}}>
              <label>Password</label>
              <input type="password" value={password} onChange={(e)=>setPassword(e.target.value)} required />
            </div>
            <button className="btn-primary" type="submit" disabled={loading} style={{width:"100%"}}>
              {loading ? "Signing in…" : "Sign in"}
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

function Sidebar({ view, setView }) {
  const items = [
    { id: "dashboard", label: "Dashboard" },
    { id: "pos", label: "Purchase Orders" },
    { id: "invoices", label: "Invoices" },
    { id: "pettycash", label: "Petty Cash" },
    { id: "statements", label: "Statements of Account" },
  ];
  return (
    <aside className="satco-sidebar">
      <div className="brand-card">
        <div className="brand-title">SATCO</div>
        <div className="brand-subtitle">Ops Portal</div>
      </div>
      <div className="nav-title">Menu</div>
      {items.map((it) => (
        <button
          key={it.id}
          className={"nav-btn" + (view === it.id ? " active" : "")}
          onClick={() => setView(it.id)}
          style={{ marginBottom: 4 }}
        >
          {it.label}
        </button>
      ))}
    </aside>
  );
}

function Dashboard() {
  const [stats, setStats] = useState(null);

  useEffect(() => {
    (async () => {
      const [{ count: openPos }, { count: openInvoices }, { data: summary }] = await Promise.all([
        ops().from("purchase_orders").select("*", { count: "exact", head: true }).eq("status", "open"),
        ops().from("invoices").select("*", { count: "exact", head: true }).neq("status", "paid"),
        ops().from("invoice_summary").select("balance_due"),
      ]);
      const totalOutstanding = (summary || []).reduce((s, r) => s + Number(r.balance_due || 0), 0);
      setStats({ openPos: openPos || 0, openInvoices: openInvoices || 0, totalOutstanding });
    })();
  }, []);

  if (!stats) return <div className="content-card">Loading…</div>;

  return (
    <div className="kpi-grid">
      <div className="kpi-card"><div className="kpi-label">Open Purchase Orders</div><div className="kpi-value">{stats.openPos}</div></div>
      <div className="kpi-card"><div className="kpi-label">Unpaid Invoices</div><div className="kpi-value">{stats.openInvoices}</div></div>
      <div className="kpi-card"><div className="kpi-label">Total Outstanding</div><div className="kpi-value">{fmt(stats.totalOutstanding)}</div></div>
    </div>
  );
}

function PurchaseOrders() {
  const [pos, setPos] = useState([]);
  const [uploading, setUploading] = useState(false);
  const [extracted, setExtracted] = useState(null);
  const [filePath, setFilePath] = useState(null);
  const [error, setError] = useState(null);

  async function load() {
    const { data } = await ops().from("purchase_orders").select("id, po_no, po_date, po_value, status, customers(name)").order("created_at", { ascending: false });
    setPos(data || []);
  }
  useEffect(() => { load(); }, []);

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    setError(null);
    try {
      const path = `${Date.now()}-${file.name}`;
      const { error: upErr } = await sb.storage.from("po-documents").upload(path, file);
      if (upErr) throw upErr;
      setFilePath(path);
      const { data, error: fnErr } = await sb.functions.invoke("extract-po", { body: { file_path: path } });
      if (fnErr) throw fnErr;
      setExtracted(data);
    } catch (err) {
      setError(err.message || "Upload/extraction failed");
    } finally {
      setUploading(false);
    }
  }

  async function handleConfirm(e) {
    e.preventDefault();
    const f = new FormData(e.target);
    const payload = {
      po_no: f.get("po_no"),
      po_date: f.get("po_date"),
      po_value: Number(f.get("po_value")),
      payment_terms_days: Number(f.get("payment_terms_days")),
      status: "open",
      source_file_url: filePath,
      extracted_raw: extracted,
    };
    const { error: insErr } = await ops().from("purchase_orders").insert(payload);
    if (insErr) { setError(insErr.message); return; }
    setExtracted(null);
    setFilePath(null);
    e.target.reset();
    load();
  }

  return (
    <div>
      <div className="content-card">
        <h3>Upload a PO</h3>
        <input type="file" accept="application/pdf,image/*" onChange={handleFile} disabled={uploading} />
        {uploading && <p>Uploading and extracting fields…</p>}
        {error && <div className="alert-card">{error}</div>}
        {extracted && (
          <form onSubmit={handleConfirm} className="form-grid" style={{ marginTop: 14 }}>
            <p style={{ gridColumn: "1/-1", color: "var(--muted)", fontSize: 13 }}>
              Review the AI-extracted fields before saving.
            </p>
            <div className="field"><label>PO No.</label><input name="po_no" defaultValue={extracted.po_no || ""} required /></div>
            <div className="field"><label>PO Date</label><input type="date" name="po_date" defaultValue={extracted.po_date || ""} required /></div>
            <div className="field"><label>PO Value</label><input type="number" step="0.01" name="po_value" defaultValue={extracted.po_value || ""} required /></div>
            <div className="field"><label>Payment Terms (days)</label><input type="number" name="payment_terms_days" defaultValue={extracted.payment_terms_days || 30} required /></div>
            <button className="btn-primary" type="submit">Confirm &amp; Save</button>
          </form>
        )}
      </div>

      <div className="content-card">
        <h3>Purchase Orders</h3>
        <table className="data-table">
          <thead><tr><th>PO No.</th><th>PO Date</th><th>Customer</th><th>Value</th><th>Status</th></tr></thead>
          <tbody>
            {pos.map((po) => (
              <tr key={po.id}>
                <td>{po.po_no}</td><td>{po.po_date}</td><td>{po.customers?.name || "—"}</td>
                <td>{fmt(po.po_value)}</td><td>{po.status}</td>
              </tr>
            ))}
            {pos.length === 0 && <tr className="empty-row"><td colSpan="5">No purchase orders yet.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Invoices() {
  const [invoices, setInvoices] = useState([]);
  const [openPos, setOpenPos] = useState([]);
  const [error, setError] = useState(null);
  const [saving, setSaving] = useState(false);

  async function load() {
    const [{ data: inv }, { data: p }] = await Promise.all([
      ops().from("invoice_summary").select("*").order("invoice_date", { ascending: false }),
      ops().from("purchase_orders").select("id, po_no, po_value, payment_terms_days, customer_id, customers(name)").neq("status", "closed"),
    ]);
    setInvoices(inv || []);
    setOpenPos(p || []);
  }
  useEffect(() => { load(); }, []);

  async function handleSubmit(e) {
    e.preventDefault();
    const f = new FormData(e.target);
    setSaving(true);
    setError(null);
    try {
      const poId = f.get("po_id");
      const invoiceDate = f.get("invoice_date");
      const invoiceValue = Number(f.get("invoice_value"));
      const po = openPos.find((p) => p.id === poId);
      if (!po) throw new Error("Select a valid PO");

      const { data: invoiceNo, error: numErr } = await ops().rpc("next_invoice_number", { p_invoice_date: invoiceDate, p_series_code: "01" });
      if (numErr) throw numErr;

      const { error: insErr } = await ops().from("invoices").insert({
        invoice_no: invoiceNo,
        invoice_date: invoiceDate,
        po_id: po.id,
        customer_id: po.customer_id,
        invoice_value: invoiceValue,
        payment_terms_days: po.payment_terms_days || 30,
        status: "draft",
      });
      if (insErr) throw insErr;
      e.target.reset();
      load();
    } catch (err) {
      setError(err.message || "Failed to create invoice");
    } finally {
      setSaving(false);
    }
  }

  return (
    <div>
      <div className="content-card">
        <h3>Raise a new invoice against a PO</h3>
        <form onSubmit={handleSubmit} className="form-grid">
          <div className="field">
            <label>Purchase Order</label>
            <select name="po_id" required>
              <option value="">Select PO…</option>
              {openPos.map((po) => (
                <option key={po.id} value={po.id}>{po.po_no} — {po.customers?.name || "Unknown"} ({fmt(po.po_value)})</option>
              ))}
            </select>
          </div>
          <div className="field"><label>Invoice Date</label><input type="date" name="invoice_date" required /></div>
          <div className="field"><label>Invoice Value</label><input type="number" step="0.01" name="invoice_value" required /></div>
          <button className="btn-primary" type="submit" disabled={saving}>{saving ? "Saving…" : "Generate Number & Save"}</button>
        </form>
        {error && <div className="alert-card">{error}</div>}
      </div>

      <div className="content-card">
        <h3>Invoices</h3>
        <table className="data-table">
          <thead><tr><th>Invoice No.</th><th>Date</th><th>PO</th><th>Customer</th><th>Value</th><th>Paid</th><th>Balance</th><th>Due Date</th><th>Days Delayed</th><th>Status</th></tr></thead>
          <tbody>
            {invoices.map((inv) => (
              <tr key={inv.id}>
                <td>{inv.invoice_no}</td><td>{inv.invoice_date}</td><td>{inv.po_no}</td><td>{inv.customer_name}</td>
                <td>{fmt(inv.invoice_value)}</td><td>{fmt(inv.amount_paid)}</td><td>{fmt(inv.balance_due)}</td>
                <td>{inv.due_date}</td>
                <td className={inv.days_delayed > 0 ? "badge-overdue" : ""}>{inv.days_delayed}</td>
                <td className={inv.computed_status === "Paid" ? "badge-paid" : ""}>{inv.computed_status}</td>
              </tr>
            ))}
            {invoices.length === 0 && <tr className="empty-row"><td colSpan="10">No invoices yet.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function PettyCash() {
  const [entries, setEntries] = useState([]);
  const [error, setError] = useState(null);

  async function load() {
    const { data } = await ops().from("petty_cash").select("*").order("entry_date", { ascending: false });
    setEntries(data || []);
  }
  useEffect(() => { load(); }, []);

  async function handleSubmit(e) {
    e.preventDefault();
    const f = new FormData(e.target);
    const payload = {
      entry_date: f.get("entry_date"),
      purpose: f.get("purpose"),
      category: f.get("category"),
      amount: Number(f.get("amount")),
      approved_by: f.get("approved_by"),
    };
    const { error: insErr } = await ops().from("petty_cash").insert(payload);
    if (insErr) { setError(insErr.message); return; }
    e.target.reset();
    load();
  }

  const total = entries.reduce((s, e) => s + Number(e.amount), 0);

  return (
    <div>
      <div className="content-card">
        <h3>Add petty cash entry</h3>
        <form onSubmit={handleSubmit} className="form-grid">
          <div className="field"><label>Date</label><input type="date" name="entry_date" required /></div>
          <div className="field"><label>Purpose</label><input type="text" name="purpose" required /></div>
          <div className="field"><label>Category</label><input type="text" name="category" /></div>
          <div className="field"><label>Amount</label><input type="number" step="0.01" name="amount" required /></div>
          <div className="field"><label>Approved By</label><input type="text" name="approved_by" /></div>
          <button className="btn-primary" type="submit">Save</button>
        </form>
        {error && <div className="alert-card">{error}</div>}
      </div>
      <div className="content-card">
        <h3>Petty Cash — total recorded: {fmt(total)}</h3>
        <table className="data-table">
          <thead><tr><th>Date</th><th>Purpose</th><th>Category</th><th>Amount</th><th>Approved By</th></tr></thead>
          <tbody>
            {entries.map((e) => (
              <tr key={e.id}><td>{e.entry_date}</td><td>{e.purpose}</td><td>{e.category || "—"}</td><td>{fmt(e.amount)}</td><td>{e.approved_by || "—"}</td></tr>
            ))}
            {entries.length === 0 && <tr className="empty-row"><td colSpan="5">No entries yet.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Statements() {
  const [customers, setCustomers] = useState([]);
  const [customerId, setCustomerId] = useState("");
  const [invoices, setInvoices] = useState([]);

  useEffect(() => {
    ops().from("customers").select("id, name").order("name").then(({ data }) => setCustomers(data || []));
  }, []);

  useEffect(() => {
    if (!customerId) { setInvoices([]); return; }
    ops().from("invoice_summary").select("*").eq("customer_id", customerId).order("invoice_date").then(({ data }) => setInvoices(data || []));
  }, [customerId]);

  const grandTotal = invoices.reduce((s, i) => s + Number(i.balance_due), 0);
  const buckets = [
    { label: "Current / Not Due", test: (d) => d === 0 },
    { label: "1 - 30 days", test: (d) => d >= 1 && d <= 30 },
    { label: "31 - 60 days", test: (d) => d >= 31 && d <= 60 },
    { label: "61 - 90 days", test: (d) => d >= 61 && d <= 90 },
    { label: "90+ days", test: (d) => d > 90 },
  ].map((b) => ({ ...b, total: invoices.filter((i) => b.test(i.days_delayed)).reduce((s, i) => s + Number(i.balance_due), 0) }));

  function exportExcel() {
    const rows = invoices.map((i) => ({
      "Invoice No.": i.invoice_no, "Invoice Date": i.invoice_date, "PO No.": i.po_no,
      "Invoice Value": i.invoice_value, "Amount Paid": i.amount_paid, "Balance Due": i.balance_due,
      "Due Date": i.due_date, "Days Delayed": i.days_delayed,
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Statement");
    XLSX.writeFile(wb, "statement_of_account.xlsx");
  }

  function exportPDF() {
    const doc = new jspdf.jsPDF();
    doc.text("Statement of Account", 14, 16);
    doc.autoTable({
      startY: 22,
      head: [["Invoice No.", "Date", "PO", "Value", "Paid", "Balance", "Due", "Days Late"]],
      body: invoices.map((i) => [i.invoice_no, i.invoice_date, i.po_no, fmt(i.invoice_value), fmt(i.amount_paid), fmt(i.balance_due), i.due_date, i.days_delayed]),
      foot: [["", "", "", "", "", "Total: " + fmt(grandTotal), "", ""]],
    });
    doc.save("statement_of_account.pdf");
  }

  return (
    <div>
      <div className="content-card">
        <div className="form-grid">
          <div className="field">
            <label>Customer</label>
            <select value={customerId} onChange={(e) => setCustomerId(e.target.value)}>
              <option value="">Select a customer…</option>
              {customers.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
          {customerId && (
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn-secondary" onClick={exportExcel}>Export Excel</button>
              <button className="btn-secondary" onClick={exportPDF}>Export PDF</button>
            </div>
          )}
        </div>
      </div>

      {customerId && (
        <React.Fragment>
          <div className="content-card">
            <table className="data-table">
              <thead><tr><th>Invoice No.</th><th>Date</th><th>PO No.</th><th>Value</th><th>Paid</th><th>Balance</th><th>Due Date</th><th>Days Delayed</th></tr></thead>
              <tbody>
                {invoices.map((i) => (
                  <tr key={i.id}>
                    <td>{i.invoice_no}</td><td>{i.invoice_date}</td><td>{i.po_no}</td>
                    <td>{fmt(i.invoice_value)}</td><td>{fmt(i.amount_paid)}</td><td>{fmt(i.balance_due)}</td>
                    <td>{i.due_date}</td><td className={i.days_delayed > 0 ? "badge-overdue" : ""}>{i.days_delayed}</td>
                  </tr>
                ))}
              </tbody>
              <tfoot>
                <tr style={{ fontWeight: 800, background: "var(--accent-soft)" }}>
                  <td colSpan="5">Grand Total Outstanding Balance</td><td>{fmt(grandTotal)}</td><td colSpan="2"></td>
                </tr>
              </tfoot>
            </table>
          </div>
          <div className="content-card">
            <h3>Aging Summary</h3>
            <table className="data-table" style={{ maxWidth: 420 }}>
              <tbody>
                {buckets.map((b) => (<tr key={b.label}><td>{b.label}</td><td>{fmt(b.total)}</td></tr>))}
              </tbody>
            </table>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function App() {
  const session = useAuth();
  const [view, setView] = useState("dashboard");

  if (session === undefined) return <div style={{ padding: 40 }}>Loading…</div>;
  if (!session) return <LoginScreen />;

  const titles = {
    dashboard: ["Dashboard", "Overview of open POs, unpaid invoices, and outstanding balance"],
    pos: ["Purchase Orders", "Upload POs and let AI pull the fields for review"],
    invoices: ["Invoices", "Raise invoices against POs with auto-generated numbers"],
    pettycash: ["Petty Cash", "Track small day-to-day office expenses"],
    statements: ["Statements of Account", "Per-client balance, aging, and export"],
  };
  const [title, desc] = titles[view];

  return (
    <div className="satco-shell">
      <Sidebar view={view} setView={setView} />
      <main className="satco-main">
        <div className="topbar">
          <div>
            <h1 className="page-title">{title}</h1>
            <p className="page-desc">{desc}</p>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <span className="pill">{session.user.email}</span>
            <button className="signout-btn" onClick={() => sb.auth.signOut()}>Sign out</button>
          </div>
        </div>
        {view === "dashboard" && <Dashboard />}
        {view === "pos" && <PurchaseOrders />}
        {view === "invoices" && <Invoices />}
        {view === "pettycash" && <PettyCash />}
        {view === "statements" && <Statements />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
