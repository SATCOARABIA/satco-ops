<style>
  /* Palette matches satco-finance (same navy/accent scheme) so the two portals feel like one family */
  :root {
    --bg: #f6f8fb;
    --panel: #ffffff;
    --panel-soft: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --line-strong: #cbd5e1;
    --brand: #0f172a;
    --brand-2: #1e293b;
    --accent: #0ea5e9;
    --accent-soft: #e0f2fe;
    --success: #166534;
    --success-soft: #dcfce7;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --warning: #d97706;
    --warning-soft: #fef3c7;
    --radius: 18px;
    --shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
    color: var(--text);
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; }

  .login-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card { width: min(920px, 100%); display: grid; grid-template-columns: 1.1fr .9fr; background: #fff; border: 1px solid var(--line); border-radius: 28px; overflow: hidden; box-shadow: var(--shadow); }
  .login-hero { padding: 38px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; display: flex; flex-direction: column; justify-content: space-between; min-height: 420px; }
  .login-hero h1 { margin: 16px 0 10px; font-size: 32px; line-height: 1.05; letter-spacing: -.04em; }
  .login-hero p { margin: 0; color: #cbd5e1; line-height: 1.55; font-size: 14px; max-width: 400px; }
  .login-form { padding: 38px; display: flex; flex-direction: column; justify-content: center; }
  .login-form h2 { margin: 0 0 5px; font-size: 22px; letter-spacing: -.03em; }
  .login-form .hint { color: var(--muted); margin-bottom: 22px; font-size: 13px; }
  .login-error { background: var(--danger-soft); color: #991b1b; border: 1px solid #fecaca; padding: 10px 12px; border-radius: 12px; font-size: 12px; margin-bottom: 12px; }
  @media (max-width: 820px) { .login-card { grid-template-columns: 1fr; } .login-hero { min-height: auto; } }

  .satco-shell { min-height: 100vh; display: grid; grid-template-columns: 220px 1fr; align-items: start; }
  @media (max-width: 900px) { .satco-shell { grid-template-columns: 1fr; } .satco-sidebar { display: none; } }
  .satco-sidebar { position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; padding: 18px; background: rgba(255,255,255,.9); border-right: 1px solid var(--line); }
  .brand-card { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 20px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; box-shadow: var(--shadow); }
  .brand-title { font-weight: 900; font-size: 15px; }
  .brand-subtitle { color: #cbd5e1; font-size: 11.5px; }
  .nav-title { color: var(--muted); font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; margin: 18px 0 8px 8px; }
  .nav-btn { width: 100%; display: flex; gap: 10px; align-items: center; border: 1px solid transparent; background: transparent; color: #334155; border-radius: 14px; padding: 10px 12px; cursor: pointer; font-weight: 700; font-size: 13px; text-align: left; }
  .nav-btn:hover { background: #f1f5f9; }
  .nav-btn.active { background: var(--brand); color: #fff; }

  .satco-main { padding: 20px 26px; min-width: 0; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    position: sticky; top: 0; z-index: 45;
    background: #f6f8fb; background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
    margin: -20px -26px 18px; padding: 16px 26px; border-bottom: 1px solid var(--line);
  }
  .page-title { margin: 0; font-size: 21px; letter-spacing: -.03em; }
  .page-desc { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 11px; font-weight: 800; color: #334155; }
  .signout-btn { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: #475569; font-weight: 800; font-size: 12px; cursor: pointer; }
  .signout-btn:hover { border-color: #94a3b8; color: var(--text); }

  .kpi-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin-bottom: 18px; }
  @media (max-width: 700px) { .kpi-grid { grid-template-columns: 1fr; } }
  .kpi-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .kpi-label { font-size: 12px; color: var(--muted); font-weight: 700; }
  .kpi-value { font-size: 26px; font-weight: 900; margin-top: 6px; }

  .content-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 18px; }
  .content-card h3 { margin: 0 0 14px; font-size: 15px; }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 4px; }
  .field input, .field select { width: 100%; padding: 9px 10px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; }
  .btn-primary { padding: 10px 16px; border-radius: 12px; border: none; background: var(--brand); color: #fff; font-weight: 800; cursor: pointer; }
  .btn-primary:hover { background: var(--brand-2); }
  .btn-secondary { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: #fff; color: var(--text); font-weight: 700; cursor: pointer; font-size: 12px; }
  .btn-mini { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: #fff; color: var(--text); font-weight: 700; cursor: pointer; font-size: 11.5px; }
  .btn-mini + .btn-mini { margin-left: 6px; }
  .btn-mini.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn-mini.danger { background: #fff; color: var(--danger); border-color: #fecaca; }
  .btn-mini.danger:hover { background: var(--danger-soft); }
  .edit-row td { background: var(--accent-soft) !important; padding: 12px 10px; }
  .edit-row .form-grid { margin: 0; }
  .hint-text { font-size: 11.5px; color: var(--warning); font-weight: 700; margin-top: 4px; }

  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; cursor: grab; }
  .table-scroll.dragging { cursor: grabbing; user-select: none; }
  .cashbook-toggle { display: inline-flex; gap: 6px; margin-bottom: 14px; }
  .cashbook-toggle button { padding: 7px 16px; border-radius: 999px; border: 1px solid var(--line-strong); background: #fff; color: var(--text); font-weight: 700; font-size: 12.5px; cursor: pointer; }
  .cashbook-toggle button.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  .section-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .section-head h3 { margin: 0; }
  .search-input { padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; font-size: 13px; width: 260px; max-width: 100%; }
  .search-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
  table.data-table th { text-align: left; background: var(--brand); color: #fff; padding: 9px 10px; font-weight: 700; white-space: nowrap; }
  table.data-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.data-table tr:nth-child(even) td { background: var(--panel-soft); }
  table.data-table tr.row-paid td { background: var(--success-soft) !important; }
  .badge-overdue { color: var(--danger); font-weight: 800; }
  .badge-paid { color: var(--success); font-weight: 800; }
  .alert-card { border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; border: 1px solid #fecaca; background: var(--danger-soft); color: #991b1b; font-size: 13px; }
  .empty-row td { text-align: center; padding: 18px; color: var(--muted); }

  .hamburger-btn { display: none; padding: 7px 11px; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 16px; line-height: 1; }
  .sidebar-backdrop { display: none; }
  @media (max-width: 900px) {
    .hamburger-btn { display: inline-flex; align-items: center; justify-content: center; }
    .satco-sidebar.open {
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0; width: 260px; z-index: 60;
      box-shadow: 0 10px 40px rgba(0,0,0,.25); overflow-y: auto;
    }
    .sidebar-backdrop.open { display: block; position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 55; }
    .satco-main { padding: 14px; }
    .topbar { align-items: flex-start; margin: -14px -14px 14px; padding: 12px 14px; }
  }
  @media (max-width: 480px) {
    .kpi-value { font-size: 22px; }
    .content-card { padding: 14px; }
    .page-title { font-size: 18px; }
    .topbar .page-title { font-size: 16px; }
    .topbar .page-desc { display: none; }
    .topbar .pill { display: none; }
  }
</style>

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// Same Supabase project as satco-finance (this app's tables live in the "ops" schema there)
const SUPABASE_URL = "https://mbwsfwebbrzurpozyxks.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1id3Nmd2ViYnJ6dXJwb3p5eGtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyODA0MzMsImV4cCI6MjA5Njg1NjQzM30.K2GhBkRnCCjwSv0n42fL-92k1HwXvmDnMszpFo4C8aY";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ops = () => sb.schema("ops");
const fmt = (n) => Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// Finds an existing customer by name (case-insensitive) or creates one. Returns the customer id, or null if no name given.
async function getOrCreateCustomerId(name) {
  const trimmed = (name || "").trim();
  if (!trimmed) return null;
  const { data: existing, error: findErr } = await ops().from("customers").select("id").ilike("name", trimmed).limit(1).maybeSingle();
  if (findErr) throw findErr;
  if (existing) return existing.id;
  const { data: created, error: createErr } = await ops().from("customers").insert({ name: trimmed }).select("id").single();
  if (createErr) throw createErr;
  return created.id;
}

// Opens an uploaded document (PO or invoice) in a new tab via a short-lived signed URL.
async function viewFile(bucket, path) {
  if (!path) return;
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 3600);
  if (error) { alert("Couldn't open file: " + error.message); return; }
  window.open(data.signedUrl, "_blank");
}

// Opens a document saved by the Finance portal (stored as ".../object/public/<bucket>/<path>")
// through a short-lived signed link, so the storage bucket can stay private.
async function openStoredDoc(url) {
  const m = /\/storage\/v1\/object\/(?:public|sign|authenticated)\/([^/]+)\/([^?#]+)/.exec(url || "");
  if (!m) { if (url) window.open(url, "_blank"); return; }
  const win = window.open("", "_blank");
  const { data, error } = await sb.storage.from(m[1]).createSignedUrl(decodeURIComponent(m[2]), 600);
  if (error || !data?.signedUrl) { if (win) win.close(); alert("Couldn't open document: " + (error?.message || "unknown error")); return; }
  if (win) win.location.href = data.signedUrl; else window.open(data.signedUrl, "_blank");
}

// Double-click to view: Finance-raised invoices/proformas open as a preview in the Finance portal
// (same document Finance generates); uploaded files open directly.
const FINANCE_URL = "https://satco-finance.vercel.app/";
function openFinanceDoc(kind, no) {
  if (!no) return;
  window.open(FINANCE_URL + "?" + (kind === "proforma" ? "view_proforma=" : "view_invoice=") + encodeURIComponent(no), "_blank");
}
const isRowControl = (e) => !!e.target.closest("button,a,input,select,textarea");

function useAuth() {
  const [session, setSession] = useState(undefined); // undefined = loading, null = signed out
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_evt, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);
  return session;
}

function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault();
    setLoading(true);
    setError(null);
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) setError(error.message);
    setLoading(false);
  }

  return (
    <div className="login-shell">
      <div className="login-card">
        <div className="login-hero">
          <div>
            <div className="brand-title" style={{fontSize:20}}>SATCO</div>
            <h1>Ops Portal</h1>
            <p>Petty cash, purchase orders, AI-assisted PO extraction, invoicing, and client statements of account.</p>
          </div>
          <p style={{fontSize:12,color:"#93c5fd"}}>Uses the same sign-in as the Finance Portal.</p>
        </div>
        <div className="login-form">
          <h2>Sign in</h2>
          <div className="hint">Enter your SATCO credentials to continue.</div>
          {error && <div className="login-error">{error}</div>}
          <form onSubmit={handleSubmit}>
            <div className="field" style={{marginBottom:12}}>
              <label>Email</label>
              <input type="email" value={email} onChange={(e)=>setEmail(e.target.value)} required />
            </div>
            <div className="field" style={{marginBottom:16}}>
              <label>Password</label>
              <input type="password" value={password} onChange={(e)=>setPassword(e.target.value)} required />
            </div>
            <button className="btn-primary" type="submit" disabled={loading} style={{width:"100%"}}>
              {loading ? "Signing in…" : "Sign in"}
            </button>
          </form>
          <a className="login-hub-link" href="https://hub.satcoarabiaengg.com">← Back to SATCO Hub</a>
        </div>
      </div>
    </div>
  );
}

function Sidebar({ view, setView, mobileOpen, onCloseMobile }) {
  const items = [
    { id: "dashboard", label: "Dashboard" },
    { id: "pos", label: "Purchase Orders" },
    { id: "invoices", label: "Customer Invoices" },
    { id: "supplier_invoices", label: "Supplier Invoices" },
    { id: "pettycash", label: "Petty Cash" },
    { id: "statements", label: "Statements of Account" },
  ];
  return (
    <React.Fragment>
      <div className={"sidebar-backdrop" + (mobileOpen ? " open" : "")} onClick={onCloseMobile}></div>
      <aside className={"satco-sidebar" + (mobileOpen ? " open" : "")}>
        <div className="brand-card">
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div className="sh-logo">SA</div>
            <div><div className="brand-title">SATCO ARABIA</div><div className="brand-subtitle">Ops Portal</div></div>
          </div>
        </div>
        <div className="nav-title">Menu</div>
        {items.map((it) => (
          <button
            key={it.id}
            className={"nav-btn" + (view === it.id ? " active" : "")}
            onClick={() => { setView(it.id); onCloseMobile(); }}
            style={{ marginBottom: 4 }}
          >
            {it.label}
          </button>
        ))}
      </aside>
    </React.Fragment>
  );
}

function dbDays(d) { if (!d) return null; const t = new Date(); t.setHours(0,0,0,0); const x = new Date(d + "T00:00:00"); return Math.round((x - t) / 86400000); }
function dbDueLabel(days) {
  if (days == null) return { text: "No due date", cls: "db-muted" };
  if (days < 0) return { text: Math.abs(days) + "d overdue", cls: "db-red" };
  if (days === 0) return { text: "Due today", cls: "db-amber" };
  if (days <= 7) return { text: "in " + days + "d", cls: "db-amber" };
  return { text: "in " + days + "d", cls: "db-muted" };
}
function dbShortDate(d) { return d ? new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "2-digit", month: "short" }) : "—"; }
function dbK(n) { const v = Number(n || 0); return Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(2) + "M" : Math.abs(v) >= 1e4 ? (v / 1e3).toFixed(1) + "K" : fmt(v); }

const MONEY_VIEWERS = ["shaik.zaheerudeen@satcoarabiaengg.com", "mail@satcoarabiaengg.com"];
function Dashboard({ setView, userEmail }) {
  const showMoney = MONEY_VIEWERS.includes((userEmail || "").toLowerCase());
  const [d, setD] = useState(null);
  const [err, setErr] = useState("");

  async function load() {
    const [inv, sup, pos, pc, pfo, pay] = await Promise.all([
      ops().from("invoice_summary").select("id, invoice_no, customer_name, po_id, invoice_value, amount_paid, balance_due, due_date, days_delayed, computed_status, currency"),
      sb.from("supplier_invoices").select("id, supplier_name, invoice_number, total_amount, due_date, satco_due_date, status, variance, paid_date, paid_amount"),
      ops().from("purchase_orders").select("id, po_no, po_value, expiry_date, currency, status, deleted_at, customers(name)").eq("status", "open"),
      ops().from("petty_cash").select("entry_date, amount, entry_type, account, deleted_at"),
      sb.from("client_proforma_invoices").select("id, proforma_number, client_name, status, proforma_date"),
      ops().from("payments").select("amount, paid_date, invoice_id, deleted_at").order("paid_date", { ascending: false }).limit(200),
    ]);
    const firstErr = [inv, sup, pos, pc].find((r) => r.error);
    if (firstErr) { setErr(firstErr.error.message); return; }
    setErr("");
    setD({ inv: inv.data || [], sup: sup.data || [], pos: (pos.data || []).filter((p) => !p.deleted_at),
           pc: (pc.data || []).filter((e) => !e.deleted_at), pfo: pfo.data || [], pay: (pay.data || []).filter((p) => !p.deleted_at) });
  }

  // Live: updates as soon as anything changes in Finance / Ops, plus a 60s refresh fallback
  useEffect(() => {
    load();
    const ch = sb.channel("ops-dashboard")
      .on("postgres_changes", { event: "*", schema: "public", table: "supplier_invoices" }, () => load())
      .on("postgres_changes", { event: "*", schema: "ops", table: "invoices" }, () => load())
      .on("postgres_changes", { event: "*", schema: "ops", table: "payments" }, () => load())
      .subscribe();
    const t = setInterval(load, 60000);
    return () => { sb.removeChannel(ch); clearInterval(t); };
  }, []);

  if (err) return <div className="content-card alert-card">Could not load dashboard: {err}</div>;
  if (!d) return <div className="content-card">Loading…</div>;

  const go = (v) => setView && setView(v);
  const today = new Date().toISOString().slice(0, 10);
  const monthKey = today.slice(0, 7);

  // ---- Receivables (customer invoices) ----
  const openInv = d.inv.filter((i) => Number(i.balance_due) > 0.005);
  const aedInv = openInv.filter((i) => (i.currency || "AED") === "AED");
  const otherCur = {};
  openInv.filter((i) => (i.currency || "AED") !== "AED").forEach((i) => { otherCur[i.currency] = (otherCur[i.currency] || 0) + Number(i.balance_due); });
  const recvTotal = aedInv.reduce((s, i) => s + Number(i.balance_due), 0);
  const recvOverdue = aedInv.filter((i) => dbDays(i.due_date) < 0);
  const recvOverdueAmt = recvOverdue.reduce((s, i) => s + Number(i.balance_due), 0);
  const recvNext30 = aedInv.filter((i) => { const x = dbDays(i.due_date); return x != null && x >= 0 && x <= 30; }).reduce((s, i) => s + Number(i.balance_due), 0);
  const incoming = [...openInv].sort((a, b) => (a.due_date || "9999").localeCompare(b.due_date || "9999"));

  // ---- Payables (supplier invoices) ----
  const supDue = (r) => r.satco_due_date || r.due_date;
  const openSup = d.sup.filter((r) => !["Paid", "Disputed"].includes(r.status));
  const disputed = d.sup.filter((r) => r.status === "Disputed");
  const payTotal = openSup.reduce((s, r) => s + (parseFloat(r.total_amount) || 0), 0);
  const payOverdue = openSup.filter((r) => dbDays(supDue(r)) < 0);
  const payNext30 = openSup.filter((r) => { const x = dbDays(supDue(r)); return x != null && x <= 30; }).reduce((s, r) => s + (parseFloat(r.total_amount) || 0), 0);
  const outgoing = [...openSup].sort((a, b) => (supDue(a) || "9999").localeCompare(supDue(b) || "9999"));
  const nextSup = outgoing[0];
  const paidSupMonth = d.sup.filter((r) => r.status === "Paid" && (r.paid_date || "").startsWith(monthKey)).reduce((s, r) => s + (parseFloat(r.paid_amount || r.total_amount) || 0), 0);

  // ---- Cash position over next 30 days ----
  const net30 = recvNext30 + recvOverdueAmt - payNext30;

  // ---- Collected this month ----
  const collectedMonth = d.pay.filter((p) => (p.paid_date || "").startsWith(monthKey)).reduce((s, p) => s + Number(p.amount || 0), 0);
  const invById = Object.fromEntries(d.inv.map((i) => [i.id, i]));
  const recentReceipts = d.pay.slice(0, 5).map((p) => ({ ...p, inv: invById[p.invoice_id] }));

  // ---- Ageing (AED) ----
  const buckets = [
    { label: "Not due", test: (x) => x == null || x >= 0, cls: "b0" },
    { label: "1–30", test: (x) => x < 0 && x >= -30, cls: "b1" },
    { label: "31–60", test: (x) => x < -30 && x >= -60, cls: "b2" },
    { label: "61–90", test: (x) => x < -60 && x >= -90, cls: "b3" },
    { label: "90+", test: (x) => x < -90, cls: "b4" },
  ].map((b) => ({ ...b, total: aedInv.filter((i) => b.test(dbDays(i.due_date))).reduce((s, i) => s + Number(i.balance_due), 0) }));
  const ageMax = Math.max(1, ...buckets.map((b) => b.total));

  // ---- Top customers by balance ----
  const byCust = {};
  aedInv.forEach((i) => { const k = i.customer_name || "—"; byCust[k] = byCust[k] || { name: k, bal: 0, overdue: 0, n: 0 }; byCust[k].bal += Number(i.balance_due); byCust[k].n++; if (dbDays(i.due_date) < 0) byCust[k].overdue += Number(i.balance_due); });
  const topCust = Object.values(byCust).sort((a, b) => b.bal - a.bal).slice(0, 5);

  // ---- PO utilisation ----
  const invByPo = {};
  d.inv.forEach((i) => { if (i.po_id) invByPo[i.po_id] = (invByPo[i.po_id] || 0) + Number(i.invoice_value || 0); });
  const poRows = d.pos.map((p) => {
    const invoiced = invByPo[p.id] || 0, val = Number(p.po_value || 0);
    return { ...p, invoiced, val, pct: val > 0 ? invoiced / val * 100 : null, remaining: val > 0 ? val - invoiced : null, exp: dbDays(p.expiry_date) };
  }).sort((a, b) => (b.val || 0) - (a.val || 0));
  const poRemaining = poRows.reduce((s, p) => s + Math.max(0, p.remaining || 0), 0);

  // ---- Petty cash ----
  const pcAcc = {};
  d.pc.forEach((e) => { const k = e.account || "Unassigned"; pcAcc[k] = pcAcc[k] || { name: k, bal: 0, spentMonth: 0 }; const a = Number(e.amount || 0); if (e.entry_type === "receipt") pcAcc[k].bal += a; else { pcAcc[k].bal -= a; if ((e.entry_date || "").startsWith(monthKey)) pcAcc[k].spentMonth += a; } });
  const pcList = Object.values(pcAcc).sort((a, b) => a.name.localeCompare(b.name));
  const pcSpentMonth = pcList.reduce((s, a) => s + a.spentMonth, 0);

  // ---- Alerts ----
  const alerts = [];
  recvOverdue.forEach((i) => alerts.push({ lvl: "red", text: `${i.customer_name} — invoice ${i.invoice_no} is ${Math.abs(dbDays(i.due_date))} days overdue (AED ${fmt(i.balance_due)})`, view: "statements" }));
  payOverdue.forEach((r) => alerts.push({ lvl: "red", text: `Supplier payment overdue: ${r.supplier_name} inv ${r.invoice_number} — AED ${fmt(r.total_amount)} was due ${dbShortDate(supDue(r))}`, view: "supplier_invoices" }));
  openSup.filter((r) => { const x = dbDays(supDue(r)); return x != null && x >= 0 && x <= 7; }).forEach((r) => alerts.push({ lvl: "amber", text: `Pay ${r.supplier_name} (inv ${r.invoice_number}) by ${dbShortDate(supDue(r))} — AED ${fmt(r.total_amount)}`, view: "supplier_invoices" }));
  openSup.filter((r) => Math.abs(parseFloat(r.variance) || 0) > 0.5).forEach((r) => alerts.push({ lvl: "amber", text: `${r.supplier_name} inv ${r.invoice_number} differs from Mobilisation portal by AED ${fmt(r.variance)}`, view: "supplier_invoices" }));
  disputed.forEach((r) => alerts.push({ lvl: "amber", text: `Disputed supplier invoice: ${r.supplier_name} ${r.invoice_number}`, view: "supplier_invoices" }));
  poRows.forEach((p) => {
    if (p.exp != null && p.exp < 0) alerts.push({ lvl: "amber", text: `PO ${p.po_no} (${p.customers?.name || "—"}) expired ${dbShortDate(p.expiry_date)} but is still open`, view: "pos" });
    else if (p.exp != null && p.exp <= 30) alerts.push({ lvl: "amber", text: `PO ${p.po_no} (${p.customers?.name || "—"}) expires in ${p.exp} days`, view: "pos" });
    if (p.pct != null && p.pct > 100) alerts.push({ lvl: "amber", text: `PO ${p.po_no} is over-invoiced — AED ${fmt(p.invoiced)} invoiced vs PO value ${fmt(p.val)}`, view: "pos" });
  });
  d.pfo.filter((p) => (p.status || "").toLowerCase() === "draft").forEach((p) => alerts.push({ lvl: "blue", text: `Proforma ${p.proforma_number || ""} for ${p.client_name} is still in draft (since ${dbShortDate(p.proforma_date)})`, view: "invoices" }));
  pcList.filter((a) => a.bal < 0).forEach((a) => alerts.push({ lvl: "amber", text: `Petty cash (${a.name}) is negative: AED ${fmt(a.bal)} — top-up needed`, view: "pettycash" }));
  const lvlOrder = { red: 0, amber: 1, blue: 2 };
  alerts.sort((a, b) => lvlOrder[a.lvl] - lvlOrder[b.lvl]);

  const otherCurText = Object.entries(otherCur).map(([c, v]) => `+ ${c} ${fmt(v)}`).join(" · ");

  return (
    <div className="db">
      {/* KPI row — owners only */}
      {showMoney && <>
      <div className="db-kpis">
        <div className="kpi-card db-click" onClick={() => go("statements")}>
          <div className="kpi-label">Receivable from customers</div>
          <div className="kpi-value">AED {fmt(recvTotal)}</div>
          <div className="db-sub">{aedInv.length} unpaid invoice{aedInv.length === 1 ? "" : "s"}{recvOverdueAmt > 0 ? <span className="db-red"> · {fmt(recvOverdueAmt)} overdue</span> : <span className="db-green"> · nothing overdue</span>}{otherCurText && <span> · {otherCurText}</span>}</div>
        </div>
        <div className="kpi-card db-click" onClick={() => go("supplier_invoices")}>
          <div className="kpi-label">Payable to suppliers</div>
          <div className="kpi-value">AED {fmt(payTotal)}</div>
          <div className="db-sub">{openSup.length} unpaid{nextSup ? <span> · next due {dbShortDate(supDue(nextSup))}</span> : ""}{payOverdue.length > 0 && <span className="db-red"> · {payOverdue.length} overdue</span>}</div>
        </div>

        <h3>Needs attention {alerts.length > 0 && <span className="db-count">{alerts.length}</span>}</h3>

        <div className="content-card">

                  <td className="db-nowrap"><div>{dbShortDate(i.due_date)}</div><div className={"db-sub " + lab.cls}>{lab.text}</div></td>
                  <td className="db-amt">{(i.currency || "AED") !== "AED" ? i.currency + " " : ""}{fmt(i.balance_due)}</td>
                </tr>); })}

          {incoming.length > 8 && <div className="db-sub" style={{ marginTop: 8 }}>+ {incoming.length - 8} more</div>}
        </div>

        <div className="content-card">
          <div className="db-head"><h3>Money going out — supplier payments due</h3><button className="db-link" onClick={() => go("supplier_invoices")}>View all →</button></div>
          {outgoing.length === 0 ? <div className="db-empty">No unpaid supplier invoices.</div> : (

      {/* Ageing + top customers */}

        <div className="content-card">
          <h3>Receivables ageing (AED)</h3>

            {buckets.map((b) => (
              <div key={b.label} className="db-age-row">
                <div className="db-age-label">{b.label === "Not due" ? b.label : b.label + " days"}</div>
                <div className="db-bar-track"><div className={"db-bar " + b.cls} style={{ width: (b.total / ageMax * 100) + "%" }}></div></div>
                <div className="db-amt">{fmt(b.total)}</div>

        </div>
        <div className="content-card">
          <div className="db-head"><h3>Top customers by balance</h3><button className="db-link" onClick={() => go("statements")}>Statements →</button></div>
          {topCust.length === 0 ? <div className="db-empty">No balances outstanding.</div> : (
            <table className="db-table"><tbody>
              {topCust.map((c) => (
                <tr key={c.name}>
                  <td><div className="db-name">{c.name}</div><div className="db-sub">{c.n} invoice{c.n === 1 ? "" : "s"}{c.overdue > 0 && <span className="db-red"> · {fmt(c.overdue)} overdue</span>}</div></td>
                  <td className="db-amt">{fmt(c.bal)}</td>

      {/* PO utilisation + petty cash / recent receipts */}
      <div className="db-two db-two-wide">
        <div className="content-card">
          <div className="db-head"><h3>Open purchase orders — invoiced vs PO value</h3><button className="db-link" onClick={() => go("pos")}>View all →</button></div>

            {poRows.map((p) => {
              const expLab = p.exp == null ? null : p.exp < 0 ? <span className="db-red">expired {dbShortDate(p.expiry_date)}</span> : p.exp <= 30 ? <span className="db-amber">expires {dbShortDate(p.expiry_date)}</span> : <span>expires {dbShortDate(p.expiry_date)}</span>;
              return (
                <tr key={p.id}>
                  <td style={{ width: "38%" }}><div className="db-name">{p.po_no}</div><div className="db-sub">{p.customers?.name || "—"}{expLab && <span> · {expLab}</span>}</div></td>
                  <td>
                    {p.pct == null ? <div className="db-sub">Open-ended / rate-based PO · {fmt(p.invoiced)} invoiced</div> : (
                      <React.Fragment>
                        <div className="db-bar-track"><div className={"db-bar " + (p.pct > 100 ? "b4" : p.pct > 85 ? "b2" : "b0")} style={{ width: Math.min(100, p.pct) + "%" }}></div></div>
                        <div className="db-sub">{fmt(p.invoiced)} of {fmt(p.val)} · {p.pct.toFixed(0)}%</div>

                  <td className="db-amt">{p.remaining != null ? <span className={p.remaining < 0 ? "db-red" : ""}>{fmt(p.remaining)}<div className="db-sub">{p.remaining < 0 ? "over" : "left"}</div></span> : "—"}</td>

        <div>
          <div className="content-card">
            <div className="db-head"><h3>Petty cash by account</h3><button className="db-link" onClick={() => go("pettycash")}>Open →</button></div>

              {pcList.map((a) => (
                <tr key={a.name}>

                  <td className={"db-amt " + (a.bal < 0 ? "db-red" : "")}>{fmt(a.bal)}</td>

            <h3>Recent customer receipts</h3>
            {recentReceipts.length === 0 ? <div className="db-empty">No payments recorded yet.</div> : (
              <table className="db-table"><tbody>
                {recentReceipts.map((p, i) => (
                  <tr key={i}>
                    <td><div className="db-name">{p.inv?.customer_name || "—"}</div><div className="db-sub">Inv {p.inv?.invoice_no || "—"} · {dbShortDate(p.paid_date)}</div></td>
                    <td className="db-amt db-green">{(p.inv?.currency || "AED") !== "AED" ? p.inv.currency + " " : ""}{fmt(p.amount)}</td>

            )}

        </div>
      </div>
    </div>

}

function EditPoRow({ po, colSpan, onCancel, onSaved }) {
  const [form, setForm] = useState({
    po_no: po.po_no || "",
    po_date: po.po_date || "",
    expiry_date: po.expiry_date || "",
    currency: po.currency || "AED",
    po_value: po.po_value ?? 0,
    payment_terms_days: po.payment_terms_days ?? 30,
    status: po.status || "open",
    remarks: po.remarks || "",
    customer_name: po.customers?.name || "",
  });
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState(null);

  async function save() {
    setSaving(true);
    setErr(null);
    try {
      const customerId = await getOrCreateCustomerId(form.customer_name);
      const payload = {
        po_no: (form.po_no || "").trim(),
        po_date: form.po_date,
        expiry_date: form.expiry_date || null,
        currency: form.currency,
        po_value: Number(form.po_value) || 0,
        payment_terms_days: Number(form.payment_terms_days) || 30,
        status: form.status,
        remarks: form.remarks || null,
        customer_id: customerId,
      };
      const { error } = await ops().from("purchase_orders").update(payload).eq("id", po.id);
      if (error) throw error;
      onSaved();
    } catch (error) {
      setErr(error.message);
    } finally {
      setSaving(false);
    }
  }

  return (
    <tr className="edit-row">
      <td colSpan={colSpan}>
        {err && <div className="alert-card">{err}</div>}
        <div className="form-grid">
          <div className="field"><label>PO No.</label><input value={form.po_no} onChange={(e)=>setForm({...form, po_no:e.target.value})} /></div>
          <div className="field"><label>PO Date</label><input type="date" value={form.po_date} onChange={(e)=>setForm({...form, po_date:e.target.value})} /></div>
          <div className="field"><label>Expiry Date</label><input type="date" value={form.expiry_date} onChange={(e)=>setForm({...form, expiry_date:e.target.value})} /></div>
          <div className="field"><label>Customer</label><input value={form.customer_name} onChange={(e)=>setForm({...form, customer_name:e.target.value})} /></div>
          <div className="field">
            <label>Currency</label>
            <select value={form.currency} onChange={(e)=>setForm({...form, currency:e.target.value})}>
              <option value="AED">AED</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="INR">INR</option>
            </select>
          </div>
          <div className="field"><label>PO Value</label><input type="number" step="0.01" value={form.po_value} onChange={(e)=>setForm({...form, po_value:e.target.value})} /></div>
          <div className="field"><label>Payment Terms (days)</label><input type="number" value={form.payment_terms_days} onChange={(e)=>setForm({...form, payment_terms_days:e.target.value})} /></div>
          <div className="field">
            <label>Status</label>
            <select value={form.status} onChange={(e)=>setForm({...form, status:e.target.value})}>
              <option value="open">open</option>
              <option value="partially_invoiced">partially_invoiced</option>
              <option value="closed">closed</option>
            </select>
          </div>
          <div className="field" style={{gridColumn:"1/-1"}}><label>Remarks</label><input value={form.remarks} onChange={(e)=>setForm({...form, remarks:e.target.value})} /></div>
          <div>
            <button type="button" className="btn-mini primary" disabled={saving} onClick={save}>{saving ? "Saving…" : "Save"}</button>
            <button type="button" className="btn-mini" onClick={onCancel}>Cancel</button>
          </div>
        </div>
      </td>
    </tr>
  );
}

function PurchaseOrders() {
  const [pos, setPos] = useState([]);
  const [uploading, setUploading] = useState(false);
  const [extracted, setExtracted] = useState(null);
  const [filePath, setFilePath] = useState(null);
  const [error, setError] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [deletingId, setDeletingId] = useState(null);
  const [search, setSearch] = useState("");

  async function load() {
    const { data } = await ops().from("purchase_orders").select("id, po_no, po_date, expiry_date, currency, po_value, status, remarks, source_file_url, customer_id, customers(name)").order("created_at", { ascending: false });
    setPos(data || []);
  }
  useEffect(() => { load(); }, []);

  async function handleDelete(po) {
    if (!window.confirm(`Delete PO ${po.po_no}? This cannot be undone.`)) return;
    setDeletingId(po.id);
    setError(null);
    const { error: delErr } = await ops().from("purchase_orders").delete().eq("id", po.id);
    setDeletingId(null);
    if (delErr) {
      setError(
        delErr.message?.includes("foreign key")
          ? `Can't delete ${po.po_no} — it has invoices raised against it. Remove those invoices first.`
          : delErr.message
      );
      return;
    }
    load();
  }

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    setError(null);
    try {
      const path = `${Date.now()}-${file.name}`;
      const { error: upErr } = await sb.storage.from("po-documents").upload(path, file);
      if (upErr) throw upErr;
      setFilePath(path);
      const { data, error: fnErr } = await sb.functions.invoke("extract-po", { body: { file_path: path } });
      if (fnErr) throw fnErr;
      setExtracted(data || {});
    } catch (err) {
      setError(err.message || "Upload/extraction failed");
    } finally {
      setUploading(false);
    }
  }

  async function handleConfirm(e) {
    e.preventDefault();
    const f = new FormData(e.target);
    const poNo = (f.get("po_no") || "").trim();
    if (!poNo) { setError("PO No. is required — the AI could not read it from the document, please type it in."); return; }
    try {
      const customerId = await getOrCreateCustomerId(f.get("customer_name"));
      const payload = {
        po_no: poNo,
        po_date: f.get("po_date"),
        expiry_date: f.get("expiry_date") || null,
        currency: f.get("currency") || "AED",
        po_value: Number(f.get("po_value")) || 0,
        payment_terms_days: Number(f.get("payment_terms_days")) || 30,
        remarks: (f.get("remarks") || "").trim() || null,
        customer_id: customerId,
        status: "open",
        source_file_url: filePath,
        extracted_raw: extracted,
      };
      const { error: insErr } = await ops().from("purchase_orders").insert(payload);
      if (insErr) throw insErr;
      setExtracted(null);
      setFilePath(null);
      setError(null);
      e.target.reset();
      load();
    } catch (err) {
      setError(err.message);
    }
  }

  const visiblePos = pos.filter((po) => {
    const q = search.trim().toLowerCase();
    if (!q) return true;
    return [po.po_no, po.customers?.name, po.status, po.remarks, po.currency]
      .some((v) => (v || "").toString().toLowerCase().includes(q));
  });

  return (
    <div>
      <div className="content-card">
        <h3>Upload a PO</h3>
        <input type="file" accept="application/pdf,image/*" onChange={handleFile} disabled={uploading} />
        {uploading && <p>Uploading and extracting fields…</p>}
        {error && <div className="alert-card">{error}</div>}
        {extracted && (
          <form onSubmit={handleConfirm} className="form-grid" style={{ marginTop: 14 }}>
            <p style={{ gridColumn: "1/-1", color: "var(--muted)", fontSize: 13 }}>
              Review the AI-extracted fields before saving. Anything the AI missed is left blank for you to fill in.
            </p>
            <div className="field">
              <label>PO No.</label>
              <input name="po_no" defaultValue={extracted.po_no || ""} placeholder="Not detected — enter manually" required />
              {!extracted.po_no && <div className="hint-text">Not detected by AI — please enter manually.</div>}
            </div>
            <div className="field"><label>PO Date</label><input type="date" name="po_date" defaultValue={extracted.po_date || ""} required /></div>
            <div className="field"><label>Expiry Date</label><input type="date" name="expiry_date" defaultValue={extracted.expiry_date || ""} /></div>
            <div className="field">
              <label>Customer</label>
              <input name="customer_name" defaultValue={extracted.customer_name || ""} placeholder="Not detected — enter manually" />
              {!extracted.customer_name && <div className="hint-text">Not detected by AI — please enter manually.</div>}
            </div>
            <div className="field">
              <label>Currency</label>
              <select name="currency" defaultValue={extracted.currency || "AED"}>
                <option value="AED">AED</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="INR">INR</option>
              </select>
            </div>
            <div className="field">
              <label>PO Value</label>
              <input type="number" step="0.01" name="po_value" defaultValue={extracted.po_value ?? 0} required />
              {(extracted.po_value === null || extracted.po_value === undefined) && <div className="hint-text">Not detected by AI — defaulted to 0.</div>}
            </div>
            <div className="field"><label>Payment Terms (days)</label><input type="number" name="payment_terms_days" defaultValue={extracted.payment_terms_days ?? 30} required /></div>
            <div className="field" style={{gridColumn:"1/-1"}}><label>Remarks</label><input name="remarks" placeholder="Optional notes about this PO" /></div>
            <button className="btn-primary" type="submit">Confirm &amp; Save</button>
          </form>
        )}
      </div>

      <div className="content-card">
        <div className="section-head">
          <h3>Purchase Orders</h3>
          <input type="text" className="search-input" value={search} onChange={(e)=>setSearch(e.target.value)} placeholder="Search PO no., customer, status…" />
        </div>
        <div className="table-scroll">
        <table className="data-table">
          <thead><tr><th>PO No.</th><th>PO Date</th><th>Expiry Date</th><th>Customer</th><th>Currency</th><th>Value</th><th>Status</th><th>Remarks</th><th>Actions</th></tr></thead>
          <tbody>
            {visiblePos.map((po) => (
              editingId === po.id ? (
                <EditPoRow key={po.id} po={po} colSpan={9} onCancel={() => setEditingId(null)} onSaved={() => { setEditingId(null); load(); }} />
              ) : (
                <tr key={po.id}>
                  <td>{po.po_no}</td><td>{po.po_date}</td><td>{po.expiry_date || "—"}</td><td>{po.customers?.name || "—"}</td>
                  <td>{po.currency || "AED"}</td><td>{fmt(po.po_value)}</td><td>{po.status}</td><td>{po.remarks || "—"}</td>
                  <td>
                    {po.source_file_url && <button className="btn-mini" onClick={() => viewFile("po-documents", po.source_file_url)}>View</button>}
                    <button className="btn-mini" onClick={() => setEditingId(po.id)}>Edit</button>
                    <button className="btn-mini danger" disabled={deletingId === po.id} onClick={() => handleDelete(po)}>
                      {deletingId === po.id ? "Deleting…" : "Delete"}
                    </button>
                  </td>
                </tr>
              )
            ))}
            {visiblePos.length === 0 && <tr className="empty-row"><td colSpan="9">{pos.length === 0 ? "No purchase orders yet." : "No purchase orders match your search."}</td></tr>}
          </tbody>
        </table>
        </div>
      </div>
    </div>
  );
}

function EditInvoiceRow({ inv, colSpan, onCancel, onSaved }) {
  const [custList, setCustList] = useState([]);
  useEffect(() => { if (!inv.po_id) ops().from("customers").select("id, name").order("name").then(({ data }) => setCustList(data || [])); }, []);
  const [form, setForm] = useState({
    customer_id: inv.customer_id || "",
    new_customer: "",
    invoice_no: inv.invoice_no || "",
    invoice_date: inv.invoice_date || "",
    currency: inv.currency || "AED",
    invoice_value: inv.invoice_value ?? 0,
    period_from: inv.period_from || "",
    period_to: inv.period_to || "",
    payment_terms_days: inv.payment_terms_days ?? 30,
    status: inv.computed_status && inv.computed_status !== "Paid" && inv.computed_status !== "Overdue" ? inv.computed_status.toLowerCase() : "draft",
  });
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState(null);

  async function save() {
    setSaving(true);
    setErr(null);
    const invoiceNo = (form.invoice_no || "").trim();
    if (!invoiceNo) { setErr("Invoice No. is required."); setSaving(false); return; }
    let customerPatch = {};
    if (!inv.po_id) {
      let cid = form.customer_id;
      if (cid === "__new") {
        const name = (form.new_customer || "").trim();
        if (!name) { setErr("Enter the new customer's name."); setSaving(false); return; }
        const ex = custList.find(c => c.name.trim().toLowerCase() === name.toLowerCase());
        if (ex) cid = ex.id;
        else { const { data: nc, error: cErr } = await ops().from("customers").insert({ name, payment_terms_days: 30 }).select("id").single(); if (cErr) { setErr(cErr.message); setSaving(false); return; } cid = nc.id; }
      }
      customerPatch = { customer_id: cid || null };
    }
    const payload = {
      ...customerPatch,
      invoice_no: invoiceNo,
      invoice_date: form.invoice_date,
      currency: form.currency,
      invoice_value: Number(form.invoice_value) || 0,
      period_from: form.period_from || null,
      period_to: form.period_to || null,
      payment_terms_days: Number(form.payment_terms_days) || 30,
      status: form.status,
    };
    const { error } = await ops().from("invoices").update(payload).eq("id", inv.id);
    setSaving(false);
    if (error) {
      setErr(error.message?.includes("duplicate") ? `Invoice number "${invoiceNo}" is already in use.` : error.message);
      return;
    }
    onSaved();
  }

  return (
    <tr className="edit-row">
      <td colSpan={colSpan}>
        {err && <div className="alert-card">{err}</div>}
        <div className="form-grid">
          {!inv.po_id && <div className="field">
            <label>Customer (no PO)</label>
            <select value={form.customer_id} onChange={(e)=>setForm({...form, customer_id:e.target.value})}>
              <option value="">— Select customer —</option>
              {custList.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              <option value="__new">＋ New customer…</option>
            </select>
          </div>}

function ManagePaymentsRow({ inv, colSpan, onClose, onChanged }) {
  const [payments, setPayments] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [adding, setAdding] = useState(false);
  const [addForm, setAddForm] = useState({ amount: Math.max(Number(inv.balance_due) || 0, 0), paid_date: new Date().toISOString().slice(0, 10), mode: "bank_transfer", remarks: "" });
  const [busy, setBusy] = useState(false);

  async function load() {
    setLoading(true);
    const { data, error } = await ops().from("payments").select("*").eq("invoice_id", inv.id).order("paid_date", { ascending: false });
    if (error) setErr(error.message);
    setPayments(data || []);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  function startEdit(p) {
    setErr(null);
    setEditingId(p.id);
    setEditForm({ amount: p.amount, paid_date: p.paid_date, mode: p.mode || "bank_transfer", remarks: p.remarks || "" });
  }

  async function saveEdit(id) {
    setBusy(true);
    setErr(null);
    const amount = Number(editForm.amount);
    if (!amount || amount <= 0) { setErr("Enter a payment amount greater than 0."); setBusy(false); return; }
    if (!editForm.paid_date) { setErr("Payment date is required."); setBusy(false); return; }
    const { error } = await ops().from("payments").update({ amount, paid_date: editForm.paid_date, mode: editForm.mode, remarks: editForm.remarks || null }).eq("id", id);
    setBusy(false);
    if (error) { setErr(error.message); return; }
    setEditingId(null);
    await load();
    onChanged();
  }

  async function deletePayment(p) {
    if (!window.confirm(`Delete this payment of ${fmt(p.amount)} dated ${p.paid_date}? This cannot be undone.`)) return;
    setBusy(true);
    setErr(null);
    const { error } = await ops().from("payments").delete().eq("id", p.id);
    setBusy(false);
    if (error) { setErr(error.message); return; }
    await load();
    onChanged();
  }

  async function addPayment() {
    setBusy(true);
    setErr(null);
    const amount = Number(addForm.amount);
    if (!amount || amount <= 0) { setErr("Enter a payment amount greater than 0."); setBusy(false); return; }
    if (!addForm.paid_date) { setErr("Payment date is required."); setBusy(false); return; }
    const { error } = await ops().from("payments").insert({ invoice_id: inv.id, amount, paid_date: addForm.paid_date, mode: addForm.mode, remarks: addForm.remarks || null });
    setBusy(false);
    if (error) { setErr(error.message); return; }
    setAdding(false);
    setAddForm({ amount: 0, paid_date: new Date().toISOString().slice(0, 10), mode: "bank_transfer", remarks: "" });
    await load();
    onChanged();
  }

  const totalPaid = payments.reduce((s, p) => s + Number(p.amount), 0);

  return (
    <tr className="edit-row">
      <td colSpan={colSpan}>
        {err && <div className="alert-card">{err}</div>}
        <div style={{ marginBottom: 10, fontSize: 13 }}>
          <strong>Payments recorded against {inv.invoice_no}</strong>
          <span style={{ marginLeft: 10, color: "var(--muted)" }}>
            Invoice value: {inv.currency || "AED"} {fmt(inv.invoice_value)} — Total paid: {fmt(totalPaid)}
          </span>
        </div>
        {loading ? (
          <p>Loading…</p>
        ) : payments.length === 0 ? (
          <p style={{ color: "var(--muted)", fontSize: 13 }}>No payments recorded yet.</p>
        ) : (
          <table className="data-table" style={{ marginBottom: 12 }}>
            <thead><tr><th>Payment Date</th><th>Amount</th><th>Mode</th><th>Remarks</th><th>Actions</th></tr></thead>
            <tbody>
              {payments.map((p) => (
                editingId === p.id ? (
                  <tr key={p.id}>
                    <td><input type="date" value={editForm.paid_date} onChange={(e)=>setEditForm({...editForm, paid_date:e.target.value})} /></td>
                    <td><input type="number" step="0.01" value={editForm.amount} onChange={(e)=>setEditForm({...editForm, amount:e.target.value})} style={{ width: 110 }} /></td>
                    <td>
                      <select value={editForm.mode} onChange={(e)=>setEditForm({...editForm, mode:e.target.value})}>
                        <option value="bank_transfer">Bank Transfer</option>
                        <option value="cash">Cash</option>
                        <option value="cheque">Cheque</option>
                        <option value="card">Card</option>
                        <option value="other">Other</option>
                      </select>
                    </td>
                    <td><input type="text" value={editForm.remarks} onChange={(e)=>setEditForm({...editForm, remarks:e.target.value})} placeholder="Optional" style={{ width: 160 }} /></td>
                    <td>
                      <button className="btn-mini primary" disabled={busy} onClick={() => saveEdit(p.id)}>Save</button>
                      <button className="btn-mini" onClick={() => setEditingId(null)}>Cancel</button>
                    </td>
                  </tr>
                ) : (
                  <tr key={p.id}>
                    <td>{p.paid_date}</td><td>{fmt(p.amount)}</td><td>{(p.mode || "").replace("_", " ")}</td>
                    <td>{p.remarks || "—"}</td>
                    <td>
                      <button className="btn-mini" onClick={() => startEdit(p)}>Edit</button>
                      <button className="btn-mini danger" disabled={busy} onClick={() => deletePayment(p)}>Delete</button>
                    </td>
                  </tr>
                )
              ))}
            </tbody>
          </table>
        )}
        {adding ? (
          <div className="form-grid" style={{ marginBottom: 10 }}>
            <div className="field"><label>Payment Amount ({inv.currency || "AED"})</label><input type="number" step="0.01" value={addForm.amount} onChange={(e)=>setAddForm({...addForm, amount:e.target.value})} /></div>
            <div className="field"><label>Payment Date</label><input type="date" value={addForm.paid_date} onChange={(e)=>setAddForm({...addForm, paid_date:e.target.value})} /></div>
            <div className="field">
              <label>Mode</label>
              <select value={addForm.mode} onChange={(e)=>setAddForm({...addForm, mode:e.target.value})}>
                <option value="bank_transfer">Bank Transfer</option>
                <option value="cash">Cash</option>
                <option value="cheque">Cheque</option>
                <option value="card">Card</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div className="field"><label>Remarks</label><input type="text" value={addForm.remarks} onChange={(e)=>setAddForm({...addForm, remarks:e.target.value})} placeholder="Optional" /></div>
            <div>
              <button type="button" className="btn-mini primary" disabled={busy} onClick={addPayment}>{busy ? "Saving…" : "Add Payment"}</button>
              <button type="button" className="btn-mini" onClick={() => setAdding(false)}>Cancel</button>
            </div>
          </div>
        ) : (
          <button type="button" className="btn-mini primary" onClick={() => setAdding(true)} style={{ marginBottom: 10 }}>+ Add Payment</button>
        )}
        <div>
          <button type="button" className="btn-mini" onClick={onClose}>Close</button>
        </div>
      </td>
    </tr>
  );

// ── PROFORMA INVOICES (read-only, shown inside Customer Invoices) ──────────────
// Raised and managed in the Finance portal (public.client_proforma_invoices / _lines).
// Ops lists them alongside tax invoices with a PROFORMA tag; they are NOT receivables, so they are
// excluded from balances, aging, the dashboard and statements. Live via Supabase realtime.
const PFO_STATUS = {
  draft:     { label:"Draft",     background:"#f1f5f9", color:"#475569" },
  sent:      { label:"Sent",      background:"#dbeafe", color:"#1e40af" },
  received:  { label:"Received",  background:"#dcfce7", color:"#166534" },
  cancelled: { label:"Cancelled", background:"#fee2e2", color:"#991b1b" },
};
function pfoLine(l) {
  const qty = l.qty === "" || l.qty == null ? 1 : Number(l.qty) || 0;
  const rate = Number(l.unit_rate) || 0, discount = Number(l.discount) || 0;
  const vatPct = l.vat_pct === "" || l.vat_pct == null ? 5 : Number(l.vat_pct);
  const taxable = qty * rate - discount, vatAmt = Math.round(taxable * vatPct) / 100;
  return { qty, rate, discount, vatPct, taxable, vatAmt, incl: taxable + vatAmt };
}
function pfoTotals(lines) {
  return (lines || []).reduce((s, l) => { const c = pfoLine(l); s.taxable += c.taxable; s.vatAmt += c.vatAmt; s.incl += c.incl; return s; }, { taxable:0, vatAmt:0, incl:0 });
}
function PfoBadge({ status }) {
  const s = PFO_STATUS[status] || { label: status || "—", background:"#f1f5f9", color:"#334155" };
  return <span style={{ padding:"2px 9px", borderRadius:999, fontSize:11, fontWeight:800, background:s.background, color:s.color }}>{s.label}</span>;
}
const PFO_TAG = <span style={{ marginLeft:6, padding:"1px 7px", borderRadius:6, fontSize:10, fontWeight:900, letterSpacing:".05em", background:"#fef3c7", color:"#92400e", border:"1px solid #fcd34d" }}>PROFORMA</span>;

function useProformaData() {
  const [rows, setRows] = useState([]);
  const [linesMap, setLinesMap] = useState({});
  const [recoveries, setRecoveries] = useState([]);
  async function load() {
    const [pf, pl, ci] = await Promise.all([
      sb.from("client_proforma_invoices").select("*").order("proforma_date", { ascending: false }),
      sb.from("client_proforma_lines").select("*").order("sort_order", { ascending: true }),
      sb.from("client_invoices").select("id,invoice_number,invoice_date,advance_proforma_id,advance_recovery_pct,advance_recovery_amount").not("advance_proforma_id", "is", null),
    ]);
    if (!pf.error) setRows(pf.data || []);
    const m = {}; (pl.data || []).forEach(l => { (m[l.proforma_id] = m[l.proforma_id] || []).push(l); });
    setLinesMap(m);
    setRecoveries(ci.data || []);
  }
  useEffect(() => {
    load();
    const ch = sb.channel("ops-proforma-invoices")
      .on("postgres_changes", { event: "*", schema: "public", table: "client_proforma_invoices" }, () => load())
      .on("postgres_changes", { event: "*", schema: "public", table: "client_proforma_lines" }, () => load())
      .on("postgres_changes", { event: "*", schema: "public", table: "client_invoices" }, () => load())
      .subscribe();
    const t = setInterval(load, 60000);
    return () => { sb.removeChannel(ch); clearInterval(t); };
  }, []);
  // Advance recovery per received advance proforma (amount excl. VAT, recovered on tax invoices, balance)
  const ledger = React.useMemo(() => {
    const out = {};
    rows.filter(p => p.proforma_type === "advance" && p.status === "received").forEach(p => {
      const amount = pfoTotals(linesMap[p.id]).taxable;
      const invs = recoveries.filter(i => i.advance_proforma_id === p.id && Number(i.advance_recovery_amount) > 0);
      const recovered = invs.reduce((s, i) => s + Number(i.advance_recovery_amount || 0), 0);
      out[p.id] = { amount, recovered, balance: Math.max(0, Math.round((amount - recovered) * 100) / 100), invoices: invs };
    });
    return out;
  }, [rows, linesMap, recoveries]);
  return { proformas: rows, pfLines: linesMap, pfLedger: ledger, reloadProformas: load };
}

function Invoices() {
  const [invoices, setInvoices] = useState([]);
  const [openPos, setOpenPos] = useState([]);
  const [error, setError] = useState(null);
  const [saving, setSaving] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [payingId, setPayingId] = useState(null);
  const [deletingId, setDeletingId] = useState(null);
  const [search, setSearch] = useState("");
  const [customers, setCustomers] = useState([]);
  const [poSel, setPoSel] = useState("");          // PO id, or "__nopo" for a customer without a PO
  const [custSel, setCustSel] = useState("");      // customer id, or "__new"
  const [newCust, setNewCust] = useState("");
  const [typeFilter, setTypeFilter] = useState("all");   // all | tax | proforma
  const [pfDetail, setPfDetail] = useState(null);
  const { proformas, pfLines, pfLedger } = useProformaData();

  async function load() {
    const [{ data: inv }, { data: p }, { data: c }] = await Promise.all([
      ops().from("invoice_summary").select("*").order("invoice_date", { ascending: false }),
      ops().from("purchase_orders").select("id, po_no, po_value, payment_terms_days, customer_id, customers(name)").neq("status", "closed"),
      ops().from("customers").select("id, name, payment_terms_days").order("name"),
    ]);
    setInvoices(inv || []);
    setOpenPos(p || []);
    setCustomers(c || []);
  }
  useEffect(() => { load(); }, []);

  async function handleDelete(inv) {
    if (!window.confirm(`Delete invoice ${inv.invoice_no}? This cannot be undone.`)) return;
    setDeletingId(inv.id);
    setError(null);
    const { error: delErr } = await ops().from("invoices").delete().eq("id", inv.id);
    setDeletingId(null);
    if (delErr) {
      setError(
        delErr.message?.includes("foreign key")
          ? `Can't delete ${inv.invoice_no} — it has payments recorded against it. Remove those payments first.`
          : delErr.message
      );
      return;
    }
    load();
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const f = new FormData(e.target);
    setSaving(true);
    setError(null);
    try {
      const poId = f.get("po_id");
      const invoiceDate = f.get("invoice_date");
      const invoiceValue = Number(f.get("invoice_value"));
      const currency = f.get("currency") || "AED";
      const periodFrom = f.get("period_from") || null;
      const periodTo = f.get("period_to") || null;
      const invoiceNoOverride = (f.get("invoice_no") || "").trim();
      const noPo = poId === "__nopo";
      const po = noPo ? null : openPos.find((p) => p.id === poId);
      if (!noPo && !po) throw new Error("Select a PO, or choose “No PO — customer only”");
      // Customer without a PO: pick an existing customer or add a new one
      let customerId = po ? po.customer_id : null, terms = po ? (po.payment_terms_days || 30) : 30;
      if (noPo) {
        if (custSel === "__new") {
          const name = newCust.trim();
          if (!name) throw new Error("Enter the new customer's name");
          const existing = customers.find(c => c.name.trim().toLowerCase() === name.toLowerCase());
          if (existing) { customerId = existing.id; terms = existing.payment_terms_days || 30; }
          else {
            const { data: nc, error: cErr } = await ops().from("customers").insert({ name, payment_terms_days: 30 }).select("id").single();
            if (cErr) throw cErr;
            customerId = nc.id;
          }
        } else {
          const c = customers.find(c => c.id === custSel);
          if (!c) throw new Error("Select the customer");
          customerId = c.id; terms = c.payment_terms_days || 30;
        }
      }

      let invoiceNo = invoiceNoOverride;
      if (!invoiceNo) {
        const { data: generatedNo, error: numErr } = await ops().rpc("next_invoice_number", { p_invoice_date: invoiceDate, p_series_code: "01" });
        if (numErr) throw numErr;
        invoiceNo = generatedNo;
      }

      let sourceFileUrl = null;
      const file = f.get("invoice_file");
      if (file && file.size > 0) {
        const path = `${Date.now()}-${file.name}`;
        const { error: upErr } = await sb.storage.from("invoice-documents").upload(path, file);
        if (upErr) throw upErr;
        sourceFileUrl = path;
      }

      const { error: insErr } = await ops().from("invoices").insert({
        invoice_no: invoiceNo,
        invoice_date: invoiceDate,
        po_id: po ? po.id : null,
        customer_id: customerId,
        invoice_value: invoiceValue,
        currency,
        period_from: periodFrom,
        period_to: periodTo,
        payment_terms_days: terms,
        status: "draft",
        source_file_url: sourceFileUrl,
      });
      if (insErr) throw insErr;
      e.target.reset();
      setPoSel(""); setCustSel(""); setNewCust("");
      load();
    } catch (err) {
      setError(err.message || "Failed to create invoice");
    } finally {
      setSaving(false);
    }
  }

  const q = search.trim().toLowerCase();
  const visibleInvoices = typeFilter === "proforma" ? [] : invoices.filter((inv) => {
    if (!q) return true;
    return [inv.invoice_no, inv.po_no, inv.customer_name, inv.currency, inv.computed_status, inv.due_date, inv.paid_date]
      .some((v) => (v || "").toString().toLowerCase().includes(q));
  });

                  <td>{inv.currency || "AED"}</td><td>{fmt(inv.invoice_value)}</td><td>{fmt(inv.amount_paid)}</td><td>{fmt(inv.balance_due)}</td>

            ); })())}
            {listRows.length === 0 && <tr className="empty-row"><td colSpan="15">{invoices.length + proformas.length === 0 ? "No invoices yet." : "No invoices match your search."}</td></tr>}

    </div>
  );
