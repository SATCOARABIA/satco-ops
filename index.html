function excelValueToISODate(v) {
  if (v instanceof Date && !isNaN(v)) {
    // SheetJS's cellDates conversion can leave the timestamp a few seconds off true midnight
    // (floating-point drift in its serial->ms conversion), which can push getUTCDate() to the
    // wrong calendar day. Round to the nearest whole day first to recover the intended date.
    const rounded = new Date(Math.round(v.getTime() / 86400000) * 86400000);
    const y = rounded.getUTCFullYear(), m = String(rounded.getUTCMonth() + 1).padStart(2, "0"), d = String(rounded.getUTCDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }
  if (typeof v === "number" && window.XLSX && XLSX.SSF && XLSX.SSF.parse_date_code) {
    const parsed = XLSX.SSF.parse_date_code(v);
    if (parsed) return parsed.y + "-" + String(parsed.m).padStart(2, "0") + "-" + String(parsed.d).padStart(2, "0");
  }
  if (typeof v === "string") {
    // Some source files store dates as plain text in DD.MM.YYYY or DD/MM/YYYY (day-first) format
    // rather than real Excel date cells. JS's native Date parser treats these ambiguously (and
    // silently fails whenever the day is >12), so parse this unambiguous day-first pattern explicitly
    // before falling back to the generic parser below.
    const m = v.trim().match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
    if (m) {
      const d = Number(m[1]), mo = Number(m[2]), y = Number(m[3]);
      if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) {
        return y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0");
      }
    }
  }
  if (v) {
    const parsed = new Date(v);
    if (!isNaN(parsed)) {
      const rounded = new Date(Math.round(parsed.getTime() / 86400000) * 86400000);
      return rounded.getUTCFullYear() + "-" + String(rounded.getUTCMonth() + 1).padStart(2, "0") + "-" + String(rounded.getUTCDate()).padStart(2, "0");
    }
  }
  return null;
}

// Parses a Tally-style "Petty Cash Book" export: Date | Dr/Cr flag | Particulars | .. | Vch Type | Vch No. | Debit | Credit,
// with wrapped description text on the row(s) following each dated transaction.
function parseTallyPettyCash(rows) {
  let headerRow = -1, dateIdx = -1, debitIdx = -1, creditIdx = -1, vchNoIdx = -1, vchTypeIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 25); i++) {
    const row = rows[i] || [];
    const lower = row.map((c) => String(c == null ? "" : c).trim().toLowerCase());
    const dIdx = lower.indexOf("date");
    const debIdx = lower.indexOf("debit");
    const crIdx = lower.indexOf("credit");
    if (dIdx >= 0 && debIdx >= 0 && crIdx >= 0) {
      headerRow = i; dateIdx = dIdx; debitIdx = debIdx; creditIdx = crIdx;
      vchTypeIdx = lower.indexOf("vch type");
      vchNoIdx = lower.findIndex((c) => c.indexOf("vch no") === 0);
      break;
    }
  }
  if (headerRow === -1) return null; // not a Tally-style sheet

  const flagIdx = dateIdx + 1;
  const textIdx = dateIdx + 2;
  const isNumericOnly = (s) => /^[\d,.\s]+$/.test(s);
  const entries = [];
  let i = headerRow + 1;
  while (i < rows.length) {
    const row = rows[i] || [];
    const iso = excelValueToISODate(row[dateIdx]);
    if (iso) {
      let particulars = String(row[textIdx] == null ? "" : row[textIdx]).trim();
      const debit = Number(row[debitIdx]) || 0;
      const credit = Number(row[creditIdx]) || 0;
      const vchNo = vchNoIdx >= 0 ? String(row[vchNoIdx] == null ? "" : row[vchNoIdx]).trim() : "";
      const vchType = vchTypeIdx >= 0 ? String(row[vchTypeIdx] == null ? "" : row[vchTypeIdx]).trim() : "";
      let j = i + 1;
      const extraLines = [];
      while (j < rows.length) {
        const nrow = rows[j] || [];
        if (excelValueToISODate(nrow[dateIdx])) break;
        const ntext = String(nrow[textIdx] == null ? "" : nrow[textIdx]).trim();
        const nflag = String(nrow[flagIdx] == null ? "" : nrow[flagIdx]).trim().toLowerCase();
        if (nflag === "dr" || nflag === "cr") break;
        if (ntext && !isNumericOnly(ntext)) extraLines.push(ntext);
        j++;
      }
      if (extraLines.length) particulars = (particulars ? particulars + " - " : "") + extraLines.join("; ");
      if (debit > 0 || credit > 0) {
        entries.push({
          entry_date: iso,
          purpose: particulars || "(no description)",
          category: vchType || null,
          ledger_folio: vchNo || null,
          amount: debit > 0 ? debit : credit,
          entry_type: debit > 0 ? "receipt" : "payment",
        });
      }
      i = j;
    } else {
      i++;
    }
  }
  return entries;
}

// Parses the SATCO "Petty Cash Form ST" template (sheet "Petty Cash Form ST..."): a header block
// with the account holder's name on the "Currency:" labeled row, then a table with columns
// No. | Date | Bill Ref | Supplier | Details | Cheque No./Payment Mode | Incomes | Expenses | VAT | ...
function parseSatcoPettyCashForm(rows) {
  let accountRow = -1, accountCol = -1;
  for (let i = 0; i < Math.min(rows.length, 10); i++) {
    const row = rows[i] || [];
    for (let c = 0; c < row.length; c++) {
      if (String(row[c] == null ? "" : row[c]).trim().toLowerCase() === "currency:") {
        accountRow = i;
        for (let c2 = c + 1; c2 < row.length; c2++) {
          if (String(row[c2] == null ? "" : row[c2]).trim()) { accountCol = c2; break; }
        }
        break;
      }
    }
    if (accountRow >= 0) break;
  }
  let account = null;
  if (accountRow >= 0 && accountCol >= 0) {
    account = String(rows[accountRow][accountCol]).trim().replace(/^SATCO\s+ARABIA\s*/i, "").trim() || null;
  }

  let headerRow = -1, dateIdx = -1, billRefIdx = -1, supplierIdx = -1, detailsIdx = -1, payModeIdx = -1, incomeIdx = -1, expenseIdx = -1, costCodeDescIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const row = rows[i] || [];
    const lower = row.map((c) => String(c == null ? "" : c).trim().toLowerCase());
    const dIdx = lower.indexOf("date");
    const incIdx = lower.findIndex((c) => c.indexOf("incomes") === 0);
    const expIdx = lower.findIndex((c) => c.indexOf("expenses") === 0);
    if (dIdx >= 0 && incIdx >= 0 && expIdx >= 0) {
      headerRow = i; dateIdx = dIdx; incomeIdx = incIdx; expenseIdx = expIdx;
      billRefIdx = lower.findIndex((c) => c.indexOf("bill ref") === 0);
      supplierIdx = lower.indexOf("supplier");
      detailsIdx = lower.indexOf("details");
      payModeIdx = lower.findIndex((c) => c.indexOf("cheque no") === 0 || c.indexOf("payment mode") >= 0);
      costCodeDescIdx = lower.findIndex((c) => c.indexOf("cost code") === 0 && c.indexOf("description") >= 0);
      break;
    }
  }
  if (headerRow === -1) return null; // not this template

  const entries = [];
  for (let i = headerRow + 1; i < rows.length; i++) {
    const row = rows[i] || [];
    const firstCell = String(row[0] == null ? "" : row[0]).trim().toLowerCase();
    if (firstCell === "summary" || firstCell === "previous balance:" || firstCell.indexOf("prepared by") === 0) break;
    const iso = excelValueToISODate(row[dateIdx]);
    const income = Number(row[incomeIdx]) || 0;
    const expense = Number(row[expenseIdx]) || 0;
    if (!iso || (income <= 0 && expense <= 0)) continue;
    const details = detailsIdx >= 0 ? String(row[detailsIdx] == null ? "" : row[detailsIdx]).trim() : "";
    const supplier = supplierIdx >= 0 ? String(row[supplierIdx] == null ? "" : row[supplierIdx]).trim() : "";
    const billRef = billRefIdx >= 0 ? String(row[billRefIdx] == null ? "" : row[billRefIdx]).trim() : "";
    const payMode = payModeIdx >= 0 ? String(row[payModeIdx] == null ? "" : row[payModeIdx]).trim() : "";
    const costCodeDesc = costCodeDescIdx >= 0 ? String(row[costCodeDescIdx] == null ? "" : row[costCodeDescIdx]).trim() : "";
    entries.push({
      entry_date: iso,
      account: account,
      purpose: details || supplier || "(no description)",
      supplier: supplier || null,
      ledger_folio: billRef || null,
      payment_mode: payMode || null,
      category: costCodeDesc || null,
      amount: income > 0 ? income : expense,
      entry_type: income > 0 ? "receipt" : "payment",
    });
  }
  return entries;
}

function PettyCash() {
  const [entries, setEntries] = useState([]);
  const [error, setError] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [entryType, setEntryType] = useState("payment");
  const [uploading, setUploading] = useState(false);
  const [importing, setImporting] = useState(false);
  const [importMsg, setImportMsg] = useState(null);
  const [accountFilter, setAccountFilter] = useState("all");
  const [cashbookView, setCashbookView] = useState("both");
  const [search, setSearch] = useState("");
  const [employeeOptions, setEmployeeOptions] = useState([]); // {employee_id, full_name} from HR master, for the Employee ID datalist below

  useEffect(() => {
    sb.from("wps_employee_master").select("employee_id,full_name").eq("active", true).order("employee_id").then(({ data }) => setEmployeeOptions(data || []));
  }, []);

  async function handleImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    setImporting(true);
    setImportMsg(null);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

      let toImport = parseSatcoPettyCashForm(rows) || [];

      if (toImport.length === 0) {
        toImport = parseTallyPettyCash(rows) || [];
      }

      if (toImport.length === 0) {
        // Fallback: simple two-block layout (Date, Particulars, Ledger Folio, Amount on both Dr and Cr sides)
        for (let r = 0; r < rows.length; r++) {
          const row = rows[r] || [];
          const rDate = row[0], rPart = row[1], rFolio = row[2], rAmt = row[3];
          const cDate = row[5], cPart = row[6], cFolio = row[7], cAmt = row[8];
          const rIso = excelValueToISODate(rDate);
          const cIso = excelValueToISODate(cDate);
          if (rIso && rPart && Number(rAmt) > 0) {
            toImport.push({ entry_date: rIso, purpose: String(rPart).trim(), ledger_folio: rFolio ? String(rFolio).trim() : null, amount: Number(rAmt) || 0, entry_type: "receipt" });
          }
          if (cIso && cPart && Number(cAmt) > 0) {
            toImport.push({ entry_date: cIso, purpose: String(cPart).trim(), ledger_folio: cFolio ? String(cFolio).trim() : null, amount: Number(cAmt) || 0, entry_type: "payment" });
          }
        }
      }

      if (toImport.length === 0) {
        setImportMsg("No rows recognized. This importer supports the SATCO \"Petty Cash Form ST\" template (No. / Date / Bill Ref / Supplier / Details / Incomes / Expenses), a Tally-style Petty Cash Book export (Date / Particulars / Vch Type / Vch No. / Debit / Credit), or the Dr/Cr two-block layout (Date, Particulars, Ledger Folio, Amount) with a header row.");
        return;
      }
      const { error: insErr } = await ops().from("petty_cash").insert(toImport);
      if (insErr) throw insErr;
      setImportMsg("Imported " + toImport.length + " entries (" + toImport.filter((x) => x.entry_type === "receipt").length + " receipts, " + toImport.filter((x) => x.entry_type === "payment").length + " payments).");
      e.target.value = "";
      await load();
    } catch (err) {
      setImportMsg("Import failed: " + (err.message || "unknown error"));
    } finally {
      setImporting(false);
    }
  }

  async function load() {
    const { data, error } = await ops().from("petty_cash").select("*").order("entry_date", { ascending: false }).order("created_at", { ascending: false });
    if (error) { setError(error.message); return; }
    setEntries(data || []);
  }
  useEffect(() => { load(); }, []);

  async function handleSubmit(e) {
    e.preventDefault();
    setError(null);
    const f = new FormData(e.target);
    setUploading(true);
    try {
      let receiptUrl = null;
      const file = f.get("bill_file");
      if (file && file.size > 0) {
        const path = Date.now() + "-" + file.name;
        const { error: upErr } = await sb.storage.from("petty-cash-receipts").upload(path, file);
        if (upErr) throw upErr;
        receiptUrl = path;
      }
      const payload = {
        entry_date: f.get("entry_date"),
        account: f.get("account") || null,
        employee_id: f.get("employee_id") ? String(f.get("employee_id")).trim().toUpperCase() : null,
        purpose: f.get("purpose"),
        supplier: f.get("supplier") || null,
        category: f.get("category") || null,
        ledger_folio: f.get("ledger_folio") || null,
        payment_mode: f.get("payment_mode") || null,
        amount: Number(f.get("amount")),
        approved_by: f.get("approved_by") || null,
        entry_type: entryType,
        receipt_url: receiptUrl,
        recoverable: f.get("recoverable") === "on",
      };
      const { error: insErr } = await ops().from("petty_cash").insert(payload);
      if (insErr) throw insErr;
      e.target.reset();
      setEntryType("payment");
      await load();
    } catch (err) {
      setError(err.message || "Save failed");
    } finally {
      setUploading(false);
    }
  }

  async function handleDelete(entry) {
    if (!window.confirm("Delete this " + entry.entry_type + " of " + fmt(entry.amount) + " dated " + entry.entry_date + "? This cannot be undone.")) return;
    const { error } = await ops().from("petty_cash").delete().eq("id", entry.id);
    if (error) { setError(error.message); return; }
    load();
  }

  const accountOptions = Array.from(new Set(entries.map((e) => e.account).filter(Boolean))).sort();
  const accountFiltered = accountFilter === "all" ? entries : entries.filter((e) => (e.account || "") === accountFilter);
  const searchQuery = search.trim().toLowerCase();
  const visibleEntries = !searchQuery ? accountFiltered : accountFiltered.filter((e) =>
    [e.account, e.purpose, e.supplier, e.ledger_folio, e.payment_mode, e.category, e.amount]
      .some((v) => (v || "").toString().toLowerCase().includes(searchQuery))
  );

  const receipts = visibleEntries.filter((e) => e.entry_type === "receipt");
  const cashPayments = visibleEntries.filter((e) => e.entry_type !== "receipt");
  const totalReceipts = receipts.reduce((s, e) => s + Number(e.amount), 0);
  const totalPayments = cashPayments.reduce((s, e) => s + Number(e.amount), 0);
  const balance = totalReceipts - totalPayments;

  function renderSide(list, colCount) {
    return (
      <table className="data-table">
        <thead><tr><th>Date</th><th>Account</th><th>Emp ID</th><th>Particulars</th><th>Supplier</th><th>Bill Ref</th><th>Amount</th><th>Recoverable</th><th>Bill</th><th>Actions</th></tr></thead>
        <tbody>
          {list.map((e) => (
            editingId === e.id ? (
              <EditPettyCashRow key={e.id} entry={e} colSpan={colCount} employeeOptions={employeeOptions} onCancel={() => setEditingId(null)} onSaved={() => { setEditingId(null); load(); }} />
            ) : (
              <tr key={e.id}>
                <td>{e.entry_date}</td>
                <td>{e.account || "—"}</td>
                <td>{e.employee_id || "—"}</td>
                <td>{e.purpose}</td>
                <td>{e.supplier || "—"}</td>
                <td>{e.ledger_folio || "—"}</td>
                <td>{fmt(e.amount)}</td>
                <td>{e.employee_id && e.recoverable ? <span className="badge-overdue">Yes</span> : "—"}</td>
                <td>{e.receipt_url ? <button className="btn-mini" onClick={() => viewFile("petty-cash-receipts", e.receipt_url)}>View</button> : "—"}</td>
                <td>
                  <button className="btn-mini" onClick={() => setEditingId(e.id)}>Edit</button>
                  <button className="btn-mini danger" onClick={() => handleDelete(e)}>Delete</button>
                </td>
              </tr>
            )
          ))}
          {list.length === 0 && <tr className="empty-row"><td colSpan={colCount}>No entries yet.</td></tr>}
        </tbody>
        <tfoot>
          <tr>
            <td colSpan={6} style={{ textAlign: "right", fontWeight: 700 }}>Total</td>
            <td style={{ fontWeight: 700 }}>{fmt(list.reduce((s, e) => s + Number(e.amount), 0))}</td>
            <td colSpan={3}></td>
          </tr>
        </tfoot>
      </table>
    );
  }

  return (
    <div>
      <style>{".cashbook-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;} .cashbook-side-title{margin:0 0 10px;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;} @media (max-width: 900px){.cashbook-grid{grid-template-columns:1fr;}}"}</style>

      <div className="content-card" style={{ marginBottom: 18 }}>
        <div className="form-grid" style={{ marginBottom: 0 }}>
          <div className="field">
            <label>Account</label>
            <select value={accountFilter} onChange={(e) => setAccountFilter(e.target.value)}>
              <option value="all">All accounts</option>
              {accountOptions.map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
          </div>
        </div>
      </div>

      <div className="kpi-grid" style={{ marginBottom: 18 }}>
        <div className="kpi-card">
          <div className="kpi-label">Petty Cash Balance{accountFilter !== "all" ? " — " + accountFilter : ""}</div>
          <div className="kpi-value" style={{ color: balance >= 0 ? "var(--success)" : "var(--danger)" }}>
            {balance >= 0 ? "+" : "−"}{fmt(Math.abs(balance))}
          </div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">Total Receipts</div>
          <div className="kpi-value">{fmt(totalReceipts)}</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">Total Payments</div>
          <div className="kpi-value">{fmt(totalPayments)}</div>
        </div>
      </div>

      <div className="content-card">
        <h3>Add petty cash entry</h3>
        <form onSubmit={handleSubmit} className="form-grid">
          <div className="field">
            <label>Entry Type</label>
            <select value={entryType} onChange={(e) => setEntryType(e.target.value)}>
              <option value="payment">Payment (Cr — money out)</option>
              <option value="receipt">Receipt (Dr — money in)</option>
            </select>
          </div>
          <div className="field"><label>Account</label><input type="text" name="account" list="petty-cash-accounts" placeholder="e.g. Aswani" /></div>
          <datalist id="petty-cash-accounts">{accountOptions.map((a) => <option key={a} value={a} />)}</datalist>
          <div className="field">
            <label>Employee ID</label>
            <input type="text" name="employee_id" list="petty-cash-employees" placeholder="e.g. SA1005" style={{ textTransform: "uppercase" }} />
          </div>
          <datalist id="petty-cash-employees">{employeeOptions.map((emp) => <option key={emp.employee_id} value={emp.employee_id}>{emp.full_name}</option>)}</datalist>
          <div className="field"><label>Date</label><input type="date" name="entry_date" required /></div>
          <div className="field"><label>Particulars / Details</label><input type="text" name="purpose" required /></div>
          <div className="field"><label>Supplier</label><input type="text" name="supplier" placeholder="Optional" /></div>
          <div className="field"><label>Bill Ref / Folio</label><input type="text" name="ledger_folio" placeholder="Optional" /></div>
          <div className="field"><label>Payment Mode</label><input type="text" name="payment_mode" placeholder="Optional" /></div>
          <div className="field"><label>Category</label><input type="text" name="category" placeholder="Optional" /></div>
          <div className="field"><label>Amount</label><input type="number" step="0.01" name="amount" required /></div>
          <div className="field"><label>Approved By</label><input type="text" name="approved_by" /></div>
          <div className="field" style={{ display: "flex", alignItems: "center", gap: 8, paddingBottom: 6 }}>
            <input type="checkbox" id="pc-recoverable" name="recoverable" style={{ width: 16, height: 16 }} />
            <label htmlFor="pc-recoverable" style={{ marginBottom: 0, fontWeight: 700, fontSize: 12.5 }}>Recoverable from employee?</label>
          </div>
          <div className="field"><label>Bill / Receipt Screenshot</label><input type="file" name="bill_file" accept="image/*,.pdf" /></div>
          <button className="btn-primary" type="submit" disabled={uploading}>{uploading ? "Saving…" : "Save"}</button>
        </form>
        {error && <div className="alert-card">{error}</div>}
      </div>

      <div className="content-card">
        <h3>Import petty cash records</h3>
        <p className="page-desc" style={{ margin: "0 0 10px" }}>Upload a petty cash file to import — supports the SATCO "Petty Cash Form ST" template (Date / Bill Ref / Supplier / Details / Incomes / Expenses, one sheet per account holder), a Tally-style Petty Cash Book export (Debit/Credit columns), or a simple Dr/Cr two-block cashbook layout (Date, Particulars, Ledger Folio, Amount).</p>
        <input type="file" accept=".xlsx,.xls,.xlsm,.csv" onChange={handleImport} disabled={importing} />
        {importing && <p style={{ fontSize: 13, color: "var(--muted)" }}>Importing…</p>}
        {importMsg && <div className={importMsg.indexOf("failed") === -1 && importMsg.indexOf("No rows") === -1 ? "alert-card" : "alert-card"} style={importMsg.indexOf("Imported") === 0 ? { background: "var(--success-soft)", color: "#166534", borderColor: "#bbf7d0" } : {}}>{importMsg}</div>}
      </div>

      <div className="content-card">
        <div className="section-head">
          <h3>Petty Cash Book</h3>
          <input type="text" className="search-input" value={search} onChange={(e)=>setSearch(e.target.value)} placeholder="Search particulars, supplier, bill ref…" />
        </div>
        <div className="cashbook-toggle">
          <button type="button" className={cashbookView === "both" ? "active" : ""} onClick={() => setCashbookView("both")}>Both</button>
          <button type="button" className={cashbookView === "receipts" ? "active" : ""} onClick={() => setCashbookView("receipts")}>Receipts</button>
          <button type="button" className={cashbookView === "payments" ? "active" : ""} onClick={() => setCashbookView("payments")}>Payments</button>
        </div>
        {cashbookView === "both" && (
          <div className="cashbook-grid">
            <div>
              <h4 className="cashbook-side-title">Dr. — Receipts</h4>
              <div className="table-scroll">{renderSide(receipts, 10)}</div>
            </div>
            <div>
              <h4 className="cashbook-side-title">Cr. — Payments</h4>
              <div className="table-scroll">{renderSide(cashPayments, 10)}</div>
            </div>
          </div>
        )}
        {cashbookView === "receipts" && (
          <div>
            <h4 className="cashbook-side-title">Dr. — Receipts</h4>
            <div className="table-scroll">{renderSide(receipts, 10)}</div>
          </div>
        )}
        {cashbookView === "payments" && (
          <div>
            <h4 className="cashbook-side-title">Cr. — Payments</h4>
            <div className="table-scroll">{renderSide(cashPayments, 10)}</div>
          </div>
        )}
      </div>
    </div>
  );
}

function Statements() {
  const [customers, setCustomers] = useState([]);
  const [pos, setPos] = useState([]);
  const [customerId, setCustomerId] = useState("");
  const [poId, setPoId] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [invoices, setInvoices] = useState([]);
  const [search, setSearch] = useState("");

  useEffect(() => {
    ops().from("customers").select("id, name, contact_email").order("name").then(({ data }) => setCustomers(data || []));
    ops().from("purchase_orders").select("id, po_no, customer_id").order("po_no").then(({ data }) => setPos(data || []));
  }, []);

  useEffect(() => {
    let query = ops().from("invoice_summary").select("*").order("invoice_date", { ascending: false });
    if (customerId) query = query.eq("customer_id", customerId);
    if (poId) query = query.eq("po_id", poId);
    query.then(({ data }) => setInvoices(data || []));
  }, [customerId, poId]);

  // Narrow the PO dropdown to the selected customer's POs, if a customer is chosen
  const poOptions = customerId ? pos.filter((p) => p.customer_id === customerId) : pos;

  // Apply the payment-status filter on top of the customer/PO filtered set
  const statusFiltered = statusFilter === "unpaid"
    ? invoices.filter((i) => Number(i.balance_due) > 0)
    : statusFilter === "paid"
    ? invoices.filter((i) => i.computed_status === "Paid")
    : invoices;
  const searchQuery = search.trim().toLowerCase();
  const visibleInvoices = !searchQuery ? statusFiltered : statusFiltered.filter((i) =>
    [i.invoice_no, i.po_no, i.customer_name, i.currency, i.computed_status]
      .some((v) => (v || "").toString().toLowerCase().includes(searchQuery))
  );

  // Totals grouped by currency, since a filtered set could span more than one currency
  const currencyTotals = visibleInvoices.reduce((acc, i) => {
    const cur = i.currency || "AED";
    acc[cur] = (acc[cur] || 0) + Number(i.balance_due);
    return acc;
  }, {});

  const buckets = [
    { label: "Current / Not Due", test: (d) => d === 0 },
    { label: "1 - 30 days", test: (d) => d >= 1 && d <= 30 },
    { label: "31 - 60 days", test: (d) => d >= 31 && d <= 60 },
    { label: "61 - 90 days", test: (d) => d >= 61 && d <= 90 },
    { label: "90+ days", test: (d) => d > 90 },
  ].map((b) => ({ ...b, total: visibleInvoices.filter((i) => b.test(i.days_delayed)).reduce((s, i) => s + Number(i.balance_due), 0) }));

  function exportExcel() {
    const rows = visibleInvoices.map((i) => ({
      "Invoice No.": i.invoice_no, "Invoice Date": i.invoice_date, "PO No.": i.po_no, "Customer": i.customer_name,
      "Currency": i.currency || "AED", "Invoice Value": i.invoice_value, "Amount Paid": i.amount_paid, "Balance Due": i.balance_due,
      "Due Date": i.due_date, "Paid Date": i.paid_date || "", "Days Delayed": i.days_delayed,
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Statement");
    XLSX.writeFile(wb, "statement_of_account.xlsx");
  }

  function exportPDF() {
    // A4 landscape, fixed column widths so names/POs never wrap letter-by-letter
    const doc = new jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const M = 12;
    const NAVY = [15, 23, 42];
    const GOLD = [184, 134, 11];

    const poCustomerId = poId ? (pos.find((p) => p.id === poId) || {}).customer_id : null;
    const selCustomer = customers.find((c) => c.id === (customerId || poCustomerId));
    const selPo = poId ? pos.find((p) => p.id === poId) : null;
    const today = new Date();
    const todayStr = today.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
    const fmtD = (d) => {
      if (!d) return "—";
      const x = new Date(d);
      return isNaN(x) ? d : x.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
    };

    // ── Header band
    doc.setFillColor(...NAVY);
    doc.rect(0, 0, pageW, 24, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold"); doc.setFontSize(15);
    doc.text("SATCO ARABIA GENERAL CONTRACTING LLC – SPC", M, 11);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5);
    doc.text("Abu Dhabi, United Arab Emirates  |  accounts@satcoarabiaengg.com  |  www.satcoarabiaengg.com", M, 17);
    doc.setFont("helvetica", "bold"); doc.setFontSize(16);
    doc.text("STATEMENT OF ACCOUNT", pageW - M, 14, { align: "right" });
    doc.setFillColor(...GOLD);
    doc.rect(0, 24, pageW, 1.2, "F");

    // ── Bill-to / statement info block
    doc.setTextColor(...NAVY);
    doc.setFontSize(9); doc.setFont("helvetica", "bold");
    doc.text("TO:", M, 33);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10.5);
    doc.text(selCustomer ? selCustomer.name : "All Customers", M + 9, 33);
    if (selPo) { doc.setFontSize(9); doc.text("Purchase Order: " + selPo.po_no, M + 9, 38.5); }

    const infoX = pageW - M - 70;
    doc.setFontSize(9);
    const info = [
      ["Statement Date:", todayStr],
      ["Filter:", statusFilter === "unpaid" ? "Unpaid invoices" : statusFilter === "paid" ? "Paid invoices" : "All invoices"],
      ["No. of Invoices:", String(visibleInvoices.length)],
    ];
    info.forEach(([k, v], idx) => {
      doc.setFont("helvetica", "bold"); doc.text(k, infoX, 33 + idx * 5);
      doc.setFont("helvetica", "normal"); doc.text(v, pageW - M, 33 + idx * 5, { align: "right" });
    });

    // ── Main table
    const showCustomerCol = !selCustomer;
    const head = ["Invoice No.", "Inv. Date", "PO No.", ...(showCustomerCol ? ["Customer"] : []), "Cur.", "Invoice Value", "Paid", "Balance Due", "Due Date", "Paid Date", "Days Late"];
    const body = visibleInvoices.map((i) => [
      i.invoice_no, fmtD(i.invoice_date), i.po_no || "—", ...(showCustomerCol ? [i.customer_name || ""] : []),
      i.currency || "AED", fmt(i.invoice_value), fmt(i.amount_paid), fmt(i.balance_due),
      fmtD(i.due_date), i.paid_date ? fmtD(i.paid_date) : "—", String(i.days_delayed ?? 0),
    ]);
    const foot = Object.entries(currencyTotals).map(([cur, total]) => {
      const valTot = visibleInvoices.filter((i) => (i.currency || "AED") === cur).reduce((s, i) => s + Number(i.invoice_value || 0), 0);
      const paidTot = visibleInvoices.filter((i) => (i.currency || "AED") === cur).reduce((s, i) => s + Number(i.amount_paid || 0), 0);
      const lead = showCustomerCol ? 5 : 4;
      return [{ content: "TOTAL (" + cur + ")", colSpan: lead, styles: { halign: "right" } }, fmt(valTot), fmt(paidTot), fmt(total), { content: "", colSpan: 3 }];
    });

    // Column widths (mm) — total usable width is 273mm on A4 landscape with 12mm margins
    const w = showCustomerCol
      ? [26, 22, 32, 48, 12, 26, 24, 26, 22, 22, 13]
      : [32, 26, 48, 14, 30, 28, 30, 26, 26, 13];
    const colStyles = {};
    w.forEach((cw, idx) => { colStyles[idx] = { cellWidth: cw }; });
    const align = (label, h) => { const c = head.indexOf(label); colStyles[c] = { ...colStyles[c], halign: h }; };
    ["Invoice Value", "Paid", "Balance Due"].forEach((l) => align(l, "right"));
    ["Cur.", "Inv. Date", "Due Date", "Paid Date", "Days Late"].forEach((l) => align(l, "center"));

    doc.autoTable({
      startY: 48,
      margin: { left: M, right: M, bottom: 16 },
      head: [head], body, foot,
      theme: "grid",
      styles: { font: "helvetica", fontSize: 8.5, cellPadding: 2, overflow: "linebreak", valign: "middle", lineColor: [203, 213, 225], lineWidth: 0.2, textColor: [15, 23, 42] },
      headStyles: { fillColor: NAVY, textColor: 255, fontStyle: "bold", halign: "center" },
      footStyles: { fillColor: [224, 242, 254], textColor: NAVY, fontStyle: "bold", halign: "right" },
      alternateRowStyles: { fillColor: [248, 250, 252] },
      columnStyles: colStyles,
      showFoot: "lastPage",
      didParseCell: (data) => {
        if (data.section === "body" && data.column.index === head.length - 1 && Number(data.cell.raw) > 0) {
          data.cell.styles.textColor = [220, 38, 38];
          data.cell.styles.fontStyle = "bold";
        }
        if (data.section === "body" && data.column.index === head.length - 4) data.cell.styles.fontStyle = "bold"; // balance
      },
      didDrawPage: () => {
        const n = doc.internal.getNumberOfPages();
        doc.setFontSize(7.5); doc.setTextColor(100, 116, 139); doc.setFont("helvetica", "normal");
        doc.text("This is a system-generated statement. Please notify accounts@satcoarabiaengg.com of any discrepancy within 7 days.", M, pageH - 8);
        doc.text("Page " + n, pageW - M, pageH - 8, { align: "right" });
      },
    });

    // ── Aging summary + amount due box (kept together; new page if not enough room)
    let y = doc.lastAutoTable.finalY + 8;
    if (y > pageH - 60) { doc.addPage(); y = 20; }
    const mainCur = Object.keys(currencyTotals)[0] || "AED";
    doc.autoTable({
      startY: y,
      margin: { left: M },
      tableWidth: 110,
      head: [["Aging Summary", "Amount (" + mainCur + ")"]],
      body: buckets.map((b) => [b.label, fmt(b.total)]),
      theme: "grid",
      styles: { fontSize: 8.5, cellPadding: 1.8, lineColor: [203, 213, 225], lineWidth: 0.2, textColor: [15, 23, 42] },
      headStyles: { fillColor: NAVY, textColor: 255, fontStyle: "bold" },
      columnStyles: { 1: { halign: "right" } },
      didParseCell: (data) => {
        if (data.section === "body" && data.row.index > 0 && Number(String(data.cell.raw).replace(/,/g, "")) > 0 && data.column.index === 1) {
          data.cell.styles.textColor = [220, 38, 38]; data.cell.styles.fontStyle = "bold";
        }
      },
    });

    const boxW = 95, boxX = pageW - M - boxW;
    const totalsArr = Object.entries(currencyTotals);
    const boxH = 12 + totalsArr.length * 8;
    doc.setFillColor(...NAVY);
    doc.roundedRect(boxX, y, boxW, boxH, 2, 2, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9);
    doc.text("TOTAL AMOUNT OUTSTANDING", boxX + 5, y + 7);
    doc.setFont("helvetica", "bold"); doc.setFontSize(14);
    totalsArr.forEach(([cur, total], idx) => doc.text(cur + " " + fmt(total), boxX + boxW - 5, y + 15 + idx * 8, { align: "right" }));

    const custSlug = selCustomer ? selCustomer.name.replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "") : "All_Customers";
    doc.save("SOA_" + custSlug + "_" + today.toISOString().slice(0, 10) + ".pdf");
  }

  function emailStatement() {
    const poCustomerId = poId ? (pos.find((p) => p.id === poId) || {}).customer_id : null;
    const targetCustomer = customers.find((c) => c.id === (customerId || poCustomerId));
    if (!targetCustomer || !targetCustomer.contact_email) {
      alert("No contact email on file for this customer. Add one to the customer record, or export and send manually.");
      return;
    }
    const lines = visibleInvoices.map((i) => `${i.invoice_no}  |  Due ${i.due_date}  |  ${i.currency || "AED"} ${fmt(i.balance_due)} outstanding`);
    const totalsLine = Object.entries(currencyTotals).map(([cur, total]) => `${cur} ${fmt(total)}`).join(", ") || "0.00";
    const body = `Dear ${targetCustomer.name},\n\nPlease find below your current statement of account.\n\n${lines.join("\n")}\n\nTotal outstanding: ${totalsLine}\n\nKindly arrange payment at your earliest convenience. (Please attach the exported Excel/PDF statement to this email before sending — mail links can't carry attachments automatically.)\n\nRegards,\nSATCO`;
    const mailto = `mailto:${encodeURIComponent(targetCustomer.contact_email)}?subject=${encodeURIComponent("Statement of Account - " + targetCustomer.name)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;
  }

  const hasFilter = customerId || poId;

  return (
    <div>
      <div className="content-card">
        <div className="form-grid">
          <div className="field">
            <label>Customer</label>
            <select value={customerId} onChange={(e) => { setCustomerId(e.target.value); setPoId(""); }}>
              <option value="">All customers…</option>
              {customers.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Purchase Order</label>
            <select value={poId} onChange={(e) => setPoId(e.target.value)}>
              <option value="">All POs…</option>
              {poOptions.map((p) => <option key={p.id} value={p.id}>{p.po_no}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Payment Status</label>
            <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
              <option value="all">All</option>
              <option value="unpaid">Unpaid only</option>
              <option value="paid">Paid only</option>
            </select>
          </div>
          <div className="field">
            <label>Search</label>
            <input type="text" value={search} onChange={(e)=>setSearch(e.target.value)} placeholder="Invoice no., PO, customer…" />
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn-secondary" onClick={exportExcel}>Export Excel</button>
            <button className="btn-secondary" onClick={exportPDF}>Export PDF</button>
            {hasFilter && <button className="btn-secondary" onClick={emailStatement}>Email to Customer</button>}
          </div>
        </div>
        {hasFilter && <div className="hint-text" style={{color:"var(--muted)"}}>Emailing opens a draft in your mail client — attach the exported Excel/PDF before sending, since mail links can't carry attachments.</div>}
      </div>

      <div className="content-card">
        <div className="table-scroll">
        <table className="data-table">
          <thead><tr><th>Invoice No.</th><th>Date</th><th>PO No.</th><th>Customer</th><th>Currency</th><th>Value</th><th>Paid</th><th>Balance</th><th>Due Date</th><th>Paid Date</th><th>Days Delayed</th></tr></thead>
          <tbody>
            {visibleInvoices.map((i) => (
              <tr key={i.id} className={i.computed_status === "Paid" ? "row-paid" : ""} title="Double-click to open the invoice" style={{cursor:"pointer"}} onDoubleClick={(e) => { if (isRowControl(e)) return; if (i.source_file_url) viewFile("invoice-documents", i.source_file_url); else openFinanceDoc("invoice", i.invoice_no); }}>
                <td>{i.invoice_no}</td><td>{i.invoice_date}</td><td>{i.po_no}</td><td>{i.customer_name}</td>
                <td>{i.currency || "AED"}</td>
                <td>{fmt(i.invoice_value)}</td><td>{fmt(i.amount_paid)}</td><td>{fmt(i.balance_due)}</td>
                <td>{i.due_date}</td><td>{i.paid_date || "—"}</td><td className={i.days_delayed > 0 ? "badge-overdue" : ""}>{i.days_delayed}</td>
              </tr>
            ))}
            {visibleInvoices.length === 0 && <tr className="empty-row"><td colSpan="11">{invoices.length === 0 ? "No invoices found." : "No invoices match your search."}</td></tr>}
          </tbody>
          <tfoot>
            {Object.entries(currencyTotals).map(([cur, total]) => (
              <tr key={cur} style={{ fontWeight: 800, background: "var(--accent-soft)" }}>
                <td colSpan="8">Grand Total Outstanding Balance ({cur})</td><td>{fmt(total)}</td><td colSpan="2"></td>
              </tr>
            ))}
          </tfoot>
        </table>
        </div>
      </div>

      <div className="content-card">
        <h3>Aging Summary</h3>
        <div className="table-scroll">
        <table className="data-table" style={{ minWidth: 320, maxWidth: 420 }}>
          <tbody>
            {buckets.map((b) => (<tr key={b.label}><td>{b.label}</td><td>{fmt(b.total)}</td></tr>))}

        </div>

  );
}

// ─── PREVIOUS-MONTH STATUS (read-only) ───────────────────────────────────────
// Same data as the Mobilisation portal's Supplier / Customer Status tabs (satco-finance /api/month-status).
const msShort = t => String(t || "").replace(/[,\-–]/g, " ").split(/\s+/).filter(Boolean).slice(0, 2).join(" ");
function MonthStatusPanel({ kind }) {
  const [data, setData] = useState(null);
  const [err, setErr] = useState("");
  const [open, setOpen] = useState(true);
  const [showDone, setShowDone] = useState(false);
  async function load() {
    setErr("");
    try {
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch("https://finance.satcoarabiaengg.com/api/month-status", { headers: { Authorization: "Bearer " + (session ? session.access_token : "") } });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(j.error || ("HTTP " + res.status));
      setData(j);
    } catch (e) { setErr(e.message); }
  }
  useEffect(() => { load(); }, []);
  const fmtD = d => d ? new Date(d).toLocaleDateString("en-GB", { day: "2-digit", month: "short" }) : "";
  const money = (v, c) => (c || "AED") + " " + Number(v || 0).toLocaleString("en", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const chip = (ok, label, sub) => <span style={{ padding: "3px 9px", borderRadius: 999, fontSize: 11, fontWeight: 800, whiteSpace: "nowrap", border: "1px solid " + (ok ? "#86efac" : "#fecaca"), background: ok ? "#dcfce7" : "#fef2f2", color: ok ? "#166534" : "#b91c1c" }}>{label}{sub ? <span style={{ fontWeight: 600, marginLeft: 4, opacity: .8 }}>{sub}</span> : null}</span>;
  const monthLabel = data ? new Date(data.month + "-01T00:00:00").toLocaleDateString("en-GB", { month: "long", year: "numeric" }) : "previous month";
  const allRows = data ? (kind === "supplier" ? data.suppliers : data.customers) : [];
  // Only what is still pending is listed — once the invoice is received/recorded (supplier) or raised (customer)
  // it lives in the table below. "Show completed" brings the finished ones back.
  const isDone = r => kind === "supplier" ? !!(r.finance || r.invoice_received) : (r.invoices || []).length > 0;
  const doneCount = allRows.filter(isDone).length;
  const rows = showDone ? allRows : allRows.filter(r => !isDone(r));
  const tot = allRows.length;
  const k1 = kind === "supplier" ? allRows.filter(r => r.ts_sent).length : allRows.filter(r => r.ts_sent).length;
  const k2 = kind === "supplier" ? allRows.filter(r => r.invoice_received).length : allRows.filter(r => (r.invoices || []).length).length;
  const k3 = kind === "supplier" ? allRows.filter(r => r.finance && r.finance.status === "Paid").length : allRows.filter(r => (r.invoices || []).length && r.invoices.every(i => i.computed_status === "Paid")).length;
  return (
    <div className="content-card" style={{ marginBottom: 14 }}>
      <div className="section-head" style={{ cursor: "pointer" }} onClick={() => setOpen(o => !o)}>
        <h3 style={{ margin: 0 }}>{kind === "supplier" ? "📋 Supplier invoices pending" : "🏢 Customer invoices pending"} — {monthLabel}</h3>
        <div style={{ display: "flex", gap: 8, alignItems: "center", fontSize: 12, fontWeight: 700 }}>
          <span>{tot} {kind === "supplier" ? "supplier(s)" : "customer(s)"}</span>
          <span style={{ color: "#d97706" }}>Timesheet not sent: {tot - k1}</span>
          <span style={{ color: "#dc2626" }}>{kind === "supplier" ? "Invoice not received" : "Invoice not raised"}: {tot - k2}</span>
          <span style={{ color: "#166534" }}>Paid: {k3}</span>
          {doneCount > 0 && <button className="btn-mini" onClick={e => { e.stopPropagation(); setShowDone(v => !v); }}>{showDone ? "Hide completed" : "Show completed (" + doneCount + ")"}</button>}
          <button className="btn-mini" onClick={e => { e.stopPropagation(); load(); }}>🔄</button>
          <span>{open ? "▲" : "▼"}</span>
        </div>
      </div>
      {err && <div style={{ padding: "8px 12px", color: "#b91c1c", fontSize: 12 }}>⚠ Could not load status: {err}</div>}
      {open && <div className="table-scroll">
        <table className="data-table">
          <thead>{kind === "supplier"
            ? <tr><th>Supplier</th><th>Customer · Site</th><th>Hrs</th><th>Deduction</th><th>Net Payable</th><th>Timesheet sent</th><th>Invoice received</th><th>Finance</th></tr>
            : <tr><th>Customer</th><th>Site</th><th>Workers</th><th>Hrs</th><th>Timesheet sent</th><th>Invoice raised</th><th>Payment</th></tr>}</thead>
          <tbody>
            {!data && !err && <tr><td colSpan={8} style={{ textAlign: "center", padding: 16, color: "#64748b" }}>Loading…</td></tr>}
            {data && !rows.length && <tr><td colSpan={8} style={{ textAlign: "center", padding: 16, color: "#4ade80", fontWeight: 700 }}>{allRows.length ? (kind === "supplier" ? "✓ All supplier invoices for " + monthLabel + " received — see the table below" : "✓ All customer invoices for " + monthLabel + " raised — see the table below") : "Nothing for " + monthLabel}</td></tr>}
            {kind === "supplier" && rows.map(r => (
              <tr key={r.key}>
                <td style={{ fontWeight: 700 }}>{r.supplier_name}</td>
                <td title={r.customer_name + " — " + r.location} style={{ fontSize: 12, whiteSpace: "nowrap" }}><b>{msShort(r.customer_name)}</b> · {msShort(r.location)}</td>
                <td>{r.hours}</td>
                <td style={{ color: r.deduction_total ? "#dc2626" : "#94a3b8" }}>{r.deduction_total ? "− " + money(r.deduction_total) : "—"}</td>
                <td style={{ fontWeight: 700 }}>{money(r.net_amount)}</td>
                <td>{chip(!!r.ts_sent, r.ts_sent ? "✓ Sent" : "✗ Not sent", r.ts_sent ? fmtD(r.ts_sent.at) : "")}</td>
                <td>{chip(!!r.invoice_received, r.invoice_received ? "✓ Received" : "✗ Not received", r.invoice_received ? [fmtD(r.invoice_received.at), r.invoice_received.invoice_no].filter(Boolean).join(" · ") : "")}</td>
                <td style={{ fontSize: 11, whiteSpace: "nowrap" }}>{!r.finance ? <span style={{ color: "#94a3b8" }}>Not recorded</span> : r.finance.status === "Paid" ? <span style={{ color: "#166534", fontWeight: 800 }}>✓ Paid {fmtD(r.finance.paid_date)}</span> : <span style={{ color: "#d97706", fontWeight: 700 }}>{r.finance.invoice_number} · unpaid</span>}</td>
              </tr>))}
            {kind === "customer" && rows.map(c => {
              const invs = c.invoices || []; const bal = invs.reduce((a, x) => a + (parseFloat(x.balance_due) || 0), 0); const allPaid = invs.length && invs.every(x => x.computed_status === "Paid");
              return (
                <tr key={c.customer_name + c.location}>
                  <td title={c.customer_name} style={{ fontWeight: 700, whiteSpace: "nowrap" }}>{msShort(c.customer_name)}</td>
                  <td title={c.location} style={{ fontSize: 12, whiteSpace: "nowrap" }}>{c.location ? msShort(c.location) : (c.from_mob ? "" : <span style={{ color: "#94a3b8" }}>(not on Mob timesheets)</span>)}</td>
                  <td>{c.workers ?? "—"}</td>
                  <td>{c.hours ?? "—"}</td>
                  <td>{chip(!!c.ts_sent, c.ts_sent ? "✓ Sent" : "✗ Not sent", c.ts_sent ? fmtD(c.ts_sent.at) : "")}</td>
                  <td style={{ fontSize: 11 }}>{invs.length ? invs.map(x => <div key={x.id} style={{ whiteSpace: "nowrap" }}><b>{x.invoice_no}</b> · {money(x.invoice_value, x.currency)}</div>) : chip(false, "✗ Not raised")}</td>
                  <td style={{ fontSize: 11, whiteSpace: "nowrap" }}>{!invs.length ? "—" : allPaid ? <span style={{ color: "#166534", fontWeight: 800 }}>✓ Paid</span> : <span style={{ color: invs.some(x => x.computed_status === "Overdue") ? "#dc2626" : "#d97706", fontWeight: 700 }}>Balance {money(bal, invs[0].currency)} · {[...new Set(invs.map(x => x.computed_status))].join(", ")}</span>}</td>
                </tr>);
            })}
          </tbody>
        </table>
      </div>}
    </div>
  );
}

// ─── SUPPLIER INVOICES ───────────────────────────────────────────────────────
// Reads from public.supplier_invoices (created in Finance Supabase project)
// same SUPABASE_URL / sb client used throughout this file.

const SI_STATUSES = ["Received","Approved","Due Soon","Paid","Disputed"];

function siAddDays(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().split("T")[0];
}
function siToday() { return new Date().toISOString().split("T")[0]; }
function siFmtDate(d) { return d ? new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) : "—"; }
function siFmt(n) { return n == null ? "—" : Number(n).toLocaleString("en-AE",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function siFmtAed(n) { return n == null || n === "" ? "—" : "AED " + siFmt(n); }
function siDaysUntil(d) { if (!d) return null; return Math.ceil((new Date(d)-new Date(siToday()))/86400000); }



function SupplierInvoices() {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("All");
  const [detailRow, setDetailRow] = useState(null);

  async function load() {
    setLoading(true);
    const { data, error } = await sb.from("supplier_invoices").select("*").order("created_at", { ascending: false });
    if (!error) setRows(data || []);
    setLoading(false);
  }
  // Live: any change made in the Finance portal shows here straight away (Supabase realtime), plus a 60s refresh as a fallback
  useEffect(() => {
    load();
    const ch = sb.channel("ops-supplier-invoices")
      .on("postgres_changes", { event: "*", schema: "public", table: "supplier_invoices" }, () => load())
      .subscribe();
    const t = setInterval(load, 60000);
    return () => { sb.removeChannel(ch); clearInterval(t); };
  }, []);

  const filtered = (rows || []).filter(r => {
    const ms = statusFilter === "All" || r.status === statusFilter;
    const q = search.toLowerCase();
    const mq = !q || r.supplier_name?.toLowerCase().includes(q) || r.invoice_number?.toLowerCase().includes(q) || r.description?.toLowerCase().includes(q);
    return ms && mq;
  });

  const stats = React.useMemo(() => {
    const pending = rows.filter(r => !["Paid","Disputed"].includes(r.status));
    const dueSoon = rows.filter(r => r.status === "Due Soon");
    const overdue = rows.filter(r => r.status !== "Paid" && r.due_date && siDaysUntil(r.due_date) < 0);
    const paidMo  = rows.filter(r => r.status === "Paid" && r.paid_date?.startsWith(siToday().substring(0,7)));
    return {
      total:      rows.length,
      pendingAmt: pending.reduce((s,r) => s + (parseFloat(r.total_amount)||0), 0),
      dueSoon:    dueSoon.length,
      overdue:    overdue.length,
      paidAmt:    paidMo.reduce((s,r) => s + (parseFloat(r.paid_amount||r.total_amount)||0), 0),
      paidCount:  paidMo.length,
    };
  }, [rows]);

  const badgeStyle = (status) => {
    const map = {
      Received:  { background:"#eff6ff", color:"#2563eb" },
      Approved:  { background:"#f0f9ff", color:"#0369a1" },
      "Due Soon":{ background:"#fef3c7", color:"#92400e" },
      Paid:      { background:"#dcfce7", color:"#166534" },
      Disputed:  { background:"#fee2e2", color:"#991b1b" },
    };
    return { padding:"2px 9px", borderRadius:999, fontSize:11, fontWeight:800, ...(map[status]||{background:"#f1f5f9",color:"#334155"}) };
  };

  // Detail overlay — read-only view of all fields
  function DetailOverlay({ row, onClose }) {
    const days = siDaysUntil(row.due_date);
    const variance = row.variance;
    return (
      <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.6)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20,backdropFilter:"blur(3px)"}}
           onClick={e => e.target===e.currentTarget && onClose()}>
        <div style={{background:"#fff",borderRadius:20,boxShadow:"0 20px 60px rgba(15,23,42,.2)",width:"100%",maxWidth:600,maxHeight:"88vh",overflowY:"auto",borderTop:"4px solid #0f172a"}}>
          <div style={{padding:"16px 22px 12px",borderBottom:"1px solid #e2e8f0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontWeight:900,fontSize:15,color:"#0f172a"}}>📄 Invoice Detail — {row.invoice_number||"No number"}</div>
            <button onClick={onClose} style={{width:30,height:30,borderRadius:"50%",border:"none",background:"#f1f5f9",cursor:"pointer",fontSize:16}}>×</button>
          </div>
          <div style={{padding:"18px 22px",display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 24px",fontSize:13}}>
            {[
              ["Supplier",        row.supplier_name],
              ["Invoice #",       row.invoice_number||"—"],
              ["Invoice Date",    siFmtDate(row.invoice_date)],
              ["Invoice Month",   row.invoice_month||"—"],
              ["Description",     row.description||"—"],
              ["Hours",           row.hours??"—"],
              ["Rate / Hr",       row.rate_per_hour ? `AED ${siFmt(row.rate_per_hour)}` : "—"],
              ["Deduction",       parseFloat(row.deduction_amount) ? `− AED ${siFmt(row.deduction_amount)}` : "—"],
              ["Deduction Reason", row.deduction_reason||"—"],
              ["Sub Total",       `AED ${siFmt(row.sub_total)}`],
              ["VAT Rate",        `${row.vat_rate??0}%`],
              ["VAT Amount",      `AED ${siFmt(row.vat_amount)}`],
              ["Total Amount",    `AED ${siFmt(row.total_amount)}`],
              ["Payment Terms",   `${row.payment_terms} days`],
              ["Due Date",        siFmtDate(row.due_date)],
              ["Reminder Date",   siFmtDate(row.reminder_date)],
              ["Mob Portal Amt",  row.mob_portal_amount ? `AED ${siFmt(row.mob_portal_amount)}` : "Not set"],
              ["Variance",        variance==null ? "—" : `AED ${siFmt(Math.abs(variance))} ${Math.abs(variance)<0.01?"✅":Math.abs(variance)<=50?"⚠️":"🚨"}`],
              ["Status",          row.status],
              ["Invoice Date",     siFmtDate(row.invoice_date)],
              ["Supplier Due Date",row.supplier_due_date ? siFmtDate(row.supplier_due_date)+" ("+row.supplier_payment_terms+"d)" : "—"],
              ["SATCO Due Date",   row.satco_due_date ? siFmtDate(row.satco_due_date)+" ("+row.satco_payment_days+"d)" : "—"],
              ["Paid Date",        row.paid_date ? siFmtDate(row.paid_date) : "—"],
              ["Amount Paid",      row.paid_amount ? siFmtAed(row.paid_amount) : "—"],
              ["Payment Mode",     row.paid_mode ? row.paid_mode.replace(/_/g," ") : "—"],
              ["Bank",             row.paid_bank||"—"],
              ["Cheque No.",       row.paid_cheque_no||"—"],
              ["Transaction Ref",  row.paid_transaction_ref||"—"],
              ["Notes",            row.notes||"—"],
            ].map(([label, val]) => (
              <div key={label} style={{display:"flex",flexDirection:"column",gap:2}}>
                <div style={{fontSize:11,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:".04em"}}>{label}</div>
                <div style={{fontWeight:600,color:"#0f172a"}}>{val}</div>
              </div>
            ))}
          </div>
          {row.image_url && (
            <div style={{padding:"0 22px 18px"}}>
              <button type="button" onClick={() => openStoredDoc(row.image_url)} className="btn-secondary" style={{display:"inline-flex",alignItems:"center",gap:6}}>
                📎 View Invoice Document
              </button>
            </div>
          )}
          <div style={{padding:"12px 22px",borderTop:"1px solid #e2e8f0",background:"#f8fafc",borderRadius:"0 0 20px 20px",fontSize:12,color:"#94a3b8",textAlign:"center"}}>
            Read-only — manage invoices in the Finance Portal
          </div>
        </div>
      </div>
    );
  }

  return (
    <>
      {detailRow && <DetailOverlay row={detailRow} onClose={() => setDetailRow(null)} />}
      <MonthStatusPanel kind="supplier" />

      {/* KPI STRIP */}
      <div className="kpi-grid" style={{gridTemplateColumns:"repeat(5,minmax(0,1fr))"}}>
        <div className="kpi-card">
          <div className="kpi-label">Total Invoices</div>
          <div className="kpi-value" style={{fontSize:22}}>{stats.total}</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">Outstanding (AED)</div>
          <div className="kpi-value" style={{fontSize:18}}>{siFmt(stats.pendingAmt)}</div>
        </div>
        <div className="kpi-card" style={{borderLeft:"3px solid #d97706"}}>
          <div className="kpi-label">⚠️ Due Soon</div>
          <div className="kpi-value" style={{fontSize:22,color:"#d97706"}}>{stats.dueSoon}</div>
        </div>
        <div className="kpi-card" style={{borderLeft:"3px solid #dc2626"}}>
          <div className="kpi-label">🚨 Overdue</div>
          <div className="kpi-value" style={{fontSize:22,color:"#dc2626"}}>{stats.overdue}</div>
        </div>
        <div className="kpi-card" style={{borderLeft:"3px solid #166534"}}>
          <div className="kpi-label">✅ Paid This Month</div>
          <div className="kpi-value" style={{fontSize:18,color:"#166534"}}>{siFmt(stats.paidAmt)}</div>
          <div style={{fontSize:11,color:"#64748b",marginTop:2}}>{stats.paidCount} invoice(s)</div>
        </div>
      </div>

      {/* TOOLBAR */}
      <div className="content-card">
        <div className="section-head">
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <select className="btn-secondary" value={statusFilter} onChange={e => setStatusFilter(e.target.value)} style={{padding:"7px 12px",borderRadius:10,fontSize:13}}>
              <option value="All">All Statuses</option>
              {SI_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
            <span style={{fontSize:12,color:"#94a3b8",fontStyle:"italic"}}>Manage invoices in Finance Portal</span>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <input className="search-input" placeholder="Search supplier, invoice no., description…" value={search} onChange={e => setSearch(e.target.value)}/>
            <button className="btn-secondary" onClick={load}>🔄</button>
          </div>
        </div>

        <div className="table-scroll">
          <table className="data-table">
            <thead>
              <tr>
                <th>Supplier</th>
                <th>Invoice #</th>
                <th>Month</th>
                <th>Description</th>
                <th>Hrs</th>
                <th>Rate</th>
                <th>Deduction</th>
                <th>Amount (AED)</th>
                <th>Mob Portal</th>
                <th>Variance</th>
                <th>Invoice Date</th>
                <th>Supplier Due</th>
                <th>SATCO Due</th>
                <th>Days</th>
                <th>Status</th>
                <th>Payment</th>
                <th>View</th>
              </tr>
            </thead>
            <tbody>
              {loading && (
                <tr><td colSpan={18} style={{textAlign:"center",padding:24,color:"#64748b"}}>Loading…</td></tr>
              )}
              {!loading && filtered.length === 0 && (
                <tr><td colSpan={18} style={{textAlign:"center",padding:24,color:"#64748b"}}>No supplier invoices found</td></tr>
              )}
              {!loading && filtered.map(r => {
                const days = siDaysUntil(r.satco_due_date || r.due_date);
                const daysLabel = r.status === "Paid" ? "Paid"
                  : days == null ? "—"
                  : days < 0 ? `${Math.abs(days)}d OVERDUE`
                  : days === 0 ? "TODAY"
                  : `${days}d`;
                const daysStyle = r.status === "Paid"
                  ? { color:"#166534", fontWeight:800 }
                  : days != null && days < 0  ? { color:"#dc2626", fontWeight:800 }
                  : days != null && days <= 3  ? { color:"#d97706", fontWeight:800 }
                  : {};
                const varNum = r.variance;
                const varStyle = varNum == null ? {}
                  : Math.abs(varNum) < 0.01 ? { color:"#166534", fontWeight:700 }
                  : Math.abs(varNum) <= 50   ? { color:"#d97706", fontWeight:700 }
                  : { color:"#dc2626", fontWeight:800 };
                return (
                  <tr key={r.id} title={r.image_url ? "Double-click to open the supplier's invoice" : "Double-click for details (no invoice file attached)"} onDoubleClick={(e) => { if (isRowControl(e)) return; if (r.image_url) openStoredDoc(r.image_url); else setDetailRow(r); }} style={{cursor:"pointer",background:r.status==="Paid"?"#dcfce7":r.status==="Due Soon"?"#fffbeb":r.status==="Disputed"?"#fef2f2":""}}>
                    <td style={{fontWeight:700}}>{r.supplier_name}</td>
                    <td style={{fontFamily:"monospace",fontSize:12}}>{r.invoice_number||"—"}</td>
                    <td>{r.invoice_month||"—"}</td>
                    <td style={{maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.description||"—"}</td>
                    <td>{r.hours??"—"}</td>
                    <td>{r.rate_per_hour??"—"}</td>
                    <td style={{color:parseFloat(r.deduction_amount)?"#dc2626":"#94a3b8",fontWeight:parseFloat(r.deduction_amount)?700:400}} title={r.deduction_reason||""}>{parseFloat(r.deduction_amount)?"− "+siFmt(r.deduction_amount):"—"}</td>
                    <td style={{fontWeight:800}}>
                      AED {siFmt(r.total_amount)}
                      {r.paid_amount && r.status==="Paid" && parseFloat(r.paid_amount)!==parseFloat(r.total_amount) && 
                        <div style={{fontSize:10,color:"#166534",fontWeight:600}}>Paid: AED {siFmt(r.paid_amount)}</div>}
                    </td>
                    <td>{r.mob_portal_amount ? `AED ${siFmt(r.mob_portal_amount)}` : <span style={{color:"#94a3b8"}}>—</span>}</td>
                    <td style={varStyle}>{varNum==null?"—":`${varNum>=0?"+":""}${siFmt(varNum)}`}</td>
                    <td>{siFmtDate(r.invoice_date)}</td>
                    <td style={{color:"#d97706",fontWeight:600,fontSize:12}}>
                      {siFmtDate(r.supplier_due_date||r.due_date)}
                      {r.supplier_payment_terms && <div style={{fontSize:10,color:"#94a3b8"}}>{r.supplier_payment_terms}d</div>}
                    </td>
                    <td style={{color:"#166534",fontWeight:700}}>
                      {siFmtDate(r.satco_due_date||r.due_date)}
                      {r.satco_payment_days && <div style={{fontSize:10,color:"#94a3b8"}}>{r.satco_payment_days}d</div>}
                    </td>
                    <td style={daysStyle}>{daysLabel}</td>
                    <td><span style={badgeStyle(r.status)}>{r.status}</span></td>
                    <td style={{fontSize:11,minWidth:110}}>
                      {r.status==="Paid"
                        ? <div>
                            <div style={{color:"#166534",fontWeight:800}}>{siFmtDate(r.paid_date)}</div>
                            <div style={{color:"#64748b"}}>{siFmtAed(r.paid_amount||r.total_amount)}</div>
                            <div style={{color:"#94a3b8",fontSize:10}}>{r.paid_mode==="cheque"?"CHQ "+r.paid_cheque_no:r.paid_mode==="bank_transfer"?"TRF "+r.paid_transaction_ref:"Cash"} {r.paid_bank?"· "+r.paid_bank:""}</div>
                          </div>
                        : <span style={{color:"#cbd5e1"}}>Pending</span>}
                    </td>
                    <td>
                      <button className="btn-mini" onClick={() => setDetailRow(r)}>👁 View</button>
                      {r.image_url && <button type="button" onClick={() => openStoredDoc(r.image_url)} className="btn-mini" style={{marginLeft:4}}>📎</button>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}



function App() {
  const session = useAuth();
  const [view, setView] = useState("dashboard");
  const [mobileNavOpen, setMobileNavOpen] = useState(false);

  if (session === undefined) return <div style={{ padding: 40 }}>Loading…</div>;
  if (!session) return <LoginScreen />;

  const titles = {
    dashboard: ["Dashboard", "Money in and out, what's due, ageing, PO usage and petty cash — updates live"],
    pos: ["Purchase Orders", "Upload POs and let AI pull the fields for review"],
    invoices: ["Customer Invoices", "Raise customer invoices — against a PO, or customer-only when there is no PO. Proformas from Finance show here tagged PROFORMA (view only)"],
    supplier_invoices: ["Supplier Invoices", "Supplier invoices recorded in the Finance portal — view only, updates live"],
    pettycash: ["Petty Cash", "Track small day-to-day office expenses"],
    statements: ["Statements of Account", "Per-client balance, aging, and export"],
  };
  const [title, desc] = titles[view];

  return (
    <div className="satco-shell sh-navy">
      <Sidebar view={view} setView={setView} mobileOpen={mobileNavOpen} onCloseMobile={() => setMobileNavOpen(false)} />
      <main className="satco-main">
        <div className="topbar">
          <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
            <button className="hamburger-btn" onClick={() => setMobileNavOpen(true)} aria-label="Open menu">☰</button>
            <div>
              <h1 className="page-title">{title}</h1>
              <p className="page-desc">{desc}</p>
            </div>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <a className="hub-link" href="https://hub.satcoarabiaengg.com" title="Back to SATCO Hub">⌂ Hub</a>
            <button className="signout-btn" onClick={() => sb.auth.signOut()}>Sign out</button>
          </div>
        </div>
        {view === "dashboard" && <Dashboard setView={setView} userEmail={session.user.email} />}
        {view === "pos" && <PurchaseOrders />}
        {view === "invoices" && <Invoices />}
        {view === "supplier_invoices" && <SupplierInvoices />}
        {view === "pettycash" && <PettyCash />}
        {view === "statements" && <Statements />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

// Click-and-drag horizontal scrolling for every scrollable table (applies site-wide:
// Invoices, Purchase Orders, Petty Cash, Statements — any .table-scroll container).
(function () {
  let active = null, startX = 0, startScroll = 0;
  document.addEventListener("mousedown", (e) => {
    const el = e.target.closest(".table-scroll");
    if (!el || e.button !== 0) return;
    active = el;
    startX = e.pageX;
    startScroll = el.scrollLeft;
    el.classList.add("dragging");
  });
  document.addEventListener("mousemove", (e) => {
    if (!active) return;
    e.preventDefault();
    active.scrollLeft = startScroll - (e.pageX - startX);
  });
  function release() {
    if (active) active.classList.remove("dragging");
    active = null;
  }
  document.addEventListener("mouseup", release);
  document.addEventListener("mouseleave", release);
})();
</script>
</body>
</html>
